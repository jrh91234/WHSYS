                                                                </div>
                                                                <div className="font-bold text-slate-700 truncate" title={h}>{h || `Col ${i}`}</div>
                                                            </div>
                                                        </ResizableTh>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {bomData[currentPreviewSheet]?.slice(1).map((row, ri) => {
                                                    const rowPartNo = String(row[pNoCol] || "").trim();

                                                    return (

                                                            {!rowPartNo ? <span className="text-slate-200">-</span>

                                                            : thumb ? (
                                                                <div className="relative group inline-block">
                                                                    <DriveImg src={thumb} fileId={coverFileId(rowPartNo)} size={400} alt={rowPartNo}
                                                                        onClick={() => setLightbox({ partNo: rowPartNo, fileId: coverFileId(rowPartNo), src: imgSrcFor(rowPartNo, 1600) })}
                                                                        className="w-10 h-10 object-cover rounded border cursor-zoom-in mx-auto" />
                                                                    <button onClick={() => pickImageFor(rowPartNo)} title="เพิ่มรูป"
                                                                        className="absolute -top-1 -right-1 bg-blue-600 text-white rounded-full w-4 h-4 text-[8px] opacity-0 group-hover:opacity-100 transition flex items-center justify-center"><i className="fa-solid fa-plus"></i></button>
                                                                </div>
                                                            ) : (
                                                                <button onClick={() => pickImageFor(rowPartNo)} title="อัปโหลดรูป"
                                                                    className="w-10 h-10 rounded border border-dashed border-slate-300 text-slate-300 hover:text-blue-500 hover:border-blue-400 mx-auto flex items-center justify-center"><i className="fa-solid fa-camera"></i></button>
                                                            )}
                                                        </td>
                                                        {row.map((c, ci) => {
                                                            const isName = ci===nameCol && rowPartNo;
                                                            return (
                                                            <td key={ci}
                                                                className={`p-2 border-r max-w-[150px]
                                                                ${ci===pNoCol?'bg-blue-50 text-blue-700 font-bold truncate':''}
                                                                ${ci===qtyCol?'bg-sky-50 text-sky-700 font-bold truncate':''}
                                                                ${isName?'bg-emerald-50 p-0 overflow-hidden':'truncate'}
                                                            `}>{isName ? (
                                                                <button type="button"
                                                                    onClick={() => setNamePopup({ partNo: rowPartNo, name: String(c||"") })}
                                                                    title="กดเพื่อถ่ายรูป / จัดการรูปพาร์ทนี้"
                                                                    className="w-full h-full text-left px-2 py-2 text-emerald-700 font-medium active:bg-emerald-100 hover:underline flex items-center gap-1 min-w-0">
                                                                    <i className="fa-solid fa-camera text-emerald-400 text-[10px] shrink-0"></i>
                                                                    <span className="truncate">{c}</span>
                                                                </button>
                                                            ) : c}</td>
                                                            );
                                                        })}
                                                    </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="mt-4 text-xs text-slate-500 flex gap-4">
                                        <span>Part No: <b className="text-blue-600">{pNoCol}</b></span>
                                        <span>Name: <b className="text-emerald-600">{nameCol}</b></span>
                                        <span>Qty: <b className="text-sky-600">{qtyCol}</b></span>
                                        <span>Level: <b className="text-purple-600">{lvlCol}</b></span>
                                        <span>Type: <b className="text-orange-600">{typeCol}</b></span>
                                    </div>
                                    <button onClick={()=>setStep(2)} className="w-full mt-6 bg-blue-600 text-white py-3 rounded-xl font-bold">Next: Functions</button>
                                </>
                            ) : <div className="text-center py-20 text-slate-400">กดปุ่ม Sync เพื่อโหลดข้อมูล BOM</div>}
                        </div>
                    )}

                    {step === 2 && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border">
                             <div className="flex gap-4 border-b mb-6 overflow-x-auto pb-1">
                                 <button onClick={()=>setMode('plan')} className={`pb-2 px-2 text-sm font-bold whitespace-nowrap transition ${mode==='plan'?'border-b-2 border-blue-600 text-blue-600':'text-slate-400 hover:text-slate-600'}`}><Icons.Production className="mr-1"/> Production Plan</button>
                                 <button onClick={()=>setMode('compare')} className={`pb-2 px-2 text-sm font-bold whitespace-nowrap transition ${mode==='compare'?'border-b-2 border-purple-600 text-purple-600':'text-slate-400 hover:text-slate-600'}`}><Icons.Compare className="mr-1"/> BOM Compare</button>
                             </div>
                            
                            {mode === 'plan' && (
                                <>
                                    <textarea value={orderText} onChange={e=>setOrderText(e.target.value)} className="w-full h-40 p-4 border rounded-xl font-mono text-sm mb-4 outline-none focus:ring-2 focus:ring-blue-100" placeholder="ModelA 100&#10;ModelB 50"></textarea>
                                    <button onClick={handlePreCalculate} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2">
                                        <Icons.Check/> Check & Calculate
                                    </button>
                                </>
                            )}
                            
                            {mode === 'compare' && (
                                <>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                                        {compareList.map((m, i) => (
                                            <div key={i}>
                                                <label className="text-xs font-bold text-purple-500">Model {i+1}</label>
                                                <select value={m} onChange={e=>{const l=[...compareList]; l[i]=e.target.value; setCompareList(l);}} className="w-full p-2 border rounded">
                                                    <option value="">-- Select --</option>
                                                    {sheetNames.map(s=><option key={s} value={s}>{s}</option>)}
                                                </select>
                                            </div>
                                        ))}
                                        <button onClick={()=>setCompareList([...compareList, ""])} className="mt-6 border border-dashed rounded text-purple-500 hover:bg-purple-50"><Icons.Plus/></button>
                                    </div>
                                    <button onClick={handleCompare} className="w-full bg-purple-600 text-white py-3 rounded-xl font-bold">Compare</button>
                                    {compResult && (
                                      <div className="mt-6">
                                        <div className="flex justify-end gap-2 mb-2">
                                            <button onClick={exportCompareExcel} className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 hover:bg-emerald-700"><i className="fa-solid fa-file-excel"></i> Excel</button>
                                            <button onClick={exportComparePDF} className="bg-red-500 text-white px-3 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 hover:bg-red-600"><i className="fa-solid fa-file-pdf"></i> PDF</button>
                                        </div>
                                        <div className="overflow-auto border rounded-xl max-h-96">
                                            <table className="w-full text-xs text-left">
                                                <thead className="bg-purple-50 sticky top-0">
                                                    <tr><th className="p-3">Part No</th>{compResult.models.map((m,i)=><th key={i} className="p-3 text-right">{m}</th>)}<th className="p-3 text-center">Status</th></tr>
                                                </thead>
                                                <tbody>
                                                    {compResult.rows.map((r,i)=>(
                                                        <tr key={i} className={r.status==='Diff'?'bg-orange-50':''}>
                                                            <td className="p-3 font-bold text-slate-700">{r.partNo}<div className="text-[10px] font-normal text-slate-400">{r.name}</div></td>
                                                            {r.quantities.map((q,qi)=><td key={qi} className="p-3 text-right">{formatNum(q)}</td>)}
                                                            <td className="p-3 text-center">{r.status==='Diff'?<span className="text-orange-600 font-bold">Diff</span>:'-'}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                      </div>
                                    )}
                                </>
                            )}

                        </div>
                    )}

                    {step === 3 && (finalSummary || finalTree) && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="font-bold">MRP Result</h3>
                                <div className="flex gap-2">
                                    <div className="bg-slate-100 p-1 rounded-lg flex text-xs font-bold">
                                        <button onClick={()=>setResultViewMode('tree')} className={`px-3 py-1.5 rounded-md transition ${resultViewMode==='tree'?'bg-white shadow text-blue-600':'text-slate-500'}`}>Tree View</button>
                                        <button onClick={()=>setResultViewMode('summary')} className={`px-3 py-1.5 rounded-md transition ${resultViewMode==='summary'?'bg-white shadow text-blue-600':'text-slate-500'}`}>Total Summary</button>
                                    </div>
                                    <button onClick={()=>exportToExcel(resultViewMode === 'tree' ? finalTree : finalSummary, "MRP_Result")} className="text-green-600 font-bold text-sm flex items-center gap-2 px-3 py-1 hover:bg-green-50 rounded"><Icons.Excel/> Export</button>
                                </div>
                            </div>

                            {resultViewMode === 'summary' ? (
                                <div className="overflow-auto max-h-[60vh]">
                                    <table className="w-full text-xs text-left">
                                        <thead className="bg-slate-50 sticky top-0 cursor-pointer shadow-sm">
                                            <tr>
                                                <th className="p-3 border text-center hover:bg-slate-100" onClick={()=>requestSort('level')}>Level {sortConfig.key==='level' && <Icons.Sort/>}</th>
                                                <th className="p-3 border hover:bg-slate-100" onClick={()=>requestSort('partNo')}>Part No {sortConfig.key==='partNo' && <Icons.Sort/>}</th>
                                                <th className="p-3 border hover:bg-slate-100" onClick={()=>requestSort('name')}>Description {sortConfig.key==='name' && <Icons.Sort/>}</th>
                                                <th className="p-3 border hover:bg-slate-100" onClick={()=>requestSort('type')}>Type {sortConfig.key==='type' && <Icons.Sort/>}</th>
                                                <th className="p-3 border text-right hover:bg-slate-100" onClick={()=>requestSort('reqQty')}>Total Req {sortConfig.key==='reqQty' && <Icons.Sort/>}</th>
                                                <th className="p-3 border text-right hover:bg-slate-100" onClick={()=>requestSort('onHand')}>Stock {sortConfig.key==='onHand' && <Icons.Sort/>}</th>
                                                <th className="p-3 border text-right hover:bg-slate-100" onClick={()=>requestSort('diff')}>Balance {sortConfig.key==='diff' && <Icons.Sort/>}</th>
                                                <th className="p-3 border text-center">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {sortedSummary.map((item, i) => (
                                                <tr key={i} className={item.diff < 0 ? 'bg-red-50' : ''}>
                                                    <td className="p-3 border text-slate-500 font-mono text-center">{item.level}</td>
                                                    <td className="p-3 border font-mono font-bold text-blue-600 cursor-pointer hover:underline hover:bg-blue-50" onClick={()=>setBreakdownItem(item)}>
                                                        <div className="flex items-center gap-2">
                                                            {item.partNo} <Icons.Search className="text-slate-400 text-[10px]"/>
                                                        </div>
                                                    </td>
                                                    <td className="p-3 border text-slate-500">{item.name}</td>
                                                    <td className="p-3 border text-slate-500">{item.type}</td>
                                                    <td className="p-3 border text-right font-bold">{formatNum(item.reqQty)}</td>
                                                    <td className="p-3 border text-right">{formatNum(item.onHand)}</td>
                                                    <td className={`p-3 border text-right font-bold ${item.diff < 0 ? 'text-red-600' : 'text-green-600'}`}>{formatNum(item.diff)}</td>
                                                    <td className="p-3 border text-center">
                                                        {item.diff < 0 ? <span className="text-[10px] bg-red-600 text-white px-2 py-0.5 rounded">Short</span> : <span className="text-[10px] bg-green-600 text-white px-2 py-0.5 rounded">OK</span>}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            ) : (
                                <div className="overflow-auto max-h-[60vh]">
                                    <table className="w-full text-xs text-left">
                                        <thead className="bg-slate-50 sticky top-0 shadow-sm">
                                            <tr>
                                                <th className="p-3 border w-2/5">Item / Component</th>
                                                <th className="p-3 border">Description</th>
                                                <th className="p-3 border text-center">Type</th>
                                                <th className="p-3 border text-right">Qty/Unit</th>
                                                <th className="p-3 border text-right">Req Qty</th>
                                                <th className="p-3 border text-right">Stock</th>
                                                <th className="p-3 border text-right">Balance</th>

                                                    return (

                                                                {row.name} ({row.partNo})

                                                        </tr>

                                                                <span className="text-slate-300 mr-1">└─</span>
                                                                <span className="font-bold text-slate-700">{row.partNo}</span>
                                                            </div>
                                                        </td>
                                                        <td className="p-3 border text-slate-500">{row.name}</td>
                                                        <td className="p-3 border text-center text-slate-400">{row.type}</td>
                                                        <td className="p-3 border text-right text-slate-400">{formatNum(row.qpu)}</td>
                                                        <td className="p-3 border text-right font-bold text-slate-700">{formatNum(row.reqQty)}</td>
                                                        <td className="p-3 border text-right text-slate-500">{formatNum(row.onHand)}</td>
                                                        <td className={`p-3 border text-right font-bold ${row.diff < 0 ? 'text-red-600' : 'text-green-600'}`}>
                                                            {formatNum(row.diff)}
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    )}

                    {showConfirmModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 animate-fade-in">
                                <h3 className="text-lg font-bold mb-4 flex items-center gap-2"><Icons.Search className="text-blue-500"/> ตรวจสอบการจับคู่ BOM</h3>
                                <div className="space-y-2 mb-6 max-h-60 overflow-y-auto">
                                    {matchCandidates.map((c, i) => (
                                        <div key={i} className="flex justify-between items-center p-3 bg-slate-50 rounded-lg border">
                                            <div>
                                                <div className="text-xs text-slate-400">คุณพิมพ์: <b>{c.model}</b></div>
                                                <div className="text-sm font-bold flex items-center gap-2">
                                                    {c.score > 0.5 ? <Icons.Check className="text-green-500 text-xs"/> : <Icons.Warn className="text-orange-500 text-xs"/>}
                                                    จับคู่กับ: 
                                                    <select value={c.matchedSheet} onChange={e => {
                                                        const n = [...matchCandidates]; n[i].matchedSheet = e.target.value; setMatchCandidates(n);
                                                    }} className="bg-white border rounded px-2 py-0.5 ml-1">
                                                        {sheetNames.map(s => <option key={s} value={s}>{s}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="text-right text-sm font-bold text-blue-600">x {c.qty}</div>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={()=>setShowConfirmModal(false)} className="flex-1 py-3 bg-slate-100 text-slate-500 font-bold rounded-xl">ยกเลิก</button>
                                    <button onClick={handleCalculateFinal} className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700">คำนวณเลย</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {breakdownItem && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" onClick={()=>setBreakdownItem(null)}>
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in" onClick={e=>e.stopPropagation()}>
                                <div className="bg-slate-100 p-4 border-b flex justify-between items-center">
                                    <div>
                                        <div className="text-xs text-slate-500 uppercase font-bold">Part No breakdown</div>
                                        <h3 className="font-bold text-blue-700 text-lg">{breakdownItem.partNo}</h3>
                                        <div className="text-xs text-slate-500">{breakdownItem.name}</div>
                                    </div>
                                    <button onClick={()=>setBreakdownItem(null)} className="text-slate-400 hover:text-slate-600"><Icons.X className="text-xl"/></button>
                                </div>
                                <div className="p-0 max-h-80 overflow-y-auto">
                                    <table className="w-full text-sm">
                                        <thead className="bg-slate-50 sticky top-0">
                                            <tr className="border-b text-xs text-slate-500">
                                                <th className="text-left py-2 px-4">Source Job / Model</th>
                                                <th className="text-right py-2 px-4">Qty Used</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {breakdownItem.breakdown.map((b, k) => (
                                                <tr key={k} className="hover:bg-slate-50">
                                                    <td className="py-2 px-4 text-slate-700 font-bold">{b.model}</td>
                                                    <td className="py-2 px-4 text-right font-mono font-bold">{formatNum(b.qty)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                        <tfoot className="bg-slate-50 font-bold border-t sticky bottom-0">
                                            <tr>
                                                <td className="py-3 px-4 text-slate-800">Total Required</td>
                                                <td className="py-3 px-4 text-right text-blue-600 text-lg">{formatNum(breakdownItem.reqQty)}</td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ตำแหน่งคอลัมน์มาตรฐานของชีต BOM (Part No / Name / Qty / Type) — ตรงกับค่าเริ่มต้นในหน้าแผนผลิต (MRP)
        const BOM_COLS = { pNoCol: 2, nameCol: 3, qtyCol: 4, typeCol: 6 };

        const SearchPartView = ({ inventory, bomData, apiUrl, partImages = {}, setPartImages, currentUser }) => {
            const sheetNames = useMemo(() => Object.keys(bomData || {}), [bomData]);
            const { searchPartQuery, setSearchPartQuery, partSearchResults, handlePartSearch } =
                usePartSearch(bomData, sheetNames, BOM_COLS);
            const {
                imgFileRef, lightbox, setLightbox, namePopup, setNamePopup,
                pickImageFor, handleImageFile, handleDeleteImage,
                imagesFor, imgSrcFor, imgSrcForFile, coverFileId
            } = usePartImageManager(apiUrl, partImages, setPartImages, currentUser);

            const exportSearchExcel = () => {
                if (!partSearchResults || partSearchResults.length === 0) return alert("ไม่มีผลการค้นหาให้ export");
                const data = partSearchResults.map(it => ({ "Part No": it.partNo, "Name": it.name, "Used In (Model)": it.model, "Qty": it.qty, "Type": it.type, "รูป (ลิงก์)": driveViewLink(partImages, it.partNo) }));
                exportToExcel(data, "Part_Search", "Search");
            };
            const exportSearchPDF = () => {
                if (!partSearchResults || partSearchResults.length === 0) return alert("ไม่มีผลการค้นหาให้ export");
                const headers = ["รูป", "Part No", "Name", "Used In (Model)", "Qty", "Type"];
                const rows = partSearchResults.map(it => {
                    const fid = partFileId(partImages, it.partNo);
                    return [fid ? { imgId: fid } : "", it.partNo, it.name, it.model, formatNum(it.qty), it.type];
                });
                exportTableToPDF("Part Search: " + (searchPartQuery || ""), headers, rows);
            };

            return (
                <div className="animate-fade-in space-y-6">
                    <ImagePreviewModals imgFileRef={imgFileRef} onFileChange={handleImageFile}
                        lightbox={lightbox} setLightbox={setLightbox} namePopup={namePopup} setNamePopup={setNamePopup}
                        imagesFor={imagesFor} imgSrcForFile={imgSrcForFile} pickImageFor={pickImageFor} handleDeleteImage={handleDeleteImage} />

                    <div className="bg-white p-6 rounded-2xl shadow-sm border">
                        <h3 className="font-bold mb-6 flex items-center gap-2"><Icons.Search/> ค้นหาพาร์ท</h3>

                        <div className="flex gap-2 mb-6">
                            <input
                                type="text"
                                value={searchPartQuery}
                                onChange={e => setSearchPartQuery(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && handlePartSearch()}
                                className="flex-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-orange-100"
                                placeholder="ระบุ Part No หรือ ชื่อสินค้า..."
                            />
                            <button onClick={handlePartSearch} className="bg-orange-500 text-white px-6 rounded-xl font-bold shadow-lg flex items-center gap-2">
                                <Icons.Search/> ค้นหา
                            </button>
                        </div>

                        {partSearchResults && (
                            <div className="overflow-hidden border rounded-xl">
                                <div className="bg-orange-50 p-3 text-xs font-bold text-orange-800 border-b flex justify-between items-center gap-2">
                                    <span>ผลการค้นหา: พบ {partSearchResults.length} รายการ</span>
                                    {partSearchResults.length > 0 && (
                                        <div className="flex gap-2">
                                            <button onClick={exportSearchExcel} className="bg-emerald-600 text-white px-3 py-1 rounded-lg font-bold flex items-center gap-1 hover:bg-emerald-700"><i className="fa-solid fa-file-excel"></i> Excel</button>
                                            <button onClick={exportSearchPDF} className="bg-red-500 text-white px-3 py-1 rounded-lg font-bold flex items-center gap-1 hover:bg-red-600"><i className="fa-solid fa-file-pdf"></i> PDF</button>
                                        </div>
                                    )}
                                </div>
                                <div className="overflow-auto max-h-96">
                                    <table className="w-full text-xs text-left">
                                        <thead className="bg-white sticky top-0">
                                            <tr className="border-b text-slate-500">
                                                <th className="p-3 w-14">รูป</th>
                                                <th className="p-3">Part No / Name</th>
                                                <th className="p-3">Used In (Model)</th>
                                                <th className="p-3 text-right">Qty/Unit</th>
                                                <th className="p-3 text-center">Type</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {partSearchResults.length === 0 ? (
                                                <tr><td colSpan="5" className="p-8 text-center text-slate-400">ไม่พบข้อมูล</td></tr>
                                            ) : (
                                                partSearchResults.map((item, idx) => {
                                                    const sPartNo = String(item.partNo||"").trim();
                                                    const sThumb = sPartNo ? imgSrcFor(sPartNo) : "";
                                                    return (
                                                    <tr key={idx} className="hover:bg-slate-50">
                                                        <td className="p-2 text-center">
                                                            {sThumb ? (
                                                                <DriveImg src={sThumb} fileId={coverFileId(sPartNo)} size={400} alt={item.partNo}
                                                                    onClick={() => setLightbox({ partNo: sPartNo, fileId: coverFileId(sPartNo), src: imgSrcFor(sPartNo, 1600) })}
                                                                    className="w-9 h-9 object-cover rounded border cursor-zoom-in mx-auto" />
                                                            ) : (
                                                                <button onClick={() => pickImageFor(sPartNo)} title="อัปโหลดรูป"
                                                                    className="w-9 h-9 rounded border border-dashed border-slate-300 text-slate-300 hover:text-blue-500 hover:border-blue-400 mx-auto flex items-center justify-center"><i className="fa-solid fa-camera"></i></button>
                                                            )}
                                                        </td>
                                                        <td className={sPartNo ? "p-0" : "p-3"}>
                                                            {sPartNo ? (
                                                                <button type="button"
                                                                    onClick={() => setNamePopup({ partNo: sPartNo, name: String(item.name||"") })}
                                                                    title="กดเพื่อถ่ายรูป / จัดการรูปพาร์ทนี้"
                                                                    className="w-full text-left p-3 active:bg-emerald-100 hover:bg-emerald-50">
                                                                    <div className="font-bold text-blue-600">{item.partNo}</div>
                                                                    <div className="text-slate-500"><i className="fa-solid fa-camera text-emerald-400 mr-1 text-[10px]"></i>{item.name}</div>
                                                                </button>
                                                            ) : (
                                                                <div className="p-3">
                                                                    <div className="font-bold text-blue-600">{item.partNo}</div>
                                                                    <div className="text-slate-500">{item.name}</div>
                                                                </div>
                                                            )}
                                                        </td>
                                                        <td className="p-3 font-bold text-slate-700">{item.model}</td>
                                                        <td className="p-3 text-right">{formatNum(item.qty)}</td>
                                                        <td className="p-3 text-center">{item.type}</td>
                                                    </tr>
                                                    );
                                                })
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const VisualSearchView = ({ inventory, bomData, apiUrl, partImages = {}, setPartImages, currentUser }) => {
            // แผนที่ Part No -> ชื่อ (จาก inventory + ทุกชีต BOM) สำหรับแสดงผลค้นหาด้วยรูป
            const partNameMap = useMemo(() => {
                const m = {};
                (inventory || []).forEach(it => { const p = String(it.partNo || "").trim(); if (p && !m[p]) m[p] = it.name || ""; });
                Object.keys(bomData || {}).forEach(sh => {
                    (bomData[sh] || []).slice(1).forEach(row => {
                        const p = String(row[BOM_COLS.pNoCol] || "").trim();
                        if (p && !m[p]) m[p] = String(row[BOM_COLS.nameCol] || "");
                    });
                });
                return m;
            }, [inventory, bomData]);

            const imgSearchRef = useRef(null);
            const {
                embeddings, negatives, visualBusy, visualMsg, indexProg,
                queryPreview, queryFile, visualResults,
                buildIndex, handleQueryImage, rejectMatch, undoRejectMatch, clearNegativeExamples
            } = useVisualSearch(apiUrl, partImages, partNameMap);

            const {
                imgFileRef, lightbox, setLightbox, namePopup, setNamePopup,
                pickImageFor, handleImageFile, handleDeleteImage, uploadOneImage,
                imagesFor, imgSrcFor, imgSrcForFile, coverFileId
            } = usePartImageManager(apiUrl, partImages, setPartImages, currentUser);

            const [submittingFeedback, setSubmittingFeedback] = useState(false);
            const [feedbackFor, setFeedbackFor] = useState({}); // partNo -> { type: 'yes'|'no', fileId?, embedding? }
            const [showNegManager, setShowNegManager] = useState(false);

            // ยืนยันว่ารูปที่ค้นหาคือพาร์ทนี้จริง -> บันทึกรูปนั้นเป็นรูปของพาร์ทเพิ่มอีก 1 รูป
            // แล้วสร้างดัชนีให้อัตโนมัติ (เหมือนอัปโหลดรูปปกติ) เพื่อให้ค้นหาครั้งถัดไปแม่นขึ้น
            const handleConfirmMatch = async (partNo) => {
                if (!queryFile || submittingFeedback) return;
                setSubmittingFeedback(true);
                try {
                    const json = await uploadOneImage(partNo, queryFile);
                    setFeedbackFor(prev => ({ ...prev, [partNo]: { type: 'yes', fileId: json.fileId } }));
                } catch (err) {
                    alert("บันทึกรูปไม่สำเร็จ: " + err.message);
                } finally {
                    setSubmittingFeedback(false);
                }
            };

            // ยืนยันว่ารูปที่ค้นหา "ไม่ใช่" พาร์ทนี้ -> เก็บไว้เป็นตัวอย่างลบ กันไม่ให้พาร์ทนี้ขึ้นมาสับสนซ้ำอีกในการค้นหาครั้งถัดไป
            const handleRejectMatch = async (partNo) => {
                if (submittingFeedback) return;
                setSubmittingFeedback(true);
                try {
                    const embedding = await rejectMatch(partNo);
                    setFeedbackFor(prev => ({ ...prev, [partNo]: { type: 'no', embedding } }));
                } catch (err) {
                    alert("บันทึกไม่สำเร็จ: " + err.message);
                } finally {
                    setSubmittingFeedback(false);
                }
            };

            // เลิกทำ "ใช่"/"ไม่ใช่" ล่าสุด — เผื่อกดผิดใบตอนพาร์ทหน้าตาคล้ายกันจนแยกไม่ออก
            const handleUndoFeedback = async (partNo) => {
                const fb = feedbackFor[partNo];
                if (!fb || submittingFeedback) return;
                setSubmittingFeedback(true);
                try {
                    if (fb.type === 'yes' && fb.fileId) await handleDeleteImage(partNo, fb.fileId);
                    else if (fb.type === 'no' && fb.embedding) await undoRejectMatch(partNo, fb.embedding);
                    setFeedbackFor(prev => { const n = { ...prev }; delete n[partNo]; return n; });
                } catch (err) {
                    alert("เลิกทำไม่สำเร็จ: " + err.message);
                } finally {
                    setSubmittingFeedback(false);
                }
            };

            return (
                <div className="animate-fade-in space-y-6">
                    <ImagePreviewModals imgFileRef={imgFileRef} onFileChange={handleImageFile}
                        lightbox={lightbox} setLightbox={setLightbox} namePopup={namePopup} setNamePopup={setNamePopup}
                        imagesFor={imagesFor} imgSrcForFile={imgSrcForFile} pickImageFor={pickImageFor} handleDeleteImage={handleDeleteImage} />

                    <div className="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                        <h3 className="font-bold flex items-center gap-2"><Icons.Camera/> ค้นหาด้วยรูป</h3>

                        <input type="file" ref={imgSearchRef} onChange={(e) => { setFeedbackFor({}); handleQueryImage(e); }} className="hidden" accept="image/*" capture="environment" />
                        <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-xs text-indigo-800 flex items-start gap-2">
                            <i className="fa-solid fa-circle-info mt-0.5"></i>
                            <span>ถ่ายรูปพาร์ทเพื่อค้นหาจากทั้งความเหมือนของรูปและตัวหนังสือ/label บนพาร์ท (OCR) — รูปที่อัปใหม่จะถูกสร้างดัชนีให้อัตโนมัติ ส่วนรูปเก่าที่ยังไม่มีดัชนีหรือยังไม่เคยอ่านตัวหนังสือ กดปุ่ม "สร้าง/อัปเดตดัชนีรูป" เพื่อประมวลผลย้อนหลัง — เจอผลลัพธ์ที่ใช่แล้วกด "ใช่" เพื่อฝึกระบบให้แม่นขึ้น หรือกด "ไม่ใช่" ถ้าผลลัพธ์ผิด เพื่อกันไม่ให้พาร์ทนั้นขึ้นมาสับสนซ้ำอีก (กดผิดใบ กด "เลิกทำ" ได้ทันที) — ผลลัพธ์ที่ความเหมือนเกิน {Math.round(REJECT_DISABLED_ABOVE_SCORE * 100)}% จะกด "ไม่ใช่" ไม่ได้ เพราะน่าจะถูกจริง ๆ อยู่แล้ว กันกดพลาด</span>
                        </div>
                        <div className="flex flex-wrap gap-2 items-center">
                            <button onClick={()=>imgSearchRef.current && imgSearchRef.current.click()} disabled={visualBusy} className="bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold flex items-center gap-2 disabled:opacity-50 hover:bg-indigo-700">
                                <i className="fa-solid fa-camera"></i> ถ่าย/เลือกรูปเพื่อค้นหา
                            </button>
                            <button onClick={buildIndex} disabled={visualBusy} className="bg-white border px-4 py-3 rounded-xl font-bold text-slate-600 flex items-center gap-2 disabled:opacity-50 hover:bg-slate-50">
                                <i className="fa-solid fa-database"></i> สร้าง/อัปเดตดัชนีรูป
                            </button>
                            <button onClick={()=>setShowNegManager(true)} className="bg-white border px-4 py-3 rounded-xl font-bold text-slate-600 flex items-center gap-2 hover:bg-slate-50">
                                <i className="fa-solid fa-ban"></i> จัดการตัวอย่างลบ
                            </button>
                            <span className="text-xs text-slate-500">
                                มีรูป {Object.values(partImages).reduce((s, arr) => s + (arr?.length || 0), 0)} ภาพ ({Object.keys(partImages).length} พาร์ท)
                                {" "}· ทำดัชนีแล้ว {Object.values(embeddings).reduce((s, arr) => s + (arr?.length || 0), 0)} ภาพ ({Object.keys(embeddings).length} พาร์ท)
                            </span>
                        </div>

                        {showNegManager && (
                            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-overlay" onClick={() => setShowNegManager(false)}>
                                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-5 animate-fade-in max-h-[80vh] overflow-auto" onClick={e => e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-3">
                                        <h4 className="font-bold">ตัวอย่างลบ (Negative Examples)</h4>
                                        <button onClick={() => setShowNegManager(false)} className="text-slate-400 hover:text-slate-600 text-xl"><Icons.X/></button>
                                    </div>
                                    <p className="text-[11px] text-slate-400 mb-3">รูปที่เคยกด "ไม่ใช่" ไว้ต่อพาร์ท — ถ้ากดพลาดไปตั้งแต่ก่อนมีปุ่ม "เลิกทำ" ลบล้างได้จากตรงนี้</p>
                                    {Object.keys(negatives).length === 0 ? (
                                        <div className="text-center text-xs text-slate-400 py-6">ยังไม่มีตัวอย่างลบ</div>
                                    ) : (
                                        <div className="divide-y">
                                            {Object.keys(negatives).map(p => (
                                                <div key={p} className="py-2 flex items-center justify-between gap-2">
                                                    <div className="min-w-0">
                                                        <div className="font-mono font-bold text-blue-600 text-sm truncate">{p}</div>
                                                        <div className="text-[11px] text-slate-500 truncate">{partNameMap[p] || ""} · {negatives[p].length} รูป</div>
                                                    </div>
                                                    <button onClick={() => clearNegativeExamples(p)} className="text-red-500 text-xs font-bold hover:bg-red-50 px-2 py-1 rounded-lg whitespace-nowrap">
                                                        ล้างทั้งหมด
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                        {visualBusy && (
                            <div className="text-sm text-slate-600 flex items-center gap-2">
                                <div className="loader" style={{width:16,height:16,borderWidth:2}}></div>
                                <span>{visualMsg}{indexProg.total ? ` (${indexProg.done}/${indexProg.total})` : ''}</span>
                            </div>
                        )}
                        {(queryPreview || visualResults) && (
                            <div className="flex flex-col sm:flex-row gap-4 items-start">
                                {queryPreview && (
                                    <div className="shrink-0">
                                        <div className="text-[10px] text-slate-400 mb-1">รูปที่ค้นหา</div>
                                        <img src={queryPreview} alt="query" className="w-28 h-28 object-cover rounded-lg border" />
                                    </div>
                                )}
                                <div className="flex-1 w-full">
                                    {visualResults && visualResults.length > 0 ? (
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                                            {visualResults.map((r,i)=>(
                                                <div key={i} className="border rounded-xl p-2 hover:shadow-md transition">
                                                    {coverFileId(r.partNo) ? (
                                                        <DriveImg src={imgSrcFor(r.partNo)} fileId={coverFileId(r.partNo)} size={400}
                                                            onClick={()=>setLightbox({partNo:r.partNo, fileId: coverFileId(r.partNo), src: imgSrcFor(r.partNo,1600)})}
                                                            className="w-full h-24 object-cover rounded-lg border mb-2 cursor-zoom-in" />
                                                    ) : <div className="w-full h-24 rounded-lg border mb-2 bg-slate-50"></div>}
                                                    <div className="font-mono font-bold text-blue-600 text-xs truncate">{r.partNo}</div>
                                                    <div className="text-[11px] text-slate-500 truncate" title={r.name}>{r.name}</div>
                                                    <div className="mt-1 h-1.5 bg-slate-100 rounded overflow-hidden"><div className="h-full bg-indigo-500" style={{width: Math.max(2,Math.round(r.score*100))+'%'}}></div></div>
                                                    <div className="text-[10px] text-slate-400 text-right flex items-center justify-between">
                                                        <span>{r.textSim > 0.2 ? <span className="text-amber-600 font-bold"><i className="fa-solid fa-tag mr-0.5"></i>ตัวหนังสือตรง</span> : null}</span>
                                                        <span>{Math.round(r.score*100)}%</span>
                                                    </div>
                                                    {feedbackFor[r.partNo] ? (
                                                        <div className="mt-2 flex items-center justify-between gap-1">
                                                            <span className={`text-[10px] font-bold ${feedbackFor[r.partNo].type === 'yes' ? 'text-emerald-600' : 'text-slate-400'}`}>
                                                                <i className={`fa-solid ${feedbackFor[r.partNo].type === 'yes' ? 'fa-check' : 'fa-xmark'} mr-1`}></i>
                                                                {feedbackFor[r.partNo].type === 'yes' ? 'บันทึกไว้ฝึกระบบแล้ว' : 'บันทึกว่าไม่ใช่แล้ว'}
                                                            </span>
                                                            <button onClick={() => handleUndoFeedback(r.partNo)} disabled={submittingFeedback}
                                                                className="text-[10px] text-blue-500 font-bold hover:underline disabled:opacity-50 whitespace-nowrap">
                                                                เลิกทำ
                                                            </button>
                                                        </div>
                                                    ) : r.score >= REJECT_DISABLED_ABOVE_SCORE ? (
                                                        <button onClick={() => handleConfirmMatch(r.partNo)} disabled={submittingFeedback}
                                                            title="ยืนยันว่ารูปที่ค้นหาคือพาร์ทนี้ เพื่อนำไปฝึกระบบให้แม่นขึ้น"
                                                            className="mt-2 w-full bg-emerald-600 text-white text-[10px] font-bold py-1.5 rounded-lg hover:bg-emerald-700 disabled:opacity-50">
                                                            ใช่ ✓
                                                        </button>
                                                    ) : (
                                                        <div className="mt-2 grid grid-cols-2 gap-1">
                                                            <button onClick={() => handleConfirmMatch(r.partNo)} disabled={submittingFeedback}
                                                                title="ยืนยันว่ารูปที่ค้นหาคือพาร์ทนี้ เพื่อนำไปฝึกระบบให้แม่นขึ้น"
                                                                className="bg-emerald-600 text-white text-[10px] font-bold py-1.5 rounded-lg hover:bg-emerald-700 disabled:opacity-50">
                                                                ใช่ ✓
                                                            </button>
                                                            <button onClick={() => handleRejectMatch(r.partNo)} disabled={submittingFeedback}
                                                                title="ยืนยันว่ารูปที่ค้นหาไม่ใช่พาร์ทนี้ กันไม่ให้ขึ้นมาสับสนซ้ำอีก"
                                                                className="bg-slate-100 text-slate-600 text-[10px] font-bold py-1.5 rounded-lg hover:bg-slate-200 disabled:opacity-50">
                                                                ไม่ใช่ ✕
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    ) : (visualResults && !visualBusy) ? (
                                        <div className="text-center text-slate-400 py-8">ไม่พบพาร์ทที่ใกล้เคียง</div>
                                    ) : null}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const DashboardView = ({ inventory, transactions, toInventory }) => {
            const totalItems = inventory.length;
            const lowStockItems = inventory.filter(i => i.qty <= (i.minStock || 0));
            
            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold">Dashboard</h2>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
                            <div className="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 text-xl"><Icons.Box/></div>
                            <div><div className="text-2xl font-bold">{totalItems}</div><div className="text-xs text-slate-500">Items in DB</div></div>
                        </div>
                        <div onClick={toInventory} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4 cursor-pointer hover:border-orange-300">
                            <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl ${lowStockItems.length > 0 ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-green-100 text-green-600'}`}><Icons.Warn/></div>
                            <div><div className={`text-2xl font-bold ${lowStockItems.length > 0 ? 'text-red-600' : 'text-green-600'}`}>{lowStockItems.length}</div><div className="text-xs text-slate-500">Low Stock Alert</div></div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border">
                            <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><Icons.Warn className="text-red-500"/> ต้องสั่งซื้อเพิ่ม (Reorder)</h3>
                            <div className="overflow-auto max-h-60">
                                <table className="w-full text-sm">
                                    <thead className="text-xs text-slate-400 border-b text-left"><tr><th className="pb-2">Part No</th><th className="pb-2 text-right">Stock</th><th className="pb-2 text-right">Min</th></tr></thead>
                                    <tbody>
                                        {lowStockItems.length === 0 ? <tr><td colSpan="3" className="py-4 text-center text-slate-400">Stock OK</td></tr> : 
                                         lowStockItems.map(i => (<tr key={i.partNo} className="border-b border-slate-50"><td className="py-2 text-blue-600">{i.partNo}</td><td className="py-2 text-right font-bold text-red-500">{formatNum(i.qty)}</td><td className="py-2 text-right text-slate-400">{formatNum(i.minStock)}</td></tr>))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border">
                            <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><Icons.History className="text-blue-500"/> ความเคลื่อนไหวล่าสุด</h3>
                            <div className="space-y-3">
                                {transactions.slice(0,5).map(tx => (
                                    <div key={tx.id} className="flex justify-between items-center text-sm border-b border-slate-50 pb-2">
                                        <div className="flex items-center gap-3">
                                            <div className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold ${tx.type==='IN'?'bg-green-100 text-green-700':tx.type==='OUT'?'bg-red-100 text-red-700':'bg-orange-100 text-orange-700'}`}>{tx.type}</div>
                                            <div><div className="font-bold text-slate-700">{tx.partNo}</div><div className="text-[10px] text-slate-400">{new Date(tx.date).toLocaleTimeString()}</div></div>
                                        </div>
                                        <div className="font-bold">{tx.type==='OUT'?'-':'+'}{formatNum(tx.qty)}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const InventoryView = ({ inventory, setInventory, addTransaction, deleteItem, apiUrl, currentUser, setTransactions, partImages = {}, setPartImages }) => {
            const [searchTerm, setSearchTerm] = useState("");
            const [editItem, setEditItem] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const fileInputRef = useRef(null);

            const {
                imgFileRef, uploadingPart, lightbox, setLightbox, namePopup, setNamePopup,
                pickImageFor, handleImageFile, handleDeleteImage,
                imagesFor, imgSrcFor, imgSrcForFile, coverFileId
            } = usePartImageManager(apiUrl, partImages, setPartImages, currentUser);

            const handleDownloadTemplate = () => {
                const templateData = [
                    { 
                        PartNo: "EX-001", 
                        Name: "Example Part", 
                        Qty: 100, 
                        Unit: "pcs", 
                        Cost: 10.5, 
                        Type: "Raw Material", 
                        Min: 10, 
                        Max: 1000 
                    }
                ];
                
                const ws = XLSX.utils.json_to_sheet(templateData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template");
                XLSX.writeFile(wb, "Inventory_Template.xlsx");
            };

            const handleImportExcel = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws);

                        if (data.length === 0) {
                            alert("ไม่พบข้อมูลในไฟล์ Excel");
                            return;
                        }

                        const itemsToImport = data.map(row => {
                            const partNo = String(row.PartNo || row.partno || row["Part No"] || "").trim();
                            if (!partNo) return null;

                            return {
                                partNo: partNo,
                                name: String(row.Name || row.name || "Unknown"),
                                qty: parseFloat(row.Qty || row.qty) || 0,
                                location: "-",
                                unit: String(row.Unit || row.unit || "pcs"),
                                minStock: parseFloat(row.Min || row.min || 0),
                                type: String(row.Type || row.type || "Raw Material")
                            };
                        }).filter(item => item !== null);

                        if (itemsToImport.length === 0) {
                            alert("ไม่มีข้อมูลที่ถูกต้องในการนำเข้า");
                            return;
                        }

                        // สร้างรายการประวัติ (Transaction) ไว้รอส่งพร้อมกัน
                        const txObj = {
                            id: Date.now().toString(), 
                            date: new Date().toISOString(), 
                            type: 'ADJUST', 
                            partNo: 'SYSTEM', 
                            qty: 0, 
                            refDoc: 'IMPORT', 
                            note: `Excel Bulk Import: ${itemsToImport.length} items`, 
                            user: currentUser ? currentUser.name : "-"
                        };

                        if (apiUrl) {
                            console.log("กำลังส่งข้อมูลไปบันทึก...");
                            
                            // ส่งข้อมูลและประวัติไปใน request เดียว
                            await fetch(apiUrl, {
                                method: "POST",
                                mode: "no-cors", 
                                body: JSON.stringify({ 
                                    action: "bulk_import", 
                                    items: itemsToImport,
                                    transaction: txObj 
                                })
                            });
                        }

                        const newInventory = [...inventory];
                        itemsToImport.forEach(item => {
                            const idx = newInventory.findIndex(i => i.partNo === item.partNo);
                            if (idx > -1) {
                                newInventory[idx] = { ...newInventory[idx], ...item };
                            } else {
                                newInventory.push(item);
                            }
                        });
                        
                        // อัปเดตข้อมูลหน้าจอ
                        setInventory(newInventory);
                        setTransactions(prev => [txObj, ...prev]);
                        
                        alert(`นำเข้าและบันทึกข้อมูลสำเร็จ! (${itemsToImport.length} รายการ)`);

                    } catch (error) {
                        console.error(error);
                        alert("เกิดข้อผิดพลาด: " + error.message);
                    } finally {
                        e.target.value = ""; 
                    }
                };
                reader.readAsBinaryString(file);
            };

            const handleDelete = (partNo) => {
                if(confirm(`Delete ${partNo}?`)) {
                    setInventory(inventory.filter(i => String(i.partNo) !== String(partNo)));
                    addTransaction('ADJUST', partNo, 0, 'DELETE', 'Item Deleted');
                }
            };

            const handleSaveItem = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const item = {
                    partNo: String(formData.get('partNo')),
                    name: formData.get('name'),
                    qty: parseFloat(formData.get('qty')) || 0,
                    unit: formData.get('unit'),
                    cost: parseFloat(formData.get('cost')) || 0,
                    type: formData.get('type'),
                    min: parseFloat(formData.get('min')) || 0,
                    max: parseFloat(formData.get('max')) || 0,
                    lastUpdated: new Date().toISOString()
                };

                const existingIdx = inventory.findIndex(i => String(i.partNo) === item.partNo);
                if (editItem && existingIdx > -1) {
                    const newInv = [...inventory];
                    newInv[existingIdx] = item;
                    setInventory(newInv);
                    addTransaction('ADJUST', item.partNo, item.qty, 'EDIT', 'Manual Edit');
                } else {
                    if (existingIdx > -1) return alert("Part No already exists!");
                    setInventory([...inventory, item]);
                    addTransaction('INIT', item.partNo, item.qty, 'NEW', 'Added via Form', item);
                }
                setIsModalOpen(false);
            };

            const filteredInventory = inventory.filter(i =>
                String(i.partNo || "").toLowerCase().includes(searchTerm.toLowerCase()) ||
                String(i.name || "").toLowerCase().includes(searchTerm.toLowerCase())
            );

            const handleExportExcel = () => {
                const exportData = filteredInventory.filter(item => item.qty !== 0).map(item => ({
                    PartNo: item.partNo || "",
                    Name: item.name || "",
                    Qty: item.qty || 0,
                    Unit: item.unit || "",
                    Cost: item.cost || 0,
                    Type: item.type || "",
                    Min: item.min || 0,
                    Max: item.max || 0,
                    Location: item.location || "",
                    LastUpdated: item.lastUpdated || ""
                }));
                if (exportData.length === 0) {
                    alert("ไม่มีข้อมูลสำหรับ Export");
                    return;
                }
                exportToExcel(exportData, "Inventory", "Inventory");
            };

            return (
                <div className="animate-fade-in space-y-6">
                    <ImagePreviewModals imgFileRef={imgFileRef} onFileChange={handleImageFile}
                        lightbox={lightbox} setLightbox={setLightbox} namePopup={namePopup} setNamePopup={setNamePopup}
                        imagesFor={imagesFor} imgSrcForFile={imgSrcForFile} pickImageFor={pickImageFor} handleDeleteImage={handleDeleteImage} />

                    <div className="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border">
                        <div className="flex gap-2 w-full md:w-auto">
                            <input 
                                type="text" 
                                placeholder="Search Part No / Name..." 
                                value={searchTerm}
                                onChange={e=>setSearchTerm(e.target.value)}
                                className="p-2 border rounded-lg w-full md:w-64 outline-none focus:ring-2 focus:ring-blue-100"
                            />
                        </div>
                        <div className="flex gap-2 w-full md:w-auto overflow-x-auto">
                            <button onClick={handleDownloadTemplate} className="bg-slate-100 text-slate-600 px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-slate-200 whitespace-nowrap">
                                <i className="fa-solid fa-file-arrow-down"></i> Template
                            </button>
                            
                            <input type="file" ref={fileInputRef} onChange={handleImportExcel} className="hidden" accept=".xlsx, .xls, .csv" />
                            <button onClick={() => fileInputRef.current.click()} className="bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-green-700 whitespace-nowrap">
                                <i className="fa-solid fa-file-excel"></i> Import
                            </button>

                            <button onClick={handleExportExcel} className="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-emerald-700 whitespace-nowrap">
                                <i className="fa-solid fa-file-arrow-up"></i> Export
                            </button>

                            <button onClick={()=>{setEditItem(null); setIsModalOpen(true);}} className="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-blue-700 whitespace-nowrap">
                                <i className="fa-solid fa-plus"></i> Add Item
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-slate-50 text-slate-500 font-bold border-b">
                                    <tr>
                                        <th className="p-4 text-center">รูป</th>
                                        <th className="p-4">Part No</th>
                                        <th className="p-4">Description</th>
                                        <th className="p-4 text-right">Qty</th>
                                        <th className="p-4 text-center">Unit</th>
                                        <th className="p-4 text-right">Cost</th>
                                        <th className="p-4 text-center">Type</th>
                                        <th className="p-4 text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y">
                                    {filteredInventory.length === 0 ? (
                                        <tr><td colSpan="8" className="p-8 text-center text-slate-400">ไม่พบรายการสินค้า</td></tr>
                                    ) : (
                                        filteredInventory.map((item, i) => {
                                            const qty = parseFloat(item.qty) || 0;
                                            const min = parseFloat(item.min ?? item.minStock) || 0;
                                            const cost = parseFloat(item.cost) || 0;
                                            const unit = item.unit || "-";
                                            const type = item.type || "-";
                                            const pNo = String(item.partNo || "").trim();
                                            const thumb = pNo ? imgSrcFor(pNo) : "";

                                            return (
                                                <tr key={i} className="hover:bg-slate-50 transition">
                                                    <td className="p-2 text-center align-middle">
                                                        {!pNo ? <span className="text-slate-200">-</span>
                                                        : uploadingPart === pNo ? <div className="loader mx-auto" style={{width:18,height:18,borderWidth:2}}></div>
                                                        : thumb ? (
                                                            <DriveImg src={thumb} fileId={coverFileId(pNo)} size={400} alt={pNo}
                                                                onClick={() => setNamePopup({ partNo: pNo, name: String(item.name || "") })}
                                                                className="w-11 h-11 object-cover rounded border cursor-zoom-in mx-auto" />
                                                        ) : (
                                                            <button onClick={() => pickImageFor(pNo, true)} title="ถ่ายรูป / อัปโหลดรูป"
                                                                className="w-11 h-11 rounded border border-dashed border-slate-300 text-slate-300 hover:text-blue-500 hover:border-blue-400 mx-auto flex items-center justify-center"><i className="fa-solid fa-camera"></i></button>
                                                        )}
                                                    </td>
                                                    <td className="p-4 font-mono font-bold text-blue-600">{item.partNo}</td>
                                                    <td className="p-4 text-slate-600">{item.name}</td>
                                                    <td className={`p-4 text-right font-bold ${qty <= min ? 'text-red-500' : 'text-slate-700'}`}>
                                                        {qty.toLocaleString()}
                                                        {qty <= min && <i className="fa-solid fa-triangle-exclamation ml-2 text-xs" title="Low Stock"></i>}
                                                    </td>
                                                    <td className="p-4 text-center text-slate-400 text-xs">{unit}</td>
                                                    <td className="p-4 text-right text-slate-500">{cost.toLocaleString()}</td>
                                                    <td className="p-4 text-center"><span className="bg-slate-100 text-slate-500 px-2 py-1 rounded text-xs">{type}</span></td>
                                                    <td className="p-4 text-center">
                                                        <div className="flex justify-center gap-2">
                                                            <button onClick={()=>{setEditItem(item); setIsModalOpen(true);}} className="text-slate-400 hover:text-blue-600"><i className="fa-solid fa-pen-to-square"></i></button>
                                                            <button onClick={()=>handleDelete(item.partNo)} className="text-slate-400 hover:text-red-600"><i className="fa-solid fa-trash"></i></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
                                <div className="p-6 border-b flex justify-between items-center bg-slate-50">
                                    <h3 className="font-bold text-lg">{editItem ? 'Edit Item' : 'New Item'}</h3>
                                    <button onClick={()=>setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <form onSubmit={handleSaveItem} className="p-6 space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="col-span-2 sm:col-span-1">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Part No</label>
                                            <input name="partNo" defaultValue={editItem?.partNo} required className="w-full p-2 border rounded-lg bg-slate-50 outline-none focus:ring-2 focus:ring-blue-100" readOnly={!!editItem} />
                                        </div>
                                        <div className="col-span-2 sm:col-span-1">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Type</label>
                                            <select name="type" defaultValue={editItem?.type || "General"} className="w-full p-2 border rounded-lg bg-white outline-none focus:ring-2 focus:ring-blue-100">
                                                <option value="General">General</option>
                                                <option value="Raw Material">Raw Material</option>
                                                <option value="Work in Process">Work in Process</option>
                                                <option value="Finished Goods">Finished Goods</option>
                                            </select>
                                        </div>
                                        <div className="col-span-2">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Description</label>
                                            <input name="name" defaultValue={editItem?.name} required className="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-100" />
                                        </div>
                                        <div className="col-span-1">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Quantity</label>
                                            <input name="qty" type="number" step="0.01" defaultValue={editItem?.qty} required className="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-100" />
                                        </div>
                                        <div className="col-span-1">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Unit</label>
                                            <input name="unit" defaultValue={editItem?.unit || "pcs"} className="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-100" />
                                        </div>
                                        <div className="col-span-1">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Cost</label>
                                            <input name="cost" type="number" step="0.01" defaultValue={editItem?.cost} className="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-100" />
                                        </div>
                                        <div className="col-span-1">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Safety Stock (Min)</label>
                                            <input name="min" type="number" defaultValue={editItem?.min || editItem?.minStock} className="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-100" />
                                        </div>
                                    </div>
                                    <div className="pt-4 flex gap-3">
                                        <button type="button" onClick={()=>setIsModalOpen(false)} className="flex-1 py-3 bg-slate-100 text-slate-500 font-bold rounded-xl hover:bg-slate-200">Cancel</button>
                                        <button type="submit" className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg">Save Item</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const StockCountView = ({ inventory, setInventory, addTransaction, currentUser, apiUrl, bomData }) => {
            const [countItems, setCountItems] = useState([]);
            const [inputPartNo, setInputPartNo] = useState("");
            const [inputQty, setInputQty] = useState(1);
            const [countName, setCountName] = useState(() => `SC-${new Date().toISOString().slice(0,10)}`);
            const [showSummary, setShowSummary] = useState(false);
            const [showConfirm, setShowConfirm] = useState(false);
