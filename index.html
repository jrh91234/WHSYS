                                                        <td className="p-3 text-right">{item.qty == null ? <span className="text-slate-300">—</span> : formatNum(item.qty)}</td>
                                                        <td className="p-3 text-center">{item.type}</td>
                                                        <td className="p-2 text-center">
                                                            <button onClick={() => toggleCart(item)}
                                                                title={inCart(item) ? "อยู่ในตะกร้าแล้ว — กดเพื่อเอาออก" : "เพิ่มเข้าตะกร้า"}
                                                                className={`w-8 h-8 rounded-lg border transition mx-auto flex items-center justify-center ${inCart(item) ? 'bg-emerald-500 border-emerald-500 text-white hover:bg-emerald-600' : 'border-slate-200 text-slate-400 hover:text-orange-500 hover:border-orange-400'}`}>
                                                                <i className={`fa-solid ${inCart(item) ? 'fa-check' : 'fa-cart-plus'}`}></i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                    {isOpen && hasExtras && (
                                                        <tr className="bg-amber-50/50">
                                                            <td></td>
                                                            <td colSpan="5" className="px-3 pb-3 pt-0">
                                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-1.5 border-l-2 border-amber-300 pl-3">
                                                                    {item.extras.map(ex => (
                                                                        <div key={ex.label} className="flex gap-2 text-[11px]">
                                                                            <span className="text-slate-400 shrink-0">{ex.label}:</span>
                                                                            <span className="font-bold text-slate-700 break-words">{ex.value}</span>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    )}
                                                    </React.Fragment>
                                                    );
                                                })
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                        </React.Fragment>)}

                        {activeTab === 'cart' && (
                            cart.length === 0 ? (
                                <div className="p-12 text-center text-slate-400">
                                    <i className="fa-solid fa-cart-shopping text-4xl mb-3 block"></i>
                                    ตะกร้าว่าง — ไปที่แท็บ "ค้นหา" แล้วกดปุ่ม <i className="fa-solid fa-cart-plus"></i> ท้ายรายการที่ต้องการ
                                </div>
                            ) : (
                                <div className="overflow-hidden border rounded-xl">
                                    <div className="bg-orange-50 p-3 text-xs font-bold text-orange-800 border-b flex justify-between items-center gap-2">
                                        <span>พาร์ทที่เลือกไว้: {cart.length} รายการ</span>
                                        <div className="flex gap-2">
                                            <button onClick={exportCartExcel} className="bg-emerald-600 text-white px-3 py-1 rounded-lg font-bold flex items-center gap-1 hover:bg-emerald-700"><i className="fa-solid fa-file-excel"></i> Export Excel</button>
                                            <button onClick={() => { if (confirm(`ล้างตะกร้าทั้งหมด ${cart.length} รายการ?`)) clearCart(); }} className="bg-slate-200 text-slate-600 px-3 py-1 rounded-lg font-bold flex items-center gap-1 hover:bg-red-100 hover:text-red-600"><i className="fa-solid fa-trash-can"></i> ล้างตะกร้า</button>
                                        </div>
                                    </div>
                                    <div className="overflow-auto max-h-96">
                                        <table className="w-full text-xs text-left">
                                            <thead className="bg-white sticky top-0">
                                                <tr className="border-b text-slate-500">
                                                    <th className="p-3 w-14">รูป</th>
                                                    <th className="p-3">Part No / Name</th>
                                                    <th className="p-3">Used In (Model)</th>
                                                    <th className="p-3 text-right">Qty/Unit</th>
                                                    <th className="p-3 text-center">Type</th>
                                                    <th className="p-3 text-center w-24">จำนวน</th>
                                                    <th className="p-3 text-center w-14">ลบ</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y">
                                                {cart.map((item) => {
                                                    const key = cartKeyOf(item);
                                                    const cThumb = item.partNo ? imgSrcFor(item.partNo) : "";
                                                    return (
                                                        <tr key={key} className="hover:bg-slate-50">
                                                            <td className="p-2 text-center">
                                                                {cThumb ? (
                                                                    <DriveImg src={cThumb} fileId={coverFileId(item.partNo)} size={400} alt={item.partNo}
                                                                        onClick={() => setLightbox({ partNo: item.partNo, fileId: coverFileId(item.partNo), src: imgSrcFor(item.partNo, 1600) })}
                                                                        className="w-9 h-9 object-cover rounded border cursor-zoom-in mx-auto" />
                                                                ) : (
                                                                    <div className="w-9 h-9 rounded border border-dashed border-slate-200 text-slate-200 mx-auto flex items-center justify-center"><i className="fa-solid fa-image"></i></div>
                                                                )}
                                                            </td>
                                                            <td className="p-3">
                                                                <div className="font-bold text-blue-600 flex items-center gap-1.5 flex-wrap">{item.partNo}<SourceBadge source={item.source || SOURCE_BOM} /></div>
                                                                <div className="text-slate-500">{item.name}</div>
                                                            </td>
                                                            <td className="p-3 font-bold text-slate-700">{item.model}</td>
                                                            <td className="p-3 text-right">{item.qtyPerUnit == null ? <span className="text-slate-300">—</span> : formatNum(item.qtyPerUnit)}</td>
                                                            <td className="p-3 text-center">{item.type}</td>
                                                            <td className="p-2 text-center">
                                                                <input type="number" min="0" value={item.qty}
                                                                    onChange={e => setCartQty(key, e.target.value)}
                                                                    className="w-20 p-1.5 border rounded-lg text-center outline-none focus:ring-2 focus:ring-orange-100" />
                                                            </td>
                                                            <td className="p-2 text-center">
                                                                <button onClick={() => removeFromCart(key)} title="เอาออกจากตะกร้า"
                                                                    className="w-8 h-8 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 mx-auto flex items-center justify-center"><i className="fa-solid fa-xmark"></i></button>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )
                        )}
                    </div>
                </div>
            );
        };

        // ===== หน้าตั้งค่าค้นหาด้วยรูป (admin เท่านั้น) — ปรับเกณฑ์ทุกตัวของ VS_TUNE ได้จากหน้าจอ เก็บใน localStorage ต่อเครื่อง =====
        const VS_TUNE_GROUPS = [
            { title: "การอ่านตัวหนังสือ (OCR)", icon: "fa-font", fields: [
                { key: 'textDensity', label: "ความหนาแน่นขอบขั้นต่ำ", hint: "เพิ่มถ้ายังยิง OCR ทั้งที่พาร์ทไม่มีตัวหนังสือ / ลดถ้ามี label แต่ระบบไม่ยอมอ่าน", step: 0.01 },
                { key: 'textCells', label: "จำนวนจุดขั้นต่ำ", hint: "ต้องเจอบริเวณหน้าตาแบบตัวหนังสือกี่จุดถึงยอมยิง OCR — เพิ่มเพื่อลดการยิงมั่ว", step: 1 },
                { key: 'textContrast', label: "ความคมของขอบขั้นต่ำ (0-255)", hint: "เพิ่มถ้าเงา/ลายพื้นผิวหลอกว่าเป็นตัวหนังสือบ่อย", step: 4 },
                { key: 'textBalance', label: "สมดุลทิศของขอบ (0-0.5)", hint: "เพิ่มเพื่อกรองขอบวัตถุที่เป็นเส้นตรงทิศเดียวออก", step: 0.05 },
                { key: 'ocrWeight', label: "โบนัสตัวหนังสือตรง", hint: "คะแนนบวกสูงสุดเมื่อตัวหนังสือ/label ตรงกันเป๊ะ", step: 0.05 },
            ]},
            { title: "คะแนนและการแสดงผล", icon: "fa-ranking-star", fields: [
                { key: 'minScore', label: "คะแนนขั้นต่ำที่แสดงผล", hint: "ผลที่คะแนนต่ำกว่านี้ไม่ขึ้นในผลค้นหา", step: 0.05 },
                { key: 'highCut', label: "เกณฑ์มั่นใจสูง", hint: "ตัวท็อปถึงเกณฑ์นี้จะซ่อนตัวเลือกที่คะแนนต่ำกว่าเกณฑ์ทั้งหมด", step: 0.05 },
                { key: 'colorSpan', label: "ผลของสีต่อคะแนน", hint: "สีตรงเป๊ะ +ครึ่งหนึ่งของค่านี้ / สีคนละเรื่อง -ครึ่งหนึ่ง — เพิ่มถ้าพาร์ทคนละสียังติดมา", step: 0.05 },
                { key: 'colorBadge', label: "เกณฑ์ป้าย \"สีต่าง\"", hint: "ความคล้ายสีต่ำกว่านี้ขึ้นป้ายเตือนบนการ์ดผลลัพธ์", step: 0.05 },
            ]},
            { title: "ตรวจรายละเอียดเชิงลึก (รู/ร่อง)", icon: "fa-magnifying-glass-plus", fields: [
                { key: 'rerankMargin', label: "ช่วงคะแนนที่ถือว่าสูสี", hint: "อันดับต้นห่างกันน้อยกว่านี้จะตรวจรายละเอียดเชิงลึกเพิ่ม", step: 0.01 },
                { key: 'rerankMax', label: "จำนวนพาร์ทที่ตรวจเชิงลึก", hint: "มากขึ้น = ครอบคลุมขึ้นแต่ช้าลง (ต้องดึงรูป + ประมวลผลต่อพาร์ท)", step: 1 },
                { key: 'detailWeight', label: "น้ำหนักคะแนนรายละเอียด", hint: "0 = ไม่สนรายละเอียด / 1 = ใช้รายละเอียดล้วน", step: 0.05 },
            ]},
        ];
        const VsTunePanel = ({ apiUrl, onClose }) => {
            const [vals, setVals] = useState(() => ({ ...VS_TUNE }));
            const [saving, setSaving] = useState(false);
            const setVal = (k, v) => setVals(prev => ({ ...prev, [k]: v }));
            const save = async () => {
                if (saving) return;
                // ทำความสะอาดค่าก่อนเก็บ: ช่องที่พิมพ์เพี้ยน (ว่าง/ไม่ใช่ตัวเลข) ถอยกลับค่าเริ่มต้นของช่องนั้น,
                // ค่าติดลบถูกดันเป็น 0 (น้ำหนักติดลบจะกลับทิศคะแนน เช่น หักคะแนนกลายเป็นโบนัส),
                // ช่องที่ค่าเริ่มต้นเป็นจำนวนเต็ม (จำนวนจุด/จำนวนพาร์ท/ความคมขอบ) ปัดเศษให้เป็นจำนวนเต็ม
                const clean = {};
                Object.keys(VS_TUNE_DEFAULTS).forEach(k => {
                    const n = parseFloat(vals[k]);
                    if (isNaN(n)) { clean[k] = VS_TUNE_DEFAULTS[k]; return; }
                    const nonNeg = Math.max(0, n);
                    clean[k] = Number.isInteger(VS_TUNE_DEFAULTS[k]) ? Math.round(nonNeg) : nonNeg;
                });
                saveVsTune(clean); // มีผลเครื่องนี้ทันที
                // บันทึกเป็นค่ากลางขึ้น cloud — ทุกเครื่อง/ทุกผู้ใช้ได้ค่านี้ตอนเปิดหน้าค้นหาครั้งถัดไป
                if (apiUrl) {
                    setSaving(true);
                    try {
                        const res = await fetch(apiUrl, {
                            method: "POST",
                            headers: { "Content-Type": "text/plain;charset=utf-8" },
                            body: JSON.stringify({ action: "save_vs_settings", settings: clean })
                        });
                        const json = await res.json();
                        if (json.status !== "success") throw new Error(json.message || "save failed");
                    } catch (e) {
                        // ค้าง panel ไว้ให้กดบันทึกซ้ำได้เลย (ค่าที่กรอกยังอยู่ครบ) — ปิดทิ้งทั้งที่ยังไม่ขึ้น cloud จะหลอกว่าสำเร็จแล้ว
                        alert("บันทึกค่ากลางขึ้น cloud ไม่สำเร็จ (" + e.message + ") — ค่ามีผลเฉพาะเครื่องนี้ไปก่อน กด \"บันทึก (ทุกเครื่อง)\" ซ้ำเพื่อลองใหม่");
                        setSaving(false);
                        return;
                    }
                    setSaving(false);
                }
                onClose();
            };
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-overlay" onClick={onClose}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-5 animate-fade-in max-h-[85vh] overflow-auto" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-1">
                            <h4 className="font-bold flex items-center gap-2"><i className="fa-solid fa-sliders text-indigo-500"></i> ตั้งค่าค้นหาด้วยรูป</h4>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl"><Icons.X/></button>
                        </div>
                        <p className="text-[11px] text-slate-400 mb-3">ค่ากลางของทั้งระบบ — บันทึกแล้วมีผลทุกเครื่อง/ทุกผู้ใช้ (เครื่องนี้ทันที เครื่องอื่นตอนเปิดหน้าค้นหาครั้งถัดไป) · ช่องที่เว้นว่างจะกลับไปใช้ค่าเริ่มต้น</p>
                        {VS_TUNE_GROUPS.map(g => (
                            <div key={g.title} className="mb-4">
                                <div className="font-bold text-xs text-slate-600 mb-2 flex items-center gap-1.5"><i className={`fa-solid ${g.icon} text-indigo-400`}></i>{g.title}</div>
                                <div className="space-y-2">
                                    {g.fields.map(f => (
                                        <div key={f.key} className="flex items-start justify-between gap-3 bg-slate-50 rounded-lg px-3 py-2">
                                            <div className="min-w-0">
                                                <div className="text-xs font-bold text-slate-700">{f.label}</div>
                                                <div className="text-[10px] text-slate-400">{f.hint} · ค่าเริ่มต้น {VS_TUNE_DEFAULTS[f.key]}</div>
                                            </div>
                                            <input type="number" step={f.step} min={0} value={vals[f.key]}
                                                onChange={e => setVal(f.key, e.target.value)}
                                                className="w-24 shrink-0 border rounded-lg px-2 py-1.5 text-sm text-right font-mono" />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                        <div className="flex gap-2 pt-1">
                            <button onClick={() => setVals({ ...VS_TUNE_DEFAULTS })} className="px-4 py-2.5 rounded-xl border font-bold text-slate-500 text-sm hover:bg-slate-50">คืนค่าเริ่มต้นทั้งหมด</button>
                            <button onClick={save} disabled={saving} className="flex-1 px-4 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 disabled:opacity-50">{saving ? "กำลังบันทึก..." : "บันทึก (ทุกเครื่อง)"}</button>
                        </div>
                    </div>
                </div>
            );
        };

        const VisualSearchView = ({ inventory, bomData, deptData = {}, deptConfig = {}, apiUrl, partImages = {}, setPartImages, currentUser }) => {
            // แผนที่ Part No -> ชื่อ (จาก inventory + ทุกชีต BOM + รายการพาร์ทของแผนก) สำหรับแสดงผลค้นหาด้วยรูป
            // ใส่ทั้ง key ดิบและ key แบบ normalize เพราะดัชนีรูปเก่าเก็บด้วย Part No ดิบจากชีท
            const partNameMap = useMemo(() => {
                const m = {};
                const put = (p, name) => {
                    const raw = String(p || "").trim();
                    if (raw && !m[raw]) m[raw] = name || "";
                    const norm = normPartNo(p);
                    if (norm && !m[norm]) m[norm] = name || "";
                };
                (inventory || []).forEach(it => put(it.partNo, it.name));
                Object.keys(bomData || {}).forEach(sh => {
                    (bomData[sh] || []).slice(1).forEach(row => put(row[BOM_COLS.pNoCol], String(row[BOM_COLS.nameCol] || "")));
                });
                deptPartRows(deptData, deptConfig).forEach(it => put(it.partNo, it.name));
                return m;
            }, [inventory, bomData, deptData, deptConfig]);

            const imgSearchRef = useRef(null);
            const {
                embeddings, visualBusy, visualMsg, indexProg, autoHealing,
                freshLoaded, embLoadProg, embLoadError, retryLoadIndex,
                queryPreview, queryFile, visualResults, visualNotice,
                buildIndex, handleQueryImage
            } = useVisualSearch(apiUrl, partImages, partNameMap);

            const {
                imgFileRef, lightbox, setLightbox, namePopup, setNamePopup,
                pickImageFor, handleImageFile, handleDeleteImage, uploadOneImage,
                imagesFor, imgSrcFor, imgSrcForFile, coverFileId
            } = usePartImageManager(apiUrl, partImages, setPartImages, currentUser);

            const [submittingFeedback, setSubmittingFeedback] = useState(false);
            const [feedbackFor, setFeedbackFor] = useState({}); // partNo -> { fileId } รูปค้นหาที่ยืนยัน "ใช่" แล้วถูกบันทึกเป็นรูปของพาร์ทนั้น
            const [showTunePanel, setShowTunePanel] = useState(false); // หน้าตั้งค่าเกณฑ์ค้นหาด้วยรูป — admin เท่านั้น

            // ยืนยันว่ารูปที่ค้นหาคือพาร์ทนี้จริง -> บันทึกรูปนั้นเป็นรูปของพาร์ทเพิ่มอีก 1 รูป
            // แล้วสร้างดัชนีให้อัตโนมัติ (เหมือนอัปโหลดรูปปกติ) เพื่อให้ค้นหาครั้งถัดไปแม่นขึ้น
            const handleConfirmMatch = async (partNo) => {
                if (!queryFile || submittingFeedback) return;
                setSubmittingFeedback(true);
                try {
                    const json = await uploadOneImage(partNo, queryFile);
                    setFeedbackFor(prev => ({ ...prev, [partNo]: { fileId: json.fileId } }));
                } catch (err) {
                    alert("บันทึกรูปไม่สำเร็จ: " + err.message);
                } finally {
                    setSubmittingFeedback(false);
                }
            };

            // เลิกทำ "ใช่" ล่าสุด (กดผิดใบ) — ลบรูปที่เพิ่งบันทึกเข้าพาร์ทนั้นออก
            const handleUndoFeedback = async (partNo) => {
                const fb = feedbackFor[partNo];
                if (!fb || submittingFeedback) return;
                setSubmittingFeedback(true);
                try {
                    if (fb.fileId) await handleDeleteImage(partNo, fb.fileId);
                    setFeedbackFor(prev => { const n = { ...prev }; delete n[partNo]; return n; });
                } catch (err) {
                    alert("เลิกทำไม่สำเร็จ: " + err.message);
                } finally {
                    setSubmittingFeedback(false);
                }
            };

            return (
                <div className="animate-fade-in space-y-6">
                    <ImagePreviewModals imgFileRef={imgFileRef} onFileChange={handleImageFile}
                        lightbox={lightbox} setLightbox={setLightbox} namePopup={namePopup} setNamePopup={setNamePopup}
                        imagesFor={imagesFor} imgSrcForFile={imgSrcForFile} pickImageFor={pickImageFor} handleDeleteImage={handleDeleteImage} />

                    <div className="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                        <h3 className="font-bold flex items-center gap-2"><Icons.Camera/> ค้นหาด้วยรูป</h3>

                        <input type="file" ref={imgSearchRef} onChange={(e) => { setFeedbackFor({}); handleQueryImage(e); }} className="hidden" accept="image/*" capture="environment" />
                        <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-xs text-indigo-800 flex items-start gap-2">
                            <i className="fa-solid fa-circle-info mt-0.5"></i>

                        </div>
                        <div className="flex flex-wrap gap-2 items-center">
                            <button onClick={()=>imgSearchRef.current && imgSearchRef.current.click()} disabled={visualBusy} className="bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold flex items-center gap-2 disabled:opacity-50 hover:bg-indigo-700">
                                <i className="fa-solid fa-camera"></i> ถ่าย/เลือกรูปเพื่อค้นหา
