<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NLC Factory ERP - Cloud Edition</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f1f5f9; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); }
        
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; border: 2px solid #f1f5f9; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #3498db; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .resizer { position: absolute; right: 0; top: 0; height: 100%; width: 5px; background: rgba(0, 0, 0, 0.05); cursor: col-resize; user-select: none; touch-action: none; z-index: 20; }
        .resizer:hover, .resizing { background: #3b82f6; width: 4px; }

        .sidebar-link { transition: all 0.2s; }
        .sidebar-link:hover, .sidebar-link.active { background-color: #1e293b; color: white; transform: translateX(5px); }
        
        /* Safe area for mobile bottom nav */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
            const apiUrl = 'https://script.google.com/macros/s/AKfycbySTjMR2ib4HIBwHmJ0oKR9eVDlKEaR362AqjgBnCd3m-RTPYZ5fdZ7DXZqERSZrtWa8A/exec';
        // --- Configuration ---
        const STORAGE_KEY_INV = "nlc_erp_inventory";
        const STORAGE_KEY_TRANS = "nlc_erp_transactions";
        const STORAGE_KEY_API_URL = "nlc_erp_api_url";
        const STORAGE_KEY_USERS = "nlc_erp_users";
        const STORAGE_KEY_SESSION = "nlc_erp_session"; 
        const STORAGE_KEY_BOM_DATA = "nlc_erp_bom_data";
        const STORAGE_KEY_BOM_VERSION = "nlc_erp_bom_version";

        const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycby923XbLtP0TxMmKNG1JyhmtZeMNNALNCCJLXWr1GI70NYH0h7AI27c7yP2-L3h9Ne_zQ/exec"; 
        
        const INITIAL_INVENTORY = [
            { partNo: "DEMO-001", name: "สินค้าตัวอย่าง (กำลังเชื่อมต่อ Cloud...)", qty: 0, location: "-", unit: "PCS", minStock: 0 }
        ];

        const INITIAL_USERS = [
            { id: 1, username: 'admin', password: '1111', name: 'Administrator', role: 'ADMIN' }
        ];

        const formatNum = (n) => typeof n === 'number' ? n.toLocaleString() : "0";
        const getStorage = (key, def) => {
            const saved = localStorage.getItem(key);
            try { return saved ? JSON.parse(saved) : def; } catch(e) { return def; }
        };
        const setStorage = (key, val) => localStorage.setItem(key, JSON.stringify(val));

        const exportToExcel = (data, fileName, sheetName = "Sheet1") => {
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, sheetName);
            XLSX.writeFile(wb, `${fileName}_${new Date().toISOString().slice(0,10)}.xlsx`);
        };

        const Icons = {
            Dashboard: (p) => <i className={`fa-solid fa-chart-line ${p.className}`}></i>,
            Warehouse: (p) => <i className={`fa-solid fa-warehouse ${p.className}`}></i>,
            Production: (p) => <i className={`fa-solid fa-industry ${p.className}`}></i>,
            History: (p) => <i className={`fa-solid fa-clock-rotate-left ${p.className}`}></i>,
            Settings: (p) => <i className={`fa-solid fa-gear ${p.className}`}></i>,
            Plus: (p) => <i className={`fa-solid fa-plus ${p.className}`}></i>,
            Minus: (p) => <i className={`fa-solid fa-minus ${p.className}`}></i>,
            Save: (p) => <i className={`fa-solid fa-floppy-disk ${p.className}`}></i>,
            Warn: (p) => <i className={`fa-solid fa-triangle-exclamation ${p.className}`}></i>,
            Box: (p) => <i className={`fa-solid fa-box-open ${p.className}`}></i>,
            Excel: (p) => <i className={`fa-solid fa-file-excel ${p.className}`}></i>,
            Trash: (p) => <i className={`fa-solid fa-trash-can ${p.className}`}></i>,
            Cloud: (p) => <i className={`fa-solid fa-cloud ${p.className}`}></i>,
            Refresh: (p) => <i className={`fa-solid fa-rotate ${p.className}`}></i>,
            Wand: (p) => <i className={`fa-solid fa-wand-magic-sparkles ${p.className}`}></i>,
            Download: (p) => <i className={`fa-solid fa-download ${p.className}`}></i>,
            Search: (p) => <i className={`fa-solid fa-magnifying-glass ${p.className}`}></i>,
            Compare: (p) => <i className={`fa-solid fa-code-compare ${p.className}`}></i>,
            X: (p) => <i className={`fa-solid fa-xmark ${p.className}`}></i>,
            User: (p) => <i className={`fa-solid fa-user ${p.className}`}></i>,
            Users: (p) => <i className={`fa-solid fa-users ${p.className}`}></i>,
            Check: (p) => <i className={`fa-solid fa-check ${p.className}`}></i>,
            Sort: (p) => <i className={`fa-solid fa-sort ${p.className}`}></i>,
            Clipboard: (p) => <i className={`fa-solid fa-clipboard-check ${p.className}`}></i>
        };

        const ResizableTh = ({ width, onResize, children, className, onClick }) => {
            const [resizing, setResizing] = useState(false);
            const startX = useRef(0);
            const startWidth = useRef(0);

            const handleMouseDown = (e) => {
                e.preventDefault(); e.stopPropagation(); 
                setResizing(true);
                startX.current = e.pageX;
                startWidth.current = width;
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
            };

            const handleMouseMove = (e) => {
                requestAnimationFrame(() => {
                    const diff = e.pageX - startX.current;
                    onResize(Math.max(50, startWidth.current + diff));
                });
            };

            const handleMouseUp = () => {
                setResizing(false);
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', handleMouseUp);
            };

            return (
                <th className={`relative ${className} bg-slate-50`} style={{ width: width, minWidth: width }}>
                    <div className="flex items-center justify-center h-full w-full relative z-10 cursor-pointer" onClick={onClick}>
                        {children}
                    </div>
                    <div className={`resizer ${resizing ? 'resizing' : ''}`} onMouseDown={handleMouseDown} onClick={(e) => e.stopPropagation()} />
                </th>
            );
        };

        const MobileNavItem = ({ icon, label, active, onClick }) => {
            const Icon = Icons[icon];
            return (
                <button onClick={onClick} className={`flex flex-col items-center justify-center w-full py-1 ${active ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                    <div className={`text-xl mb-0.5 ${active ? '-translate-y-0.5' : ''} transition-transform`}><Icon/></div>
                    <span className="text-[10px] font-bold">{label}</span>
                </button>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [currentUser, setCurrentUser] = useState(() => getStorage(STORAGE_KEY_SESSION, null));
            const [currentView, setCurrentView] = useState("dashboard");
            const [inventory, setInventory] = useState(() => getStorage(STORAGE_KEY_INV, INITIAL_INVENTORY));
            const [transactions, setTransactions] = useState(() => getStorage(STORAGE_KEY_TRANS, []));
            const [users, setUsers] = useState(() => getStorage(STORAGE_KEY_USERS, INITIAL_USERS));
            const [bomData, setBomData] = useState(() => getStorage(STORAGE_KEY_BOM_DATA, {}));
            const [bomVersion, setBomVersion] = useState(() => getStorage(STORAGE_KEY_BOM_VERSION, 0));
            const [apiUrl, setApiUrl] = useState(() => localStorage.getItem(STORAGE_KEY_API_URL) || DEFAULT_API_URL);
            
            const [isLoading, setIsLoading] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            useEffect(() => {
                setStorage(STORAGE_KEY_INV, inventory);
                setStorage(STORAGE_KEY_TRANS, transactions);
                setStorage(STORAGE_KEY_USERS, users);
                setStorage(STORAGE_KEY_BOM_DATA, bomData);
                setStorage(STORAGE_KEY_BOM_VERSION, bomVersion);
            }, [inventory, transactions, users, bomData, bomVersion]);

            useEffect(() => {
                if (currentUser) { setStorage(STORAGE_KEY_SESSION, currentUser); }
                fetchAllData(true); 
                if(!currentUser) { localStorage.removeItem(STORAGE_KEY_SESSION); }
            }, [currentUser]);

            useEffect(() => {
                if (!apiUrl) return;
                
                const checkAndSync = async () => {
                    try {
                        const res = await fetch(apiUrl + "?action=checkVersion&t=" + Date.now());
                        const data = await res.json();
                        if (data.lastUpdated && data.lastUpdated > bomVersion) {
                            console.log("Found new version, auto-syncing...");
                            fetchAllData(true);
                        }
                    } catch (e) {
                        console.log("Auto sync check failed (Offline or CORS?)");
                    }
                };

                const interval = setInterval(checkAndSync, 10000);
                return () => clearInterval(interval);
            }, [apiUrl, bomVersion]);

            const fetchAllData = async (isBackground = false) => {
                if (!apiUrl) return;
                if (!isBackground) setIsLoading(true);
                else setIsSyncing(true);

                try {
                    // แก้ไข: เปลี่ยนจาก getData เป็น getInventory ให้ตรงกับ API ใน Backend
                    const res = await fetch(apiUrl + "?action=getInventory&t=" + Date.now()); 
                    const data = await res.json();
                    
                    if (data.inventory) setInventory(data.inventory);
                    if (data.transactions) setTransactions(data.transactions);
                    if (data.users) setUsers(data.users); 

                    const resBOM = await fetch(apiUrl + "?action=getBOM&t=" + Date.now());
                    const jsonBOM = await resBOM.json();
                    const sheetData = jsonBOM.data || jsonBOM;
                    const version = jsonBOM.version || Date.now();
                    
                    const filteredBOM = {};
                    Object.keys(sheetData).forEach(key => {
                        if (key.toLowerCase() !== 'data' && key !== 'version') {
                            filteredBOM[key] = sheetData[key];
                        }
                    });
                    
                    setBomData(filteredBOM);
                    setBomVersion(version);

                } catch (e) { 
                    console.error("Sync Error", e); 
                } finally { 
                    setIsLoading(false); 
                    setIsSyncing(false);
                }
            };

            const handleLogin = async (u, p) => {
                const cleanU = String(u).trim();
                const cleanP = String(p).trim();
                
                if (!cleanU || !cleanP) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");

                setIsLoading(true);
                try {
                    // 1. ส่งข้อมูลตรวจสอบล็อกอินไปยัง Cloud โดยตรง
                    const res = await fetch(`${apiUrl}?action=login&username=${encodeURIComponent(cleanU)}&password=${encodeURIComponent(cleanP)}`);
                    const data = await res.json();
                    
                    if (data.status === "success") {
                        setCurrentUser(data.user);
                        fetchAllData(); 
                        return;
                    } else {
                        // เพิ่ม: ถ้า Cloud ปฏิเสธ ให้แสดงข้อความจาก Cloud ทันที จะได้รู้ว่าเกิดจากอะไร
                        alert(`เข้าสู่ระบบไม่สำเร็จ: ${data.message || "Username หรือ Password ในระบบ Cloud ไม่ถูกต้อง"}`);
                        setIsLoading(false);
                        return; 
                    }
                } catch (error) {
                    console.warn("Cloud login failed, trying local fallback...", error);
                    // 2. แผนสำรอง: กรณีออฟไลน์ หรือ URL พังให้เช็คบัญชีในเครื่องที่แคชไว้
                    // ตรวจสอบ property password ก่อนเทียบเพราะข้อมูลจาก getInventory จะลบรหัสผ่านทิ้งไปแล้ว
                    const localUser = users.find(x => String(x.username).trim() === cleanU && x.password && String(x.password).trim() === cleanP);
                    
                    if (localUser) {
                        setCurrentUser(localUser);
                        fetchAllData(); 
                    } else if (cleanU === 'admin' && cleanP === '1111') {
                        // Fallback ฉุกเฉินกรณีพึ่งเปิดเว็บครั้งแรกและต่อ Cloud ไม่ได้
                        setCurrentUser({ id: 1, username: 'admin', name: 'Administrator', role: 'ADMIN' });
                        fetchAllData();
                    } else {
                        alert("ไม่สามารถเชื่อมต่อ Cloud ได้ และไม่มีข้อมูลบัญชีนี้ในเครื่อง\n(โปรดเช็ค URL API หรือการเชื่อมต่ออินเทอร์เน็ต)");
                    }
                } finally {
                    setIsLoading(false);
                }
            };

            const addTransaction = async (type, partNo, qty, refDoc, note, newItemData = null) => {
                const newTx = { id: Date.now().toString(), date: new Date().toISOString(), type, partNo, qty: parseFloat(qty), refDoc, note, user: currentUser.name };
                setTransactions(prev => [newTx, ...prev]);
                let updatedInv = [...inventory];
                const idx = updatedInv.findIndex(i => i.partNo === partNo);
                if (idx >= 0) {
                    let nQty = updatedInv[idx].qty;
                    if (type === 'IN' || type === 'INIT') nQty += parseFloat(qty);
                    else if (type === 'OUT') nQty -= parseFloat(qty);
                    else if (type === 'ADJUST') nQty = parseFloat(qty);
                    updatedInv[idx] = { ...updatedInv[idx], qty: nQty };
                } else if (newItemData) {
                    updatedInv.push({ ...newItemData, unit: 'PCS' });
                }
                setInventory(updatedInv);
                if (apiUrl) fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "add_transaction", data: newTx, itemData: newItemData }) });
            };

            const handleDeleteItem = async (partNo) => {
                if(!confirm(`ต้องการลบ ${partNo} ใช่หรือไม่?`)) return;
                setInventory(prev => prev.filter(i => i.partNo !== partNo));
                addTransaction('ADJUST', partNo, 0, 'DELETE', 'Item Deleted');
                if (apiUrl) fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete_item", partNo }) });
            };

            const handleSaveUser = async (u) => {
                const isNew = !u.id;
                let newUser = {...u};
                if(isNew) {
                    if(users.some(existing => existing.username === u.username)) return alert("Username ซ้ำ");
                    newUser.id = Date.now();
                }
                
                let newUsers = isNew ? [...users, newUser] : users.map(user => user.id === u.id ? {...user, ...u} : user);
                setUsers(newUsers);
                if (apiUrl) fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "save_user", user: newUser }) });
            };

            const handleDeleteUser = async (id) => {
                setUsers(prev => prev.filter(u => u.id !== id));
                if (apiUrl) fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete_user", id }) });
            };

            if (!currentUser) return <LoginView onLogin={handleLogin} isLoading={isLoading} apiUrl={apiUrl} setApiUrl={setApiUrl} />;

            return (
                <div className="flex h-screen bg-slate-100 relative overflow-hidden">
                    <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col hidden md:flex h-full">
                        <div className="p-6 border-b border-slate-800 font-bold text-white flex items-center gap-2"><Icons.Warehouse/> NLC ERP</div>
                        <nav className="flex-1 p-4 space-y-1 overflow-y-auto">
                            <SidebarItem icon="Dashboard" label="ภาพรวม" active={currentView==='dashboard'} onClick={()=>setCurrentView('dashboard')} />
                            <SidebarItem icon="Warehouse" label="คลังสินค้า" active={currentView==='inventory'} onClick={()=>setCurrentView('inventory')} />
                            <SidebarItem icon="Production" label="แผนผลิต (MRP)" active={currentView==='mrp'} onClick={()=>setCurrentView('mrp')} />
                            <SidebarItem icon="Clipboard" label="นับสต๊อก" active={currentView==='stockcount'} onClick={()=>setCurrentView('stockcount')} />
                            <SidebarItem icon="History" label="ประวัติรายการ" active={currentView==='history'} onClick={()=>setCurrentView('history')} />
                            <SidebarItem icon="Settings" label="ตั้งค่า" active={currentView==='settings'} onClick={()=>setCurrentView('settings')} />
                        </nav>
                        <div className="p-4 border-t border-slate-800 text-xs text-center flex flex-col gap-2">
                            <div className="flex justify-between items-center w-full">
                                <span>{currentUser.name}</span>
                                <button onClick={()=>setCurrentUser(null)} className="text-red-400 font-bold">Logout</button>
                            </div>
                            {isSyncing && <div className="text-blue-400 flex items-center justify-center gap-2"><div className="loader w-3 h-3"></div> Auto Syncing...</div>}
                        </div>
                    </aside>

                    <div className="md:hidden fixed top-0 left-0 right-0 bg-slate-900 text-white p-4 z-30 flex justify-between items-center shadow-lg">
                        <div className="font-bold flex items-center gap-2"><Icons.Warehouse/> NLC ERP</div>
                        <div className="flex items-center gap-3">
                             {isSyncing && <div className="text-blue-400 flex items-center justify-center gap-1 text-xs"><div className="loader w-2 h-2 border-white border-t-transparent"></div></div>}
                            <button onClick={()=>setCurrentUser(null)} className="text-xs bg-slate-800 px-3 py-1 rounded">Logout</button>
                        </div>
                    </div>
                    
                    <main className="flex-1 overflow-y-auto p-4 md:p-8 pt-20 md:pt-8 pb-24 md:pb-8 h-full">
                        {currentView === 'dashboard' && <DashboardView inventory={inventory} transactions={transactions} toInventory={()=>setCurrentView('inventory')} />}
                        {currentView === 'inventory' && <InventoryView inventory={inventory} setInventory={setInventory} addTransaction={addTransaction} deleteItem={handleDeleteItem} apiUrl={apiUrl} currentUser={currentUser} setTransactions={setTransactions} />}
                        {currentView === 'mrp' && <AdvancedMRPView inventory={inventory} addTransaction={addTransaction} bomData={bomData} setBomData={setBomData} apiUrl={apiUrl} />}
                        {currentView === 'stockcount' && <StockCountView inventory={inventory} setInventory={setInventory} addTransaction={addTransaction} currentUser={currentUser} apiUrl={apiUrl} bomData={bomData} />}
                        {currentView === 'history' && <HistoryView transactions={transactions} />}
                        {currentView === 'settings' && <SettingsView apiUrl={apiUrl} setApiUrl={setApiUrl} users={users} currentUser={currentUser} onSaveUser={handleSaveUser} onDeleteUser={handleDeleteUser} />}
                    </main>

                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-2 z-30 flex justify-between items-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] pb-safe">
                        <MobileNavItem icon="Dashboard" label="ภาพรวม" active={currentView==='dashboard'} onClick={()=>setCurrentView('dashboard')} />
                        <MobileNavItem icon="Warehouse" label="คลัง" active={currentView==='inventory'} onClick={()=>setCurrentView('inventory')} />
                        <MobileNavItem icon="Production" label="ผลิต" active={currentView==='mrp'} onClick={()=>setCurrentView('mrp')} />
                        <MobileNavItem icon="Clipboard" label="นับสต๊อก" active={currentView==='stockcount'} onClick={()=>setCurrentView('stockcount')} />
                        <MobileNavItem icon="History" label="ประวัติ" active={currentView==='history'} onClick={()=>setCurrentView('history')} />
                        <MobileNavItem icon="Settings" label="ตั้งค่า" active={currentView==='settings'} onClick={()=>setCurrentView('settings')} />
                    </div>
                </div>
            );
        };

        const SidebarItem = ({ icon, label, active, onClick }) => {
            const Icon = Icons[icon];
            return <button onClick={onClick} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 text-sm font-medium sidebar-link ${active ? 'active text-blue-400 bg-slate-800' : 'hover:text-white hover:bg-slate-800'}`}><Icon/> {label}</button>;
        };

        const LoginView = ({ onLogin, isLoading, apiUrl, setApiUrl }) => {
            const [u, setU] = useState(""); 
            const [p, setP] = useState("");
            const [showConfig, setShowConfig] = useState(false);
            const [tempUrl, setTempUrl] = useState(apiUrl);

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-800 p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center relative">
                        <button onClick={()=>setShowConfig(!showConfig)} className="absolute top-4 right-4 text-slate-300 hover:text-slate-500" title="Connection Settings"><Icons.Settings/></button>
                        
                        <div className="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-white text-2xl"><Icons.Warehouse/></div>
                        <h1 className="text-xl font-bold mb-6 text-slate-800">NLC Factory ERP</h1>
                        
                        {showConfig ? (
                            <div className="mb-6 animate-fade-in text-left bg-slate-50 p-4 rounded-xl border">
                                <label className="text-xs font-bold text-slate-500 mb-1 block">API URL (Google Apps Script)</label>
                                <textarea value={tempUrl} onChange={e=>setTempUrl(e.target.value)} className="w-full p-2 border rounded text-xs mb-2 h-20 break-all" />
                                <div className="flex gap-2">
                                    <button onClick={()=>setShowConfig(false)} className="flex-1 py-2 bg-slate-200 rounded text-xs font-bold text-slate-600">Cancel</button>
                                    <button onClick={()=>{ setApiUrl(tempUrl); localStorage.setItem(STORAGE_KEY_API_URL, tempUrl); setShowConfig(false); alert("บันทึก URL แล้ว กรุณารอสักครู่ระบบจะรีโหลดข้อมูล..."); window.location.reload(); }} className="flex-1 bg-blue-600 text-white py-2 rounded text-xs font-bold">Save & Reload</button>
                                </div>
                            </div>
                        ) : (
                            <>
                                <input type="text" value={u} onChange={e=>setU(e.target.value)} className="w-full p-3 border rounded-xl mb-3 outline-none focus:ring-2 focus:ring-blue-100" placeholder="Username"/>
                                <input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==='Enter'&&onLogin(u,p)} className="w-full p-3 border rounded-xl mb-6 outline-none focus:ring-2 focus:ring-blue-100" placeholder="Password"/>
                                <button onClick={()=>onLogin(u,p)} disabled={isLoading} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition disabled:opacity-50">
                                    {isLoading ? "Connecting..." : "Login"}
                                </button>
                                <div className="mt-4 text-[10px] text-slate-400">Cloud Status: {isLoading ? 'Syncing...' : 'Ready'}</div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        const AdvancedMRPView = ({ inventory, addTransaction, bomData, setBomData, apiUrl }) => {
            const [step, setStep] = useState(1);
            const [mode, setMode] = useState('plan'); 
            const [sheetNames, setSheetNames] = useState(Object.keys(bomData) || []);
            const [currentPreviewSheet, setCurrentPreviewSheet] = useState(sheetNames[0] || "");
            
            const [pNoCol, setPNoCol] = useState(2);
            const [qtyCol, setQtyCol] = useState(4);
            const [lvlCol, setLvlCol] = useState(0);
            const [typeCol, setTypeCol] = useState(6);
            const [nameCol, setNameCol] = useState(3);
            
            const [bomColWidths, setBomColWidths] = useState({});

            const [orderText, setOrderText] = useState("");
            const [matchCandidates, setMatchCandidates] = useState([]);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            
            const [finalSummary, setFinalSummary] = useState(null); 
            const [finalTree, setFinalTree] = useState(null);       
            const [resultViewMode, setResultViewMode] = useState('tree'); 
            const [breakdownItem, setBreakdownItem] = useState(null); 
            
            const [searchPartQuery, setSearchPartQuery] = useState("");
            const [partSearchResults, setPartSearchResults] = useState(null);

            const [isLoading, setIsLoading] = useState(false);
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'ascending' });
            const [compareList, setCompareList] = useState(["", ""]);
            const [compResult, setCompResult] = useState(null);

            const getSimilarity = (s1, s2) => {
                s1 = String(s1 || "").toLowerCase().trim(); 
                s2 = String(s2 || "").toLowerCase().trim();
                
                if (s1 === s2) return 1.0; 
                if (s1.includes(s2) || s2.includes(s1)) return 0.9; 

                const len1 = s1.length;
                const len2 = s2.length;
                const maxLen = Math.max(len1, len2);
                if (maxLen === 0) return 1.0;

                const track = Array(len2 + 1).fill(null).map(() => Array(len1 + 1).fill(null));

                for (let i = 0; i <= len1; i++) track[0][i] = i;
                for (let j = 0; j <= len2; j++) track[j][0] = j;

                for (let j = 1; j <= len2; j++) {
                    for (let i = 1; i <= len1; i++) {
                        const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
                        track[j][i] = Math.min(
                            track[j][i - 1] + 1, 
                            track[j - 1][i] + 1, 
                            track[j - 1][i - 1] + indicator 
                        );
                    }
                }
                
                const distance = track[len2][len1];
                return 1 - (distance / maxLen);
            };

            const handleCloudLoad = async () => {
                if (!apiUrl) return alert("กรุณาตั้งค่า URL ก่อน");
                setIsLoading(true);
                try {
                    const res = await fetch(apiUrl + "?action=getBOM&t=" + Date.now());
                    const json = await res.json();
                    const data = json.data || json;
                    const names = Object.keys(data).filter(k => k !== 'version');
                    setBomData(data);
                    setSheetNames(names);
                    setCurrentPreviewSheet(names[0]);
                    alert("ดึงข้อมูล BOM สำเร็จ");
                } catch(e) { alert("โหลดข้อมูลไม่สำเร็จ (CORS/Deploy Error): " + e.message); }
                finally { setIsLoading(false); }
            };

            const handlePreCalculate = () => {
                const lines = orderText.split('\n').filter(l => l.trim() !== "");
                const parsedOrders = lines.map(l => {
                    const parts = l.trim().split(/[\s\t,]+/);
                    if (parts.length < 2) return null;
                    return { model: parts[0], qty: parseFloat(parts[parts.length-1]) };
                }).filter(o => o && !isNaN(o.qty));

                if (parsedOrders.length === 0) return alert("กรุณากรอก Order เช่น 'ModelA 100'");

                const candidates = parsedOrders.map(order => {
                    let bestMatch = ""; let maxScore = 0;
                    sheetNames.forEach(sheet => {
                        const score = getSimilarity(order.model, sheet);
                        if (score > maxScore) { maxScore = score; bestMatch = sheet; }
                    });
                    return { ...order, matchedSheet: bestMatch, score: maxScore };
                });

                setMatchCandidates(candidates);
                setShowConfirmModal(true);
            };

            const handleCalculateFinal = () => {
                setShowConfirmModal(false);
                const summaryResults = {};
                const treeResults = [];
                
                matchCandidates.forEach(order => {
                    if (!order.matchedSheet) return;

                    treeResults.push({
                        type: 'JOB_HEADER',
                        partNo: order.matchedSheet, 
                        name: `Production Job: ${order.qty} Unit(s)`,
                        reqQty: order.qty,
                        level: 0,
                        isHeader: true
                    });

                    const sheetRows = bomData[order.matchedSheet];

                    sheetRows.forEach((row, idx) => {
                        if (idx === 0) return; 
                        
                        const pNo = String(row[pNoCol] || "").trim();
                        const qpu = parseFloat(row[qtyCol]) || 0; 
                        const lvl = parseFloat(row[lvlCol]); 
                        const name = row[nameCol] || "";
                        const type = row[typeCol] || "-";

                        // ข้ามบรรทัดที่ไม่มี Part No หรือ Part No ซ้ำกับชื่อ Model ตัวมันเอง (ป้องกันลูปคำนวณซ้ำ)
                        if (!pNo || pNo === order.matchedSheet) return;

                        const totalReq = qpu * order.qty;

                        if (!summaryResults[pNo]) {
                            summaryResults[pNo] = { 
                                partNo: pNo, name: name, level: lvl, type: type, reqQty: 0, breakdown: []
                            };
                        }
                        summaryResults[pNo].reqQty += totalReq;
                        
                        summaryResults[pNo].breakdown.push({ model: order.matchedSheet, qty: totalReq });

                        const stock = inventory.find(i => i.partNo === pNo);
                        const onHand = stock ? stock.qty : 0;

                        treeResults.push({
                            partNo: pNo,
                            name: name,
                            level: lvl, 
                            type: type,
                            reqQty: totalReq,
                            qpu: qpu,
                            onHand: onHand,
                            diff: onHand - totalReq, 
                            parentModel: order.matchedSheet 
                        });
                    });
                });

                const finalSum = Object.values(summaryResults).map(item => {
                    const stock = inventory.find(i => i.partNo === item.partNo);
                    const onHand = stock ? stock.qty : 0;
                    return { ...item, onHand, diff: onHand - item.reqQty };
                });

                setFinalSummary(finalSum);
                setFinalTree(treeResults);
                setStep(3);
                setResultViewMode('tree'); 
            };

            const handleCompare = () => {
                const validModels = compareList.filter(m => m !== ""); 
                if (validModels.length < 2) return alert("กรุณาเลือกอย่างน้อย 2 รุ่น");
                
                const allParts = new Set();
                const modelMaps = validModels.map(m => {
                    const map = {};
                    const rows = bomData[m] || [];
                    rows.slice(1).forEach(r => {
                        const pNo = String(r[pNoCol]||"").trim();
                        if(pNo) {
                            map[pNo] = { qty: parseFloat(r[qtyCol]||0), name: r[nameCol] };
                            allParts.add(pNo);
                        }
                    });
                    return map;
                });

                const rows = Array.from(allParts).map(pNo => {
                    const qs = modelMaps.map(map => map[pNo]?.qty || 0);
                    const name = modelMaps.find(map => map[pNo]?.name)?.[pNo]?.name || "";
                    const isDiff = qs.some(q => q !== qs[0]);
                    return { partNo: pNo, name, quantities: qs, status: isDiff ? 'Diff' : 'Same' };
                });
                
                setCompResult({ models: validModels, rows });
            };

            const handlePartSearch = () => {
                if (!searchPartQuery.trim()) return alert("กรุณาพิมพ์คำค้นหา");
                
                const results = [];
                const term = searchPartQuery.toLowerCase();

                sheetNames.forEach(sheet => {
                    const rows = bomData[sheet];
                    if (!rows) return;
                    
                    rows.slice(1).forEach((row, idx) => { 
                        const pNo = String(row[pNoCol] || "").trim();
                        const name = String(row[nameCol] || "").trim();
                        
                        if (pNo.toLowerCase().includes(term) || name.toLowerCase().includes(term)) {
                            results.push({
                                partNo: pNo,
                                name: name,
                                model: sheet,
                                qty: parseFloat(row[qtyCol]) || 0,
                                type: row[typeCol] || "-"
                            });
                        }
                    });
                });
                
                setPartSearchResults(results);
            };

            const requestSort = (key) => {
                let direction = 'ascending';
                if (sortConfig.key === key && sortConfig.direction === 'ascending') {
                    direction = 'descending';
                }
                setSortConfig({ key, direction });
            };

            const sortedSummary = useMemo(() => {
                if (!finalSummary) return null;
                let sortableItems = [...finalSummary];
                if (sortConfig.key !== null) {
                    sortableItems.sort((a, b) => {
                        let aValue = a[sortConfig.key];
                        let bValue = b[sortConfig.key];
                        const aNum = parseFloat(aValue);
                        const bNum = parseFloat(bValue);
                        if (!isNaN(aNum) && !isNaN(bNum)) { aValue = aNum; bValue = bNum; } 
                        else { aValue = String(aValue).toLowerCase(); bValue = String(bValue).toLowerCase(); }
                        if (aValue < bValue) return sortConfig.direction === 'ascending' ? -1 : 1;
                        if (aValue > bValue) return sortConfig.direction === 'ascending' ? 1 : -1;
                        return 0;
                    });
                }
                return sortableItems;
            }, [finalSummary, sortConfig]);

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="flex bg-white p-2 rounded-xl shadow-sm border mb-6">
                        {['1. Setup BOM', '2. Functions', '3. Result'].map((t, i) => (
                            <button key={i} onClick={() => setStep(i+1)} className={`flex-1 py-2 text-sm font-bold rounded-lg ${step === i+1 ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>{t}</button>
                        ))}
                    </div>

                    {step === 1 && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="font-bold">BOM Configuration</h3>
                                <button onClick={handleCloudLoad} disabled={isLoading} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2">
                                    {isLoading ? <div className="loader"/> : <Icons.Cloud/>} Sync Cloud BOM
                                </button>
                            </div>
                            
                            {sheetNames.length > 0 ? (
                                <>
                                    <div className="flex gap-2 overflow-x-auto pb-4 mb-4">
                                        {sheetNames.map(n => <button key={n} onClick={()=>setCurrentPreviewSheet(n)} className={`px-3 py-1 rounded-full text-xs whitespace-nowrap border ${currentPreviewSheet===n?'bg-slate-800 text-white':'bg-white'}`}>{n}</button>)}
                                    </div>
                                    
                                    <div className="overflow-x-auto border rounded-xl h-96 text-xs">
                                        <table className="w-max border-collapse">
                                            <thead className="bg-white sticky top-0 z-10 shadow-sm">
                                                <tr>
                                                    <th className="p-2 border-b border-r bg-slate-50 text-center w-10">#</th>
                                                    {bomData[currentPreviewSheet]?.[0]?.map((h, i) => (
                                                        <ResizableTh key={i} width={bomColWidths[i] || 150} onResize={w => setBomColWidths(prev => ({...prev, [i]: w}))} className="p-2 border-b border-r bg-white align-top">
                                                            <div className="flex flex-col gap-2">
                                                                <div className="grid grid-cols-3 gap-1">
                                                                    <button onClick={()=>setPNoCol(i)} className={`px-1 py-0.5 border rounded text-[9px] font-bold ${i===pNoCol?'bg-blue-600 text-white':'bg-slate-50 text-slate-400 hover:bg-slate-100'}`}>P#</button>
                                                                    <button onClick={()=>setNameCol(i)} className={`px-1 py-0.5 border rounded text-[9px] font-bold ${i===nameCol?'bg-emerald-500 text-white':'bg-slate-50 text-slate-400 hover:bg-slate-100'}`}>Name</button>
                                                                    <button onClick={()=>setQtyCol(i)} className={`px-1 py-0.5 border rounded text-[9px] font-bold ${i===qtyCol?'bg-sky-500 text-white':'bg-slate-50 text-slate-400 hover:bg-slate-100'}`}>Qty</button>
                                                                    <button onClick={()=>setLvlCol(i)} className={`px-1 py-0.5 border rounded text-[9px] font-bold ${i===lvlCol?'bg-purple-500 text-white':'bg-slate-50 text-slate-400 hover:bg-slate-100'}`}>Lvl</button>
                                                                    <button onClick={()=>setTypeCol(i)} className={`px-1 py-0.5 border rounded text-[9px] font-bold ${i===typeCol?'bg-orange-500 text-white':'bg-slate-50 text-slate-400 hover:bg-slate-100'}`}>Type</button>
                                                                </div>
                                                                <div className="font-bold text-slate-700 truncate" title={h}>{h || `Col ${i}`}</div>
                                                            </div>
                                                        </ResizableTh>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {bomData[currentPreviewSheet]?.slice(1).map((row, ri) => (
                                                    <tr key={ri} className="border-b hover:bg-slate-50">
                                                        <td className="p-2 border-r text-center text-slate-300">{ri+1}</td>
                                                        {row.map((c, ci) => (
                                                            <td key={ci} className={`p-2 border-r truncate max-w-[150px] 
                                                                ${ci===pNoCol?'bg-blue-50 text-blue-700 font-bold':''}
                                                                ${ci===qtyCol?'bg-sky-50 text-sky-700 font-bold':''}
                                                                ${ci===nameCol?'bg-emerald-50 text-emerald-700':''}
                                                            `}>{c}</td>
                                                        ))}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="mt-4 text-xs text-slate-500 flex gap-4">
                                        <span>Part No: <b className="text-blue-600">{pNoCol}</b></span>
                                        <span>Name: <b className="text-emerald-600">{nameCol}</b></span>
                                        <span>Qty: <b className="text-sky-600">{qtyCol}</b></span>
                                        <span>Level: <b className="text-purple-600">{lvlCol}</b></span>
                                        <span>Type: <b className="text-orange-600">{typeCol}</b></span>
                                    </div>
                                    <button onClick={()=>setStep(2)} className="w-full mt-6 bg-blue-600 text-white py-3 rounded-xl font-bold">Next: Functions</button>
                                </>
                            ) : <div className="text-center py-20 text-slate-400">กดปุ่ม Sync เพื่อโหลดข้อมูล BOM</div>}
                        </div>
                    )}

                    {step === 2 && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border">
                             <div className="flex gap-4 border-b mb-6 overflow-x-auto pb-1">
                                 <button onClick={()=>setMode('plan')} className={`pb-2 px-2 text-sm font-bold whitespace-nowrap transition ${mode==='plan'?'border-b-2 border-blue-600 text-blue-600':'text-slate-400 hover:text-slate-600'}`}><Icons.Production className="mr-1"/> Production Plan</button>
                                 <button onClick={()=>setMode('compare')} className={`pb-2 px-2 text-sm font-bold whitespace-nowrap transition ${mode==='compare'?'border-b-2 border-purple-600 text-purple-600':'text-slate-400 hover:text-slate-600'}`}><Icons.Compare className="mr-1"/> BOM Compare</button>
                                 <button onClick={()=>setMode('search')} className={`pb-2 px-2 text-sm font-bold whitespace-nowrap transition ${mode==='search'?'border-b-2 border-orange-500 text-orange-500':'text-slate-400 hover:text-slate-600'}`}><Icons.Search className="mr-1"/> Search Part</button>
                             </div>
                            
                            {mode === 'plan' && (
                                <>
                                    <textarea value={orderText} onChange={e=>setOrderText(e.target.value)} className="w-full h-40 p-4 border rounded-xl font-mono text-sm mb-4 outline-none focus:ring-2 focus:ring-blue-100" placeholder="ModelA 100&#10;ModelB 50"></textarea>
                                    <button onClick={handlePreCalculate} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2">
                                        <Icons.Check/> Check & Calculate
                                    </button>
                                </>
                            )}
                            
                            {mode === 'compare' && (
                                <>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                                        {compareList.map((m, i) => (
                                            <div key={i}>
                                                <label className="text-xs font-bold text-purple-500">Model {i+1}</label>
                                                <select value={m} onChange={e=>{const l=[...compareList]; l[i]=e.target.value; setCompareList(l);}} className="w-full p-2 border rounded">
                                                    <option value="">-- Select --</option>
                                                    {sheetNames.map(s=><option key={s} value={s}>{s}</option>)}
                                                </select>
                                            </div>
                                        ))}
                                        <button onClick={()=>setCompareList([...compareList, ""])} className="mt-6 border border-dashed rounded text-purple-500 hover:bg-purple-50"><Icons.Plus/></button>
                                    </div>
                                    <button onClick={handleCompare} className="w-full bg-purple-600 text-white py-3 rounded-xl font-bold">Compare</button>
                                    {compResult && (
                                        <div className="mt-6 overflow-auto border rounded-xl max-h-96">
                                            <table className="w-full text-xs text-left">
                                                <thead className="bg-purple-50 sticky top-0">
                                                    <tr><th className="p-3">Part No</th>{compResult.models.map((m,i)=><th key={i} className="p-3 text-right">{m}</th>)}<th className="p-3 text-center">Status</th></tr>
                                                </thead>
                                                <tbody>
                                                    {compResult.rows.map((r,i)=>(
                                                        <tr key={i} className={r.status==='Diff'?'bg-orange-50':''}>
                                                            <td className="p-3 font-bold text-slate-700">{r.partNo}<div className="text-[10px] font-normal text-slate-400">{r.name}</div></td>
                                                            {r.quantities.map((q,qi)=><td key={qi} className="p-3 text-right">{formatNum(q)}</td>)}
                                                            <td className="p-3 text-center">{r.status==='Diff'?<span className="text-orange-600 font-bold">Diff</span>:'-'}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </>
                            )}

                            {mode === 'search' && (
                                <div className="animate-fade-in">
                                    <div className="flex gap-2 mb-6">
                                        <input 
                                            type="text" 
                                            value={searchPartQuery} 
                                            onChange={e => setSearchPartQuery(e.target.value)} 
                                            onKeyDown={e => e.key === 'Enter' && handlePartSearch()}
                                            className="flex-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-orange-100" 
                                            placeholder="ระบุ Part No หรือ ชื่อสินค้า..." 
                                        />
                                        <button onClick={handlePartSearch} className="bg-orange-500 text-white px-6 rounded-xl font-bold shadow-lg flex items-center gap-2">
                                            <Icons.Search/> ค้นหา
                                        </button>
                                    </div>

                                    {partSearchResults && (
                                        <div className="overflow-hidden border rounded-xl">
                                            <div className="bg-orange-50 p-3 text-xs font-bold text-orange-800 border-b">
                                                ผลการค้นหา: พบ {partSearchResults.length} รายการ
                                            </div>
                                            <div className="overflow-auto max-h-96">
                                                <table className="w-full text-xs text-left">
                                                    <thead className="bg-white sticky top-0">
                                                        <tr className="border-b text-slate-500">
                                                            <th className="p-3">Part No / Name</th>
                                                            <th className="p-3">Used In (Model)</th>
                                                            <th className="p-3 text-right">Qty/Unit</th>
                                                            <th className="p-3 text-center">Type</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y">
                                                        {partSearchResults.length === 0 ? (
                                                            <tr><td colSpan="4" className="p-8 text-center text-slate-400">ไม่พบข้อมูล</td></tr>
                                                        ) : (
                                                            partSearchResults.map((item, idx) => (
                                                                <tr key={idx} className="hover:bg-slate-50">
                                                                    <td className="p-3">
                                                                        <div className="font-bold text-blue-600">{item.partNo}</div>
                                                                        <div className="text-slate-500">{item.name}</div>
                                                                    </td>
                                                                    <td className="p-3 font-bold text-slate-700">{item.model}</td>
                                                                    <td className="p-3 text-right">{formatNum(item.qty)}</td>
                                                                    <td className="p-3 text-center">{item.type}</td>
                                                                </tr>
                                                            ))
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}

                    {step === 3 && (finalSummary || finalTree) && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="font-bold">MRP Result</h3>
                                <div className="flex gap-2">
                                    <div className="bg-slate-100 p-1 rounded-lg flex text-xs font-bold">
                                        <button onClick={()=>setResultViewMode('tree')} className={`px-3 py-1.5 rounded-md transition ${resultViewMode==='tree'?'bg-white shadow text-blue-600':'text-slate-500'}`}>Tree View</button>
                                        <button onClick={()=>setResultViewMode('summary')} className={`px-3 py-1.5 rounded-md transition ${resultViewMode==='summary'?'bg-white shadow text-blue-600':'text-slate-500'}`}>Total Summary</button>
                                    </div>
                                    <button onClick={()=>exportToExcel(resultViewMode === 'tree' ? finalTree : finalSummary, "MRP_Result")} className="text-green-600 font-bold text-sm flex items-center gap-2 px-3 py-1 hover:bg-green-50 rounded"><Icons.Excel/> Export</button>
                                </div>
                            </div>

                            {resultViewMode === 'summary' ? (
                                <div className="overflow-auto max-h-[60vh]">
                                    <table className="w-full text-xs text-left">
                                        <thead className="bg-slate-50 sticky top-0 cursor-pointer shadow-sm">
                                            <tr>
                                                <th className="p-3 border text-center hover:bg-slate-100" onClick={()=>requestSort('level')}>Level {sortConfig.key==='level' && <Icons.Sort/>}</th>
                                                <th className="p-3 border hover:bg-slate-100" onClick={()=>requestSort('partNo')}>Part No {sortConfig.key==='partNo' && <Icons.Sort/>}</th>
                                                <th className="p-3 border hover:bg-slate-100" onClick={()=>requestSort('name')}>Description {sortConfig.key==='name' && <Icons.Sort/>}</th>
                                                <th className="p-3 border hover:bg-slate-100" onClick={()=>requestSort('type')}>Type {sortConfig.key==='type' && <Icons.Sort/>}</th>
                                                <th className="p-3 border text-right hover:bg-slate-100" onClick={()=>requestSort('reqQty')}>Total Req {sortConfig.key==='reqQty' && <Icons.Sort/>}</th>
                                                <th className="p-3 border text-right hover:bg-slate-100" onClick={()=>requestSort('onHand')}>Stock {sortConfig.key==='onHand' && <Icons.Sort/>}</th>

                            <div><div className={`text-2xl font-bold ${lowStockItems.length > 0 ? 'text-red-600' : 'text-green-600'}`}>{lowStockItems.length}</div><div className="text-xs text-slate-500">Low Stock Alert</div></div>

                            <div className="overflow-auto max-h-60">
                                <table className="w-full text-sm">
                                    <thead className="text-xs text-slate-400 border-b text-left"><tr><th className="pb-2">Part No</th><th className="pb-2 text-right">Stock</th><th className="pb-2 text-right">Min</th></tr></thead>
                                    <tbody>
                                        {lowStockItems.length === 0 ? <tr><td colSpan="3" className="py-4 text-center text-slate-400">Stock OK</td></tr> : 
                                         lowStockItems.map(i => (<tr key={i.partNo} className="border-b border-slate-50"><td className="py-2 text-blue-600">{i.partNo}</td><td className="py-2 text-right font-bold text-red-500">{formatNum(i.qty)}</td><td className="py-2 text-right text-slate-400">{formatNum(i.minStock)}</td></tr>))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border">
                            <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><Icons.History className="text-blue-500"/> ความเคลื่อนไหวล่าสุด</h3>
                            <div className="space-y-3">
                                {transactions.slice(0,5).map(tx => (
                                    <div key={tx.id} className="flex justify-between items-center text-sm border-b border-slate-50 pb-2">
                                        <div className="flex items-center gap-3">
                                            <div className={`w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold ${tx.type==='IN'?'bg-green-100 text-green-700':tx.type==='OUT'?'bg-red-100 text-red-700':'bg-orange-100 text-orange-700'}`}>{tx.type}</div>
                                            <div><div className="font-bold text-slate-700">{tx.partNo}</div><div className="text-[10px] text-slate-400">{new Date(tx.date).toLocaleTimeString()}</div></div>
