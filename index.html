<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
            const apiUrl = 'https://script.google.com/macros/s/AKfycbySTjMR2ib4HIBwHmJ0oKR9eVDlKEaR362AqjgBnCd3m-RTPYZ5fdZ7DXZqERSZrtWa8A/exec';
        // --- Configuration ---
        const STORAGE_KEY_INV = "nlc_erp_inventory";
        const STORAGE_KEY_TRANS = "nlc_erp_transactions";
        const STORAGE_KEY_API_URL = "nlc_erp_api_url";
        const STORAGE_KEY_USERS = "nlc_erp_users";
        const STORAGE_KEY_SESSION = "nlc_erp_session"; 
        const STORAGE_KEY_BOM_DATA = "nlc_erp_bom_data";
        const STORAGE_KEY_BOM_VERSION = "nlc_erp_bom_version";
        const STORAGE_KEY_PART_IMAGES = "nlc_erp_part_images";

        // สร้าง URL รูป thumbnail จาก Google Drive fileId (ไฟล์ต้องตั้งแชร์ "ใครมีลิงก์ดูได้")
        const driveThumb = (fileId, size = 400) => fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w${size}` : "";

        // ลิงก์เปิดดูรูปใน Drive (สำหรับใส่ในไฟล์ Excel/PDF ที่ export) — ใช้รูปแรก (cover) ของพาร์ท
        const driveViewLink = (partImages, partNo) => {
            const fid = (partImages[String(partNo || "").trim()] || [])[0]?.fileId;
            return fid ? `https://drive.google.com/file/d/${fid}/view` : "";
        };
        const partFileId = (partImages, partNo) => (partImages[String(partNo || "").trim()] || [])[0]?.fileId || "";

        // <img> สำหรับรูป Drive ที่ทนต่อการโหลดพร้อมกันหลายรูป (rate-limit):
        // ใช้ lh3.googleusercontent.com เป็นหลัก (เร็ว/โดน throttle น้อย) → ถ้าพลาด fallback ไป
        // drive.google.com/thumbnail → ถ้ายังพลาดอีกให้ลองซ้ำแบบหน่วงเวลา (สูงสุด 3 ครั้ง)
        // ถ้า src เป็น data: (รูปที่เพิ่งอัป) จะใช้ตรง ๆ ไม่ผ่าน fallback
        const DriveImg = ({ src, fileId, size = 400, alt, className, onClick }) => {
            const isData = !!src && src.startsWith('data:');
            const chain = fileId ? [
                `https://lh3.googleusercontent.com/d/${fileId}=w${size}`,
                `https://drive.google.com/thumbnail?id=${fileId}&sz=w${size}`,
            ] : (src ? [src] : []);
            const [idx, setIdx] = useState(0);
            const [bust, setBust] = useState(0);
            const tries = useRef(0);
            useEffect(() => { setIdx(0); setBust(0); tries.current = 0; }, [fileId, src, size]);

            if (isData) return <img src={src} alt={alt} className={className} onClick={onClick} />;
            if (chain.length === 0) return null;

            const base = chain[Math.min(idx, chain.length - 1)];
            const cur = bust ? base + (base.includes('?') ? '&' : '?') + 'r=' + bust : base;
            const handleError = () => {
                if (idx < chain.length - 1) { setIdx(idx + 1); return; }
                if (tries.current < 3) { tries.current++; setTimeout(() => { setIdx(0); setBust(Date.now()); }, 500 * tries.current); }
            };
            return <img src={cur} alt={alt} className={className} loading="lazy" referrerPolicy="no-referrer" onClick={onClick} onError={handleError} />;
        };

        // ===== ค้นหาด้วยรูป (Visual Search) — TensorFlow.js + MobileNet (โหลดตอนใช้งานเท่านั้น) =====
        let __visionModel = null;
        const loadVisionModel = () => {
            if (__visionModel) return __visionModel;
            const loadScript = (src) => new Promise((res, rej) => {
                const s = document.createElement('script');
                s.src = src; s.async = true;
                s.onload = () => res();
                s.onerror = () => rej(new Error('โหลดสคริปต์ AI ไม่สำเร็จ (ตรวจอินเทอร์เน็ต): ' + src));
                document.head.appendChild(s);
            });
            __visionModel = (async () => {
                if (!window.tf) await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');
                if (!window.mobilenet) await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');
                return await window.mobilenet.load({ version: 2, alpha: 1.0 });
            })().catch((e) => { __visionModel = null; throw e; });
            return __visionModel;
        };
        const l2normalize = (v) => {
            let s = 0; for (let i = 0; i < v.length; i++) s += v[i] * v[i];
            s = Math.sqrt(s) || 1;
            const o = new Float32Array(v.length);
            for (let i = 0; i < v.length; i++) o[i] = v[i] / s;
            return o;
        };
        const embedImageEl = async (model, imgEl) => {
            const t = model.infer(imgEl, true); // embedding vector
            const data = await t.data();
            if (t.dispose) t.dispose();
            return l2normalize(Float32Array.from(data));
        };
        // เก็บเวกเตอร์แบบ int8 (quantize) → base64 เพื่อประหยัดพื้นที่ในชีต
        const embToB64 = (vec) => {
            const q = new Int8Array(vec.length);
            for (let i = 0; i < vec.length; i++) { let x = Math.round(vec[i] * 127); q[i] = x > 127 ? 127 : (x < -127 ? -127 : x); }
            const bytes = new Uint8Array(q.buffer);
            let bin = ''; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin);
        };
        const b64ToEmb = (str) => {
            try {
                const bin = atob(str);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const q = new Int8Array(bytes.buffer);
                const o = new Float32Array(q.length);
                for (let i = 0; i < q.length; i++) o[i] = q[i] / 127;
                return o;
            } catch (e) { return null; }
        };
        const cosineSim = (a, b) => { let s = 0; const n = Math.min(a.length, b.length); for (let i = 0; i < n; i++) s += a[i] * b[i]; return s; };
        const fileToImageEl = (file) => new Promise((res, rej) => {
            const r = new FileReader();
            r.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้'));
            r.onload = (e) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error('รูปเสียหาย')); img.src = e.target.result; };
            r.readAsDataURL(file);
        });
        const dataUrlToImageEl = (u) => new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error('รูปเสียหาย')); img.src = u; });

        // ===== เทียบตัวหนังสือ/label บนพาร์ท (จาก OCR) — เสริมการเทียบหน้าตารูปของ MobileNet ที่อ่านตัวหนังสือไม่ได้ =====
        // แตกข้อความ OCR เป็นคำ ๆ (token) แบบหยาบ: ตัวพิมพ์เล็กทั้งหมด เก็บเฉพาะ a-z/0-9/ไทย ยาวอย่างน้อย 2 ตัวอักษร
        const ocrTokens = (text) => {
            const m = String(text || "").toLowerCase().match(/[a-z0-9฀-๿]{2,}/g);
            return new Set(m || []);
        };
        // ความคล้ายของข้อความ 2 ชุดแบบ Dice coefficient (0-1) — 0 ถ้าฝั่งใดฝั่งหนึ่งไม่มีตัวหนังสือเลย
        const ocrTextSim = (tokensA, tokensB) => {
            if (!tokensA.size || !tokensB.size) return 0;
            let inter = 0;
            tokensA.forEach(t => { if (tokensB.has(t)) inter++; });
            return (2 * inter) / (tokensA.size + tokensB.size);
        };
        // อ่านตัวหนังสือในรูปผ่าน backend (Google Drive OCR) — คืน "" ถ้าอ่านไม่ได้/ล้มเหลว ไม่โยน error กัน flow หลักพัง
        const ocrImageB64 = async (apiUrl, base64, mimeType = "image/jpeg") => {
            if (!apiUrl || !base64) return "";
            try {
                const res = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "ocr_image", imageData: base64, mimeType })
                });
                const json = await res.json();
                return json.status === "success" ? String(json.text || "").trim() : "";
            } catch (e) { console.log("ocr failed", e); return ""; }
        };

        const DEFAULT_API_URL ="https://script.google.com/macros/s/AKfycby923XbLtP0TxMmKNG1JyhmtZeMNNALNCCJLXWr1GI70NYH0h7AI27c7yP2-L3h9Ne_zQ/exec"; 
        
        const INITIAL_INVENTORY = [
            { partNo: "DEMO-001", name: "สินค้าตัวอย่าง (กำลังเชื่อมต่อ Cloud...)", qty: 0, location: "-", unit: "PCS", minStock: 0 }
        ];

        const INITIAL_USERS = [
            { id: 1, username: 'admin', password: '1111', name: 'Administrator', role: 'ADMIN' }
        ];

        const formatNum = (n) => typeof n === 'number' ? n.toLocaleString() : "0";
        const getStorage = (key, def) => {
            const saved = localStorage.getItem(key);
            try { return saved ? JSON.parse(saved) : def; } catch(e) { return def; }
        };
        const setStorage = (key, val) => localStorage.setItem(key, JSON.stringify(val));

        const exportToExcel = (data, fileName, sheetName = "Sheet1") => {
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, sheetName);
            XLSX.writeFile(wb, `${fileName}_${new Date().toISOString().slice(0,10)}.xlsx`);
        };

        // Export ตารางเป็น PDF ผ่านหน้าต่าง print ของเบราว์เซอร์ (รองรับภาษาไทยเต็มที่ ไม่ต้องใช้ไลบรารีเพิ่ม)
        const exportTableToPDF = (title, headers, rows) => {
            const esc = (s) => String(s ?? "").replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            // cell ที่เป็น { imgId: fileId } จะแสดงเป็นรูป (ลอง lh3 ก่อน ถ้าพลาด fallback ไป drive thumbnail)
            const cellHtml = (c) => {
                if (c && typeof c === 'object' && c.imgId) {
                    const id = esc(c.imgId);
                    return `<img src="https://lh3.googleusercontent.com/d/${id}=w200" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='https://drive.google.com/thumbnail?id=${id}&sz=w200';" style="width:56px;height:56px;object-fit:contain;border:1px solid #e2e8f0;border-radius:4px;">`;
                }
                return esc(c);
            };
            const thead = '<tr>' + headers.map(h => `<th>${esc(h)}</th>`).join('') + '</tr>';
            const tbody = rows.map(r => '<tr>' + r.map(c => `<td>${cellHtml(c)}</td>`).join('') + '</tr>').join('');
            const html = `<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>${esc(title)}</title>
                <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
                <style>
                    *{font-family:'Sarabun','TH Sarabun New',sans-serif;box-sizing:border-box;}
                    body{padding:24px;color:#1e293b;margin:0;}
                    h2{margin:0 0 4px;font-size:18px;} .sub{color:#64748b;font-size:12px;margin-bottom:16px;}
                    table{width:100%;border-collapse:collapse;font-size:12px;}
                    th,td{border:1px solid #cbd5e1;padding:6px 8px;text-align:left;vertical-align:top;}
                    thead th{background:#f1f5f9;}
                    tbody tr:nth-child(even) td{background:#f8fafc;}
                    @media print{@page{margin:12mm;}}
                </style></head><body>
                <h2>${esc(title)}</h2>
                <div class="sub">พิมพ์เมื่อ ${esc(new Date().toLocaleString('th-TH'))} · ${rows.length} รายการ</div>
                <table><thead>${thead}</thead><tbody>${tbody}</tbody></table>
                <scr` + `ipt>window.onload=function(){setTimeout(function(){window.print();},300);};</scr` + `ipt>
                </body></html>`;
            const w = window.open('', '_blank');
            if (!w) { alert('เบราว์เซอร์บล็อก popup — กรุณาอนุญาต popup ของเว็บนี้แล้วลองใหม่'); return; }
            w.document.write(html);
            w.document.close();
        };

        const Icons = {
            Dashboard: (p) => <i className={`fa-solid fa-chart-line ${p.className}`}></i>,
            Warehouse: (p) => <i className={`fa-solid fa-warehouse ${p.className}`}></i>,
            Production: (p) => <i className={`fa-solid fa-industry ${p.className}`}></i>,
            History: (p) => <i className={`fa-solid fa-clock-rotate-left ${p.className}`}></i>,
            Settings: (p) => <i className={`fa-solid fa-gear ${p.className}`}></i>,
            Plus: (p) => <i className={`fa-solid fa-plus ${p.className}`}></i>,
            Minus: (p) => <i className={`fa-solid fa-minus ${p.className}`}></i>,
            Save: (p) => <i className={`fa-solid fa-floppy-disk ${p.className}`}></i>,
            Warn: (p) => <i className={`fa-solid fa-triangle-exclamation ${p.className}`}></i>,
            Box: (p) => <i className={`fa-solid fa-box-open ${p.className}`}></i>,
            Excel: (p) => <i className={`fa-solid fa-file-excel ${p.className}`}></i>,
            Trash: (p) => <i className={`fa-solid fa-trash-can ${p.className}`}></i>,
            Cloud: (p) => <i className={`fa-solid fa-cloud ${p.className}`}></i>,
            Refresh: (p) => <i className={`fa-solid fa-rotate ${p.className}`}></i>,
            Wand: (p) => <i className={`fa-solid fa-wand-magic-sparkles ${p.className}`}></i>,
            Download: (p) => <i className={`fa-solid fa-download ${p.className}`}></i>,
            Search: (p) => <i className={`fa-solid fa-magnifying-glass ${p.className}`}></i>,
            Compare: (p) => <i className={`fa-solid fa-code-compare ${p.className}`}></i>,
            X: (p) => <i className={`fa-solid fa-xmark ${p.className}`}></i>,
            User: (p) => <i className={`fa-solid fa-user ${p.className}`}></i>,
            Users: (p) => <i className={`fa-solid fa-users ${p.className}`}></i>,
            Check: (p) => <i className={`fa-solid fa-check ${p.className}`}></i>,
            Sort: (p) => <i className={`fa-solid fa-sort ${p.className}`}></i>,
            Clipboard: (p) => <i className={`fa-solid fa-clipboard-check ${p.className}`}></i>,
            Camera: (p) => <i className={`fa-solid fa-camera ${p.className}`}></i>
        };

        const ResizableTh = ({ width, onResize, children, className, onClick }) => {
            const [resizing, setResizing] = useState(false);
            const startX = useRef(0);
            const startWidth = useRef(0);

            const handleMouseDown = (e) => {
                e.preventDefault(); e.stopPropagation(); 
                setResizing(true);
                startX.current = e.pageX;
                startWidth.current = width;
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
            };

            const handleMouseMove = (e) => {
                requestAnimationFrame(() => {
                    const diff = e.pageX - startX.current;
                    onResize(Math.max(50, startWidth.current + diff));
                });
            };

            const handleMouseUp = () => {
                setResizing(false);
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', handleMouseUp);
            };

            return (
                <th className={`relative ${className} bg-slate-50`} style={{ width: width, minWidth: width }}>
                    <div className="flex items-center justify-center h-full w-full relative z-10 cursor-pointer" onClick={onClick}>
                        {children}
                    </div>
                    <div className={`resizer ${resizing ? 'resizing' : ''}`} onMouseDown={handleMouseDown} onClick={(e) => e.stopPropagation()} />
                </th>
            );
        };

        const MobileNavItem = ({ icon, label, active, onClick }) => {
            const Icon = Icons[icon];
            return (
                <button onClick={onClick} className={`flex flex-col items-center justify-center w-full py-1 ${active ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                    <div className={`text-xl mb-0.5 ${active ? '-translate-y-0.5' : ''} transition-transform`}><Icon/></div>
                    <span className="text-[10px] font-bold">{label}</span>
                </button>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [currentUser, setCurrentUser] = useState(() => getStorage(STORAGE_KEY_SESSION, null));
            const [currentView, setCurrentView] = useState("dashboard");
            const [inventory, setInventory] = useState(() => getStorage(STORAGE_KEY_INV, INITIAL_INVENTORY));
            const [transactions, setTransactions] = useState(() => getStorage(STORAGE_KEY_TRANS, []));
            const [users, setUsers] = useState(() => getStorage(STORAGE_KEY_USERS, INITIAL_USERS));
            const [bomData, setBomData] = useState(() => getStorage(STORAGE_KEY_BOM_DATA, {}));
            const [bomVersion, setBomVersion] = useState(() => getStorage(STORAGE_KEY_BOM_VERSION, 0));
            const [partImages, setPartImages] = useState(() => getStorage(STORAGE_KEY_PART_IMAGES, {}));
            const [apiUrl, setApiUrl] = useState(() => localStorage.getItem(STORAGE_KEY_API_URL) || DEFAULT_API_URL);
            
            const [isLoading, setIsLoading] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            useEffect(() => {
                setStorage(STORAGE_KEY_INV, inventory);
                setStorage(STORAGE_KEY_TRANS, transactions);
                setStorage(STORAGE_KEY_USERS, users);
                setStorage(STORAGE_KEY_BOM_DATA, bomData);
                setStorage(STORAGE_KEY_BOM_VERSION, bomVersion);
                setStorage(STORAGE_KEY_PART_IMAGES, partImages);
            }, [inventory, transactions, users, bomData, bomVersion, partImages]);

            useEffect(() => {
                if (currentUser) { setStorage(STORAGE_KEY_SESSION, currentUser); }
                fetchAllData(true); 
                if(!currentUser) { localStorage.removeItem(STORAGE_KEY_SESSION); }
            }, [currentUser]);

            useEffect(() => {
                if (!apiUrl) return;
                
                const checkAndSync = async () => {
                    try {
                        const res = await fetch(apiUrl + "?action=checkVersion&t=" + Date.now());
                        const data = await res.json();
                        if (data.lastUpdated && data.lastUpdated > bomVersion) {
                            console.log("Found new version, auto-syncing...");
                            fetchAllData(true);
                        }
                    } catch (e) {
                        console.log("Auto sync check failed (Offline or CORS?)");
                    }
                };

                const interval = setInterval(checkAndSync, 10000);
                return () => clearInterval(interval);
            }, [apiUrl, bomVersion]);

            const fetchAllData = async (isBackground = false) => {
                if (!apiUrl) return;
                if (!isBackground) setIsLoading(true);
                else setIsSyncing(true);

                try {
                    // แก้ไข: เปลี่ยนจาก getData เป็น getInventory ให้ตรงกับ API ใน Backend
                    const res = await fetch(apiUrl + "?action=getInventory&t=" + Date.now()); 
                    const data = await res.json();
                    
                    if (data.inventory) setInventory(data.inventory);
                    if (data.transactions) setTransactions(data.transactions);
                    if (data.users) setUsers(data.users); 

                    const resBOM = await fetch(apiUrl + "?action=getBOM&t=" + Date.now());
                    const jsonBOM = await resBOM.json();
                    const sheetData = jsonBOM.data || jsonBOM;
                    const version = jsonBOM.version || Date.now();
                    
                    const filteredBOM = {};
                    Object.keys(sheetData).forEach(key => {
                        if (key.toLowerCase() !== 'data' && key !== 'version') {
                            filteredBOM[key] = sheetData[key];
                        }
                    });
                    
                    setBomData(filteredBOM);
                    setBomVersion(version);

                    try {
                        const resImg = await fetch(apiUrl + "?action=getImages&t=" + Date.now());
                        const jsonImg = await resImg.json();
                        if (jsonImg.images) setPartImages(jsonImg.images);
                    } catch (imgErr) { console.log("Image sync skipped", imgErr); }

                } catch (e) {
                    console.error("Sync Error", e); 
                } finally { 
                    setIsLoading(false); 
                    setIsSyncing(false);
                }
            };

            const handleLogin = async (u, p) => {
                const cleanU = String(u).trim();
                const cleanP = String(p).trim();
                
                if (!cleanU || !cleanP) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");

                setIsLoading(true);
                try {
                    // 1. ส่งข้อมูลตรวจสอบล็อกอินไปยัง Cloud โดยตรง
                    const res = await fetch(`${apiUrl}?action=login&username=${encodeURIComponent(cleanU)}&password=${encodeURIComponent(cleanP)}`);
                    const data = await res.json();
                    
                    if (data.status === "success") {
                        setCurrentUser(data.user);
                        fetchAllData(); 
                        return;
                    } else {
                        // เพิ่ม: ถ้า Cloud ปฏิเสธ ให้แสดงข้อความจาก Cloud ทันที จะได้รู้ว่าเกิดจากอะไร
                        alert(`เข้าสู่ระบบไม่สำเร็จ: ${data.message || "Username หรือ Password ในระบบ Cloud ไม่ถูกต้อง"}`);
                        setIsLoading(false);
                        return; 
                    }
                } catch (error) {
                    console.warn("Cloud login failed, trying local fallback...", error);
                    // 2. แผนสำรอง: กรณีออฟไลน์ หรือ URL พังให้เช็คบัญชีในเครื่องที่แคชไว้
                    // ตรวจสอบ property password ก่อนเทียบเพราะข้อมูลจาก getInventory จะลบรหัสผ่านทิ้งไปแล้ว
                    const localUser = users.find(x => String(x.username).trim() === cleanU && x.password && String(x.password).trim() === cleanP);
                    
                    if (localUser) {
                        setCurrentUser(localUser);
                        fetchAllData(); 
                    } else if (cleanU === 'admin' && cleanP === '1111') {
                        // Fallback ฉุกเฉินกรณีพึ่งเปิดเว็บครั้งแรกและต่อ Cloud ไม่ได้
                        setCurrentUser({ id: 1, username: 'admin', name: 'Administrator', role: 'ADMIN' });
                        fetchAllData();
                    } else {
                        alert("ไม่สามารถเชื่อมต่อ Cloud ได้ และไม่มีข้อมูลบัญชีนี้ในเครื่อง\n(โปรดเช็ค URL API หรือการเชื่อมต่ออินเทอร์เน็ต)");
                    }
                } finally {
                    setIsLoading(false);
                }
            };

            const addTransaction = async (type, partNo, qty, refDoc, note, newItemData = null) => {
                const newTx = { id: Date.now().toString(), date: new Date().toISOString(), type, partNo, qty: parseFloat(qty), refDoc, note, user: currentUser.name };
                setTransactions(prev => [newTx, ...prev]);
                let updatedInv = [...inventory];
                const idx = updatedInv.findIndex(i => i.partNo === partNo);
                if (idx >= 0) {
                    let nQty = updatedInv[idx].qty;
                    if (type === 'IN' || type === 'INIT') nQty += parseFloat(qty);
                    else if (type === 'OUT') nQty -= parseFloat(qty);
                    else if (type === 'ADJUST') nQty = parseFloat(qty);
                    updatedInv[idx] = { ...updatedInv[idx], qty: nQty };
                } else if (newItemData) {
                    updatedInv.push({ ...newItemData, unit: 'PCS' });
                }
                setInventory(updatedInv);
                if (apiUrl) fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "add_transaction", data: newTx, itemData: newItemData }) });
            };

            const handleDeleteItem = async (partNo) => {
                if(!confirm(`ต้องการลบ ${partNo} ใช่หรือไม่?`)) return;
                setInventory(prev => prev.filter(i => i.partNo !== partNo));
                addTransaction('ADJUST', partNo, 0, 'DELETE', 'Item Deleted');
                if (apiUrl) fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete_item", partNo }) });
            };

            const handleSaveUser = async (u) => {
                const isNew = !u.id;
                let newUser = {...u};
                if(isNew) {
                    if(users.some(existing => existing.username === u.username)) return alert("Username ซ้ำ");
                    newUser.id = Date.now();
                }
                
                let newUsers = isNew ? [...users, newUser] : users.map(user => user.id === u.id ? {...user, ...u} : user);
                setUsers(newUsers);
                if (apiUrl) fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "save_user", user: newUser }) });
            };

            const handleDeleteUser = async (id) => {
                setUsers(prev => prev.filter(u => u.id !== id));
                if (apiUrl) fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete_user", id }) });
            };

            if (!currentUser) return <LoginView onLogin={handleLogin} isLoading={isLoading} apiUrl={apiUrl} setApiUrl={setApiUrl} />;

            return (
                <div className="flex h-screen bg-slate-100 relative overflow-hidden">
                    <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col hidden md:flex h-full">
                        <div className="p-6 border-b border-slate-800 font-bold text-white flex items-center gap-2"><Icons.Warehouse/> BOM</div>
                        <nav className="flex-1 p-4 space-y-1 overflow-y-auto">
                            <SidebarItem icon="Dashboard" label="ภาพรวม" active={currentView==='dashboard'} onClick={()=>setCurrentView('dashboard')} />
                            <SidebarItem icon="Warehouse" label="คลังสินค้า" active={currentView==='inventory'} onClick={()=>setCurrentView('inventory')} />
                            <SidebarItem icon="Production" label="แผนผลิต (MRP)" active={currentView==='mrp'} onClick={()=>setCurrentView('mrp')} />
                            <SidebarItem icon="Search" label="ค้นหาพาร์ท" active={currentView==='searchpart'} onClick={()=>setCurrentView('searchpart')} />
                            <SidebarItem icon="Camera" label="ค้นหาด้วยรูป" active={currentView==='visualsearch'} onClick={()=>setCurrentView('visualsearch')} />
                            <SidebarItem icon="Clipboard" label="นับสต๊อก" active={currentView==='stockcount'} onClick={()=>setCurrentView('stockcount')} />
                            <SidebarItem icon="History" label="ประวัติรายการ" active={currentView==='history'} onClick={()=>setCurrentView('history')} />
                            <SidebarItem icon="Settings" label="ตั้งค่า" active={currentView==='settings'} onClick={()=>setCurrentView('settings')} />
                        </nav>
                        <div className="p-4 border-t border-slate-800 text-xs text-center flex flex-col gap-2">
                            <div className="flex justify-between items-center w-full">
                                <span>{currentUser.name}</span>
                                <button onClick={()=>setCurrentUser(null)} className="text-red-400 font-bold">Logout</button>
                            </div>
                            {isSyncing && <div className="text-blue-400 flex items-center justify-center gap-2"><div className="loader w-3 h-3"></div> Auto Syncing...</div>}
                        </div>
                    </aside>

                    <div className="md:hidden fixed top-0 left-0 right-0 bg-slate-900 text-white p-4 z-30 flex justify-between items-center shadow-lg">
                        <div className="font-bold flex items-center gap-2"><Icons.Warehouse/> BOM</div>
                        <div className="flex items-center gap-3">
                             {isSyncing && <div className="text-blue-400 flex items-center justify-center gap-1 text-xs"><div className="loader w-2 h-2 border-white border-t-transparent"></div></div>}
                            <button onClick={()=>setCurrentUser(null)} className="text-xs bg-slate-800 px-3 py-1 rounded">Logout</button>
                        </div>
                    </div>
                    
                    <main className="flex-1 overflow-y-auto p-4 md:p-8 pt-20 md:pt-8 pb-24 md:pb-8 h-full">
                        {currentView === 'dashboard' && <DashboardView inventory={inventory} transactions={transactions} toInventory={()=>setCurrentView('inventory')} />}
                        {currentView === 'inventory' && <InventoryView inventory={inventory} setInventory={setInventory} addTransaction={addTransaction} deleteItem={handleDeleteItem} apiUrl={apiUrl} currentUser={currentUser} setTransactions={setTransactions} partImages={partImages} setPartImages={setPartImages} />}
                        {currentView === 'mrp' && <AdvancedMRPView inventory={inventory} addTransaction={addTransaction} bomData={bomData} setBomData={setBomData} apiUrl={apiUrl} partImages={partImages} setPartImages={setPartImages} currentUser={currentUser} />}
                        {currentView === 'searchpart' && <SearchPartView inventory={inventory} bomData={bomData} apiUrl={apiUrl} partImages={partImages} setPartImages={setPartImages} currentUser={currentUser} />}
                        {currentView === 'visualsearch' && <VisualSearchView inventory={inventory} bomData={bomData} apiUrl={apiUrl} partImages={partImages} setPartImages={setPartImages} currentUser={currentUser} />}
                        {currentView === 'stockcount' && <StockCountView inventory={inventory} setInventory={setInventory} addTransaction={addTransaction} currentUser={currentUser} apiUrl={apiUrl} bomData={bomData} />}
                        {currentView === 'history' && <HistoryView transactions={transactions} />}
                        {currentView === 'settings' && <SettingsView apiUrl={apiUrl} setApiUrl={setApiUrl} users={users} currentUser={currentUser} onSaveUser={handleSaveUser} onDeleteUser={handleDeleteUser} />}
                    </main>

                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-2 z-30 flex justify-between items-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] pb-safe">
                        <MobileNavItem icon="Dashboard" label="ภาพรวม" active={currentView==='dashboard'} onClick={()=>setCurrentView('dashboard')} />
                        <MobileNavItem icon="Warehouse" label="คลัง" active={currentView==='inventory'} onClick={()=>setCurrentView('inventory')} />
                        <MobileNavItem icon="Production" label="ผลิต" active={currentView==='mrp'} onClick={()=>setCurrentView('mrp')} />
                        <MobileNavItem icon="Search" label="ค้นหา" active={currentView==='searchpart'} onClick={()=>setCurrentView('searchpart')} />
                        <MobileNavItem icon="Camera" label="รูปภาพ" active={currentView==='visualsearch'} onClick={()=>setCurrentView('visualsearch')} />
                        <MobileNavItem icon="Clipboard" label="นับสต๊อก" active={currentView==='stockcount'} onClick={()=>setCurrentView('stockcount')} />
                        <MobileNavItem icon="History" label="ประวัติ" active={currentView==='history'} onClick={()=>setCurrentView('history')} />
                        <MobileNavItem icon="Settings" label="ตั้งค่า" active={currentView==='settings'} onClick={()=>setCurrentView('settings')} />
                    </div>
                </div>
            );
        };

        const SidebarItem = ({ icon, label, active, onClick }) => {
            const Icon = Icons[icon];
            return <button onClick={onClick} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 text-sm font-medium sidebar-link ${active ? 'active text-blue-400 bg-slate-800' : 'hover:text-white hover:bg-slate-800'}`}><Icon/> {label}</button>;
        };

        const LoginView = ({ onLogin, isLoading, apiUrl, setApiUrl }) => {
            const [u, setU] = useState(""); 
            const [p, setP] = useState("");
            const [showConfig, setShowConfig] = useState(false);
            const [tempUrl, setTempUrl] = useState(apiUrl);

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-800 p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center relative">
                        <button onClick={()=>setShowConfig(!showConfig)} className="absolute top-4 right-4 text-slate-300 hover:text-slate-500" title="Connection Settings"><Icons.Settings/></button>
                        
                        <div className="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-white text-2xl"><Icons.Warehouse/></div>
                        <h1 className="text-xl font-bold mb-6 text-slate-800">NLC Factory ERP</h1>
                        
                        {showConfig ? (
                            <div className="mb-6 animate-fade-in text-left bg-slate-50 p-4 rounded-xl border">
                                <label className="text-xs font-bold text-slate-500 mb-1 block">API URL (Google Apps Script)</label>
                                <textarea value={tempUrl} onChange={e=>setTempUrl(e.target.value)} className="w-full p-2 border rounded text-xs mb-2 h-20 break-all" />
                                <div className="flex gap-2">
                                    <button onClick={()=>setShowConfig(false)} className="flex-1 py-2 bg-slate-200 rounded text-xs font-bold text-slate-600">Cancel</button>
                                    <button onClick={()=>{ setApiUrl(tempUrl); localStorage.setItem(STORAGE_KEY_API_URL, tempUrl); setShowConfig(false); alert("บันทึก URL แล้ว กรุณารอสักครู่ระบบจะรีโหลดข้อมูล..."); window.location.reload(); }} className="flex-1 bg-blue-600 text-white py-2 rounded text-xs font-bold">Save & Reload</button>
                                </div>
                            </div>
                        ) : (
                            <>
                                <input type="text" value={u} onChange={e=>setU(e.target.value)} className="w-full p-3 border rounded-xl mb-3 outline-none focus:ring-2 focus:ring-blue-100" placeholder="Username"/>
                                <input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==='Enter'&&onLogin(u,p)} className="w-full p-3 border rounded-xl mb-6 outline-none focus:ring-2 focus:ring-blue-100" placeholder="Password"/>
                                <button onClick={()=>onLogin(u,p)} disabled={isLoading} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition disabled:opacity-50">
                                    {isLoading ? "Connecting..." : "Login"}
                                </button>
                                <div className="mt-4 text-[10px] text-slate-400">Cloud Status: {isLoading ? 'Syncing...' : 'Ready'}</div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // ===== ค้นหาพาร์ท (Search Part) — แยกออกมาเป็นฟังก์ชันเดี่ยว ไม่ฝังลึกอยู่ใน AdvancedMRPView =====
        const usePartSearch = (bomData, sheetNames = [], { pNoCol, nameCol, qtyCol, typeCol } = {}) => {
            const [searchPartQuery, setSearchPartQuery] = useState("");
            const [partSearchResults, setPartSearchResults] = useState(null);

            const handlePartSearch = () => {
                if (!searchPartQuery.trim()) return alert("กรุณาพิมพ์คำค้นหา");
                if (!bomData) return;

                const results = [];
                const term = searchPartQuery.toLowerCase();

                sheetNames.forEach(sheet => {
                    const rows = bomData[sheet];
                    if (!rows) return;

                    rows.slice(1).forEach((row) => {
                        const pNo = String(row[pNoCol] || "").trim();
                        const name = String(row[nameCol] || "").trim();

                        if (pNo.toLowerCase().includes(term) || name.toLowerCase().includes(term)) {
                            results.push({
                                partNo: pNo,
                                name: name,
                                model: sheet,
                                qty: parseFloat(row[qtyCol]) || 0,
                                type: row[typeCol] || "-"
                            });
                        }
                    });
                });

                setPartSearchResults(results);
            };

            return { searchPartQuery, setSearchPartQuery, partSearchResults, setPartSearchResults, handlePartSearch };
        };

        // ===== ค้นหาด้วยรูป (Visual Search) — แยกออกมาเป็นฟังก์ชันเดี่ยว ไม่ฝังลึกอยู่ใน AdvancedMRPView =====
        // embeddings: partNo -> [{ fileId, vector }] — พาร์ทเดียวกันมีได้หลายรูป/หลายมุม คะแนนของพาร์ทคือค่าที่ดีที่สุดในบรรดารูปทั้งหมด
        const NEG_EXAMPLE_PENALTY_WEIGHT = 0.4; // ทุก ๆ 1 หน่วยความคล้ายกับ "ตัวอย่างลบ" จะหักคะแนนพาร์ทนั้น 0.4 หน่วย
        const NEG_EXAMPLE_MAX_PENALTY = 0.25;   // เพดานหักคะแนนสูงสุด — กันไม่ให้ตัวอย่างลบตัวเดียว (เช่นกดพลาด) ลบคะแนนบวกที่สูงจริง ๆ จนหลุดผลค้นหาไปเลย
        const REJECT_DISABLED_ABOVE_SCORE = 0.6; // ความเหมือนสูงกว่านี้ถือว่าน่าจะถูกจริง ๆ ปิดปุ่ม "ไม่ใช่" กันกดพลาดไปสร้างตัวอย่างลบผิด ๆ
        const OCR_TEXT_MATCH_WEIGHT = 0.3;       // โบนัสคะแนนสูงสุดจากตัวหนังสือ/label ที่ตรงกัน (ตัวหนังสือตรงเป๊ะ = +0.3)

        const useVisualSearch = (apiUrl, partImages = {}, partNameMap = {}) => {
            const [embeddings, setEmbeddings] = useState({});
            const [negatives, setNegatives] = useState({}); // partNo -> [Float32Array, ...] ตัวอย่างที่เคยถูกปฏิเสธว่า "ไม่ใช่พาร์ทนี้"
            const [embLoaded, setEmbLoaded] = useState(false);
            const [visualBusy, setVisualBusy] = useState(false);
            const [visualMsg, setVisualMsg] = useState("");
            const [indexProg, setIndexProg] = useState({ done: 0, total: 0 });
            const [queryPreview, setQueryPreview] = useState("");
            const [queryFile, setQueryFile] = useState(null); // ไฟล์รูปที่ใช้ค้นหาล่าสุด — เก็บไว้เผื่อ user ยืนยันแล้วอยากบันทึกเป็นรูปของพาร์ทนั้นเลย
            const [queryEmbedding, setQueryEmbedding] = useState(null); // เวกเตอร์ของรูปที่ค้นหาล่าสุด — ใช้ตอนกด "ไม่ใช่พาร์ทนี้" โดยไม่ต้องคำนวณซ้ำ
            const [visualResults, setVisualResults] = useState(null);

            const loadEmbeddings = React.useCallback(async () => {
                if (!apiUrl) { setEmbLoaded(true); return; }
                try {
                    const [embRes, negRes] = await Promise.all([
                        fetch(apiUrl + "?action=getEmbeddings&t=" + Date.now()),
                        fetch(apiUrl + "?action=getNegativeExamples&t=" + Date.now())
                    ]);
                    const json = await embRes.json();
                    const out = {};
                    Object.keys(json.embeddings || {}).forEach(p => {
                        const list = (json.embeddings[p] || [])
                            .map(it => { const v = b64ToEmb(it.embedding); return v ? { fileId: it.fileId, vector: v, tokens: ocrTokens(it.ocrText), hasOcr: !!it.ocrText } : null; })
                            .filter(Boolean);
                        if (list.length) out[p] = list;
                    });
                    setEmbeddings(out);

                    const negJson = await negRes.json();
                    const negOut = {};
                    Object.keys(negJson.negatives || {}).forEach(p => {
                        const list = (negJson.negatives[p] || []).map(b64ToEmb).filter(Boolean);
                        if (list.length) negOut[p] = list;
                    });
                    setNegatives(negOut);
                } catch (e) { console.log("load embeddings failed", e); }
                finally { setEmbLoaded(true); }
            }, [apiUrl]);
            useEffect(() => { if (!embLoaded) loadEmbeddings(); }, [embLoaded, loadEmbeddings]);

            // สร้าง/อัปเดตดัชนี: ดึงรูปที่ยังไม่มี embedding จาก Drive (ผ่าน proxy) มาแปลงเป็นเวกเตอร์แล้วบันทึก — ทำทีละรูป ไม่ใช่ทีละพาร์ท
            // รวมถึงรูปที่ทำดัชนีไว้ตั้งแต่ก่อนมีระบบอ่านตัวหนังสือ (มี embedding แต่ยังไม่มี OCR text) ให้ประมวลผลใหม่ด้วย
            const buildIndex = async () => {
                if (!apiUrl) return alert("ยังไม่ได้ตั้งค่า API URL");
                const targets = [];
                Object.keys(partImages).forEach(p => {
                    const indexed = {};
                    (embeddings[p] || []).forEach(it => { indexed[it.fileId] = it; });
                    (partImages[p] || []).forEach(img => {
                        if (!img.fileId) return;
                        const existing = indexed[img.fileId];
                        if (!existing || !existing.hasOcr) targets.push({ partNo: p, fileId: img.fileId });
                    });
                });
                if (targets.length === 0) return alert("ดัชนีรูปครบแล้ว — ไม่มีรูปใหม่ให้ประมวลผล");
                setVisualBusy(true); setVisualMsg("กำลังโหลดโมเดล AI (ครั้งแรกอาจนานหน่อย)..."); setIndexProg({ done: 0, total: targets.length });
                try {
                    const model = await loadVisionModel();
                    const newEmb = { ...embeddings };
                    const toSave = [];
                    for (let i = 0; i < targets.length; i++) {
                        const { partNo: p, fileId } = targets[i];
                        setVisualMsg("กำลังประมวลผลรูปพาร์ท..."); setIndexProg({ done: i, total: targets.length });
                        try {
                            const res = await fetch(apiUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "get_image_b64", fileId }) });
                            const json = await res.json();
                            if (json.status !== "success" || !json.base64) continue;
                            const img = await dataUrlToImageEl("data:" + (json.mimeType || "image/jpeg") + ";base64," + json.base64);
                            const vec = await embedImageEl(model, img);
                            // อ่านตัวหนังสือ/label บนพาร์ทเก็บไว้เทียบด้วย — "·" = อ่านแล้วแต่ไม่มีตัวหนังสือ (กันไม่ให้ถูกจับมาประมวลผลซ้ำทุกครั้ง)
                            const ocrText = (await ocrImageB64(apiUrl, json.base64, json.mimeType || "image/jpeg")) || "·";
                            newEmb[p] = [...(newEmb[p] || []).filter(it => it.fileId !== fileId), { fileId, vector: vec, tokens: ocrTokens(ocrText), hasOcr: true }];
                            toSave.push({ partNo: p, fileId, embedding: embToB64(vec), ocrText });
                        } catch (err) { console.log("index fail", p, fileId, err); }
                    }
                    setIndexProg({ done: targets.length, total: targets.length });
                    if (toSave.length) {
                        setVisualMsg("กำลังบันทึกดัชนี...");
                        await fetch(apiUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "save_embeddings", items: toSave }) });
                    }
                    setEmbeddings(newEmb);
                    alert("สร้างดัชนีรูปเสร็จ: " + toSave.length + " รูป");
                } catch (e) {
                    alert("สร้างดัชนีไม่สำเร็จ: " + e.message);
                } finally { setVisualBusy(false); setVisualMsg(""); }
            };

            const handleQueryImage = async (e) => {
                const file = e.target.files[0]; e.target.value = "";
                if (!file) return;
                if (Object.keys(embeddings).length === 0) return alert("ยังไม่มีดัชนีรูป — กดปุ่ม 'สร้าง/อัปเดตดัชนีรูป' ก่อน");
                setVisualBusy(true); setVisualMsg("กำลังวิเคราะห์รูป..."); setVisualResults(null); setQueryFile(file); setQueryEmbedding(null);
                try {
                    const dataUrl = await new Promise((res) => { const r = new FileReader(); r.onload = ev => res(ev.target.result); r.readAsDataURL(file); });
                    setQueryPreview(dataUrl);
                    const model = await loadVisionModel();
                    const img = await fileToImageEl(file);
                    const q = await embedImageEl(model, img);
                    setQueryEmbedding(q);
                    setVisualMsg("กำลังอ่านตัวหนังสือในรูป...");
                    const queryTokens = ocrTokens(await ocrImageB64(apiUrl, dataUrl.split(',')[1])); // อ่าน label/ตัวหนังสือในรูปที่ถ่าย ไว้เทียบกับที่เคย OCR เก็บไว้ตอนทำดัชนี
                    const scored = Object.keys(embeddings).map(p => {
                        const posScore = Math.max(...embeddings[p].map(it => cosineSim(q, it.vector)));
                        const negSim = negatives[p] ? Math.max(0, ...negatives[p].map(v => cosineSim(q, v))) : 0;
                        // จำกัดเพดานการหักคะแนน กันไม่ให้ตัวอย่างลบเพียงอันเดียว (เช่นกดพลาด) ลบล้างคะแนนบวกที่สูงจริง ๆ ทิ้งไปทั้งหมด
                        const penalty = Math.min(negSim * NEG_EXAMPLE_PENALTY_WEIGHT, NEG_EXAMPLE_MAX_PENALTY);
                        // โบนัสจากตัวหนังสือ/label ตรงกัน — ช่วยแยกพาร์ทที่หน้าตาเหมือนกันแต่พิมพ์เบอร์/ยี่ห้อต่างกัน
                        const textSim = Math.max(0, ...embeddings[p].map(it => ocrTextSim(queryTokens, it.tokens || new Set())));
                        const score = Math.min(1, posScore - penalty + textSim * OCR_TEXT_MATCH_WEIGHT);
                        return { partNo: p, name: partNameMap[p] || "", score, textSim };
                    });
                    scored.sort((a, b) => b.score - a.score);
                    const filtered = scored.filter(r => r.score >= 0.5); // ตัดผลที่ความเหมือนต่ำกว่า 50% ทิ้ง (หลังหักคะแนนตัวอย่างลบแล้ว)
                    setVisualResults(filtered.slice(0, 12));
                } catch (err) {
                    alert("ค้นหาด้วยรูปไม่สำเร็จ: " + err.message);
                } finally { setVisualBusy(false); setVisualMsg(""); }
            };

            // ยืนยันว่ารูปที่ค้นหา "ไม่ใช่" พาร์ทนี้ -> เก็บเวกเตอร์ไว้เป็นตัวอย่างลบ เพื่อลดคะแนนพาร์ทนี้ในการค้นหาครั้งถัดไปถ้าเจอรูปคล้ายกันอีก
            // คืนค่า embedding (base64) กลับไปให้ผู้เรียกเก็บไว้ เผื่อกด "เลิกทำ" ทันทีถ้ากดผิดใบ
            const rejectMatch = async (partNo) => {
                if (!queryEmbedding) return null;
                const embedding = embToB64(queryEmbedding);
                setNegatives(prev => ({ ...prev, [partNo]: [...(prev[partNo] || []), queryEmbedding] }));
                if (apiUrl) {
                    await fetch(apiUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "save_negative_example", partNo, embedding })
                    });
                }
                return embedding;
            };

            // เลิกทำการ "ไม่ใช่" ล่าสุด (กดผิดใบ) — ลบตัวอย่างลบตัวที่เพิ่งสร้างออกทั้งฝั่งเครื่องและฝั่ง cloud
            const undoRejectMatch = async (partNo, embedding) => {
                setNegatives(prev => ({ ...prev, [partNo]: (prev[partNo] || []).filter(v => embToB64(v) !== embedding) }));
                if (!apiUrl) return;
                await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "delete_negative_example", partNo, embedding })
                });
            };

            // ล้างตัวอย่างลบทั้งหมดของพาร์ทหนึ่ง ๆ — ใช้ตอนเคลียร์ของที่กดพลาดไปแล้วในอดีต (ก่อนมีปุ่มเลิกทำ)
            const clearNegativeExamples = async (partNo) => {
                setNegatives(prev => { const n = { ...prev }; delete n[partNo]; return n; });
                if (!apiUrl) return;
                await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "clear_negative_examples", partNo })
                });
            };

            return {
                embeddings, embLoaded, negatives, visualBusy, visualMsg, indexProg,
                queryPreview, setQueryPreview, queryFile, queryEmbedding, visualResults, setVisualResults,
                buildIndex, handleQueryImage, rejectMatch, undoRejectMatch, clearNegativeExamples
            };
        };

        // ===== รูปประจำ Part (เก็บใน Google Drive) — แยกออกมาเป็นฟังก์ชันเดี่ยว ใช้ร่วมกันได้ทุกหน้าที่โชว์รูปพาร์ท =====
        // partImages: partNo -> [{ fileId, url, updatedAt, user }] — พาร์ทเดียวกันอัปได้หลายรูป/หลายมุม รูปแรกในลิสต์ = รูปปก
        const usePartImageManager = (apiUrl, partImages = {}, setPartImages, currentUser) => {
            const imgFileRef = useRef(null);
            const uploadTargetPart = useRef("");
            const [uploadingPart, setUploadingPart] = useState("");
            const [localPreviews, setLocalPreviews] = useState({}); // fileId -> dataURL (โชว์ทันทีหลังอัป ระหว่างรอ Drive สร้าง thumbnail)
            const [lightbox, setLightbox] = useState(null);          // { partNo, fileId, src }
            const [namePopup, setNamePopup] = useState(null);        // { partNo, name } เมนูเด้งตอนกดชื่อพาร์ท

            const resizeToJpeg = (file, maxDim = 1280, quality = 0.82) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onerror = () => reject(new Error("อ่านไฟล์รูปไม่สำเร็จ"));
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onerror = () => reject(new Error("ไฟล์รูปเสียหายหรือเปิดไม่ได้"));
                        img.onload = () => {
                            let w = img.width, h = img.height;
                            if (w > maxDim || h > maxDim) {
                                const ratio = Math.min(maxDim / w, maxDim / h);
                                w = Math.round(w * ratio); h = Math.round(h * ratio);
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = w; canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); // กันพื้นโปร่งใสกลายเป็นดำตอนแปลงเป็น JPEG
                            ctx.drawImage(img, 0, 0, w, h);
                            const dataUrl = canvas.toDataURL('image/jpeg', quality);
                            resolve({ dataUrl, base64: dataUrl.split(',')[1] });
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const pickImageFor = (partNo, useCamera = false) => {
                if (!partNo) return;
                if (!apiUrl) return alert("กรุณาตั้งค่า API URL ก่อนอัปโหลดรูป");
                if (!imgFileRef.current) return;
                uploadTargetPart.current = partNo;
                // useCamera = true → เปิดกล้องหลังของมือถือเลย (เดสก์ท็อปจะ fallback เป็นเลือกไฟล์)
                if (useCamera) imgFileRef.current.setAttribute('capture', 'environment');
                else imgFileRef.current.removeAttribute('capture');
                imgFileRef.current.click();
            };

            // สร้าง embedding ของรูปที่เพิ่งอัปให้อัตโนมัติแล้วบันทึกขึ้น cloud เบื้องหลัง
            // ไม่ await จากตัวเรียก และไม่โยน error ออกไป กันไม่ให้ค้าง/รบกวน flow อัปโหลดรูปหลัก
            const autoIndexUpload = async (partNo, fileId, dataUrl) => {
                if (!apiUrl) return;
                try {
                    const model = await loadVisionModel();
                    const img = await dataUrlToImageEl(dataUrl);
                    const vec = await embedImageEl(model, img);
                    // อ่านตัวหนังสือ/label บนพาร์ทเก็บไว้เทียบด้วย — "·" = อ่านแล้วแต่ไม่มีตัวหนังสือ (กันไม่ให้ถูกจับมาประมวลผลซ้ำ)
                    const ocrText = (await ocrImageB64(apiUrl, dataUrl.split(',')[1])) || "·";
                    await fetch(apiUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "save_embeddings", items: [{ partNo, fileId, embedding: embToB64(vec), ocrText }] })
                    });
                } catch (err) {
                    console.log("auto-index (background) failed", partNo, fileId, err);
                }
            };

            // อัปโหลดรูปเดี่ยว ๆ ให้พาร์ทหนึ่ง ๆ: resize -> upload -> เพิ่มเข้า partImages -> สร้างดัชนีอัตโนมัติเบื้องหลัง
            // แยกออกมาต่างหากเพื่อให้เรียกใช้ตรง ๆ ได้ (เช่น ตอนยืนยันผลค้นหาด้วยรูปว่าใช่พาร์ทนี้) ไม่ต้องผ่าน input ไฟล์เสมอไป
            const uploadOneImage = async (partNo, file) => {
                const { dataUrl, base64 } = await resizeToJpeg(file);
                const res = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "upload_part_image", partNo, imageData: base64, mimeType: "image/jpeg", user: currentUser?.name || "-" })
                });
                const json = await res.json();
                if (json.status !== "success" || !json.fileId) throw new Error(json.message || "อัปโหลดไม่สำเร็จ");

                setLocalPreviews(prev => ({ ...prev, [json.fileId]: dataUrl })); // โชว์ทันทีระหว่างรอ Drive สร้าง thumbnail
                if (setPartImages) {
                    setPartImages(prev => ({
                        ...prev,
                        [partNo]: [...(prev[partNo] || []), { fileId: json.fileId, url: json.url, updatedAt: new Date().toISOString(), user: currentUser?.name || "-" }]
                    }));
                }
                autoIndexUpload(partNo, json.fileId, dataUrl); // สร้างดัชนีให้เองเบื้องหลัง ไม่ต้องรอ ไม่บล็อก UI
                return json;
            };

            // รองรับเลือกได้หลายไฟล์พร้อมกัน (จากคลังรูป) — อัปทีละไฟล์ ไฟล์ไหนพังก็ข้ามไปไฟล์ถัดไป
            const handleImageFile = async (e) => {
                const files = Array.from(e.target.files || []);
                const partNo = uploadTargetPart.current;
                e.target.value = "";
                if (!files.length || !partNo) return;
                const imageFiles = files.filter(f => f.type.startsWith('image/'));
                if (!imageFiles.length) return alert("กรุณาเลือกไฟล์รูปภาพ");

                setUploadingPart(partNo);
                try {
                    for (const file of imageFiles) {
                        try { await uploadOneImage(partNo, file); }
                        catch (err) { alert(`อัปโหลดรูปไม่สำเร็จ (${file.name}): ` + err.message); }
                    }
                } finally {
                    setUploadingPart("");
                }
            };

            const handleDeleteImage = async (partNo, fileId) => {
                if (!confirm(`ลบรูปนี้ของ ${partNo}?`)) return;
                const backupImages = { ...partImages };
                if (setPartImages) {
                    setPartImages(prev => ({ ...prev, [partNo]: (prev[partNo] || []).filter(img => img.fileId !== fileId) }));
                }
                setLocalPreviews(prev => { const n = { ...prev }; delete n[fileId]; return n; });
                if (!apiUrl) return;
                try {
                    const res = await fetch(apiUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "delete_part_image", partNo, fileId })
                    });
                    const json = await res.json();
                    if (json.status !== "success") throw new Error(json.message || "ลบไม่สำเร็จ");
                } catch (err) {
                    // rollback ถ้าฝั่ง server ลบไม่สำเร็จ กันข้อมูลไม่ตรงกัน
                    if (setPartImages) setPartImages(backupImages);
                    alert("ลบรูปภาพไม่สำเร็จ: " + err.message);
                }
            };

            const imagesFor = (partNo) => partImages[partNo] || [];

            // หา src ของรูปเดี่ยว ๆ ตาม fileId (รูปที่เพิ่งอัป > รูปจาก Drive)
            const imgSrcForFile = (fileId, size = 400) => {
                if (!fileId) return "";
                if (localPreviews[fileId]) return localPreviews[fileId];
                return driveThumb(fileId, size);
            };

            // src ของรูปปก (รูปแรก) ของพาร์ท ใช้โชว์เป็น thumbnail ในตาราง/ผลค้นหา
            const imgSrcFor = (partNo, size = 400) => imgSrcForFile(imagesFor(partNo)[0]?.fileId, size);
            const coverFileId = (partNo) => imagesFor(partNo)[0]?.fileId || "";

            return {
                imgFileRef, uploadingPart, lightbox, setLightbox, namePopup, setNamePopup,
                pickImageFor, handleImageFile, handleDeleteImage, uploadOneImage,
                imagesFor, imgSrcFor, imgSrcForFile, coverFileId
            };
        };

        // Modal คู่กัน: lightbox ดูรูปเต็มจอ + popup จัดการรูปตอนกดชื่อพาร์ท (ใช้ร่วมกับ usePartImageManager)
        const ImagePreviewModals = ({ imgFileRef, onFileChange, lightbox, setLightbox, namePopup, setNamePopup, imagesFor, imgSrcForFile, pickImageFor, handleDeleteImage }) => {
            const popImages = namePopup ? imagesFor(namePopup.partNo) : [];
            return (
                <>
                    <input type="file" ref={imgFileRef} onChange={onFileChange} className="hidden" accept="image/*" multiple />

                    {lightbox && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-overlay" onClick={() => setLightbox(null)}>
                            <div className="relative max-w-3xl w-full" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center text-white mb-2">
                                    <span className="font-mono font-bold">{lightbox.partNo}</span>
                                    <div className="flex gap-3 items-center">
                                        <button onClick={() => { const p = lightbox.partNo, fid = lightbox.fileId; setLightbox(null); handleDeleteImage(p, fid); }} className="text-sm hover:text-red-400"><i className="fa-solid fa-trash-can mr-1"></i>ลบรูปนี้</button>
                                        <button onClick={() => setLightbox(null)} className="text-2xl hover:text-slate-300"><Icons.X/></button>
                                    </div>
                                </div>
                                <img src={lightbox.src} alt={lightbox.partNo} className="w-full max-h-[80vh] object-contain rounded-lg bg-white" />
                            </div>
                        </div>
                    )}

                    {namePopup && (
                        <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-4 modal-overlay" onClick={() => setNamePopup(null)}>
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-5 animate-fade-in" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-start mb-1">
                                    <div className="min-w-0">
                                        <div className="font-mono font-bold text-blue-600 truncate">{namePopup.partNo}</div>
                                        <div className="text-sm text-slate-500 truncate">{namePopup.name}</div>
                                    </div>
                                    <button onClick={() => setNamePopup(null)} className="text-slate-400 hover:text-slate-600 text-xl ml-2"><Icons.X/></button>
                                </div>

                                {popImages.length > 0 ? (
                                    <div className="grid grid-cols-4 gap-2 my-3">
                                        {popImages.map((img, i) => (
                                            <div key={img.fileId || i} className="relative group">
                                                <img src={imgSrcForFile(img.fileId, 400)} alt=""
                                                    onClick={() => setLightbox({ partNo: namePopup.partNo, fileId: img.fileId, src: imgSrcForFile(img.fileId, 1600) })}
                                                    className="w-full h-16 object-cover rounded-lg border cursor-zoom-in" />
                                                <button onClick={() => handleDeleteImage(namePopup.partNo, img.fileId)} title="ลบรูปนี้"
                                                    className="absolute -top-1.5 -right-1.5 bg-red-600 text-white rounded-full w-5 h-5 text-[9px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i className="fa-solid fa-xmark"></i></button>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center text-xs text-slate-400 py-4">ยังไม่มีรูป</div>
                                )}

                                <div className="grid grid-cols-2 gap-2 mt-1">
                                    <button onClick={() => { const p = namePopup.partNo; setNamePopup(null); pickImageFor(p, true); }}
                                        className="col-span-2 bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-camera"></i> ถ่ายรูปเพิ่ม
                                    </button>
                                    <button onClick={() => { const p = namePopup.partNo; setNamePopup(null); pickImageFor(p, false); }}
                                        className="col-span-2 bg-slate-100 text-slate-700 py-2.5 rounded-xl font-bold hover:bg-slate-200 flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-image"></i> เลือกจากเครื่อง (เลือกได้หลายรูป)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        const AdvancedMRPView = ({ inventory, addTransaction, bomData, setBomData, apiUrl, partImages = {}, setPartImages, currentUser }) => {
            const [step, setStep] = useState(1);
            const [mode, setMode] = useState('plan'); 
            const [sheetNames, setSheetNames] = useState(Object.keys(bomData) || []);
            const [currentPreviewSheet, setCurrentPreviewSheet] = useState(sheetNames[0] || "");
            
            const [pNoCol, setPNoCol] = useState(2);
            const [qtyCol, setQtyCol] = useState(4);
            const [lvlCol, setLvlCol] = useState(0);
            const [typeCol, setTypeCol] = useState(6);
            const [nameCol, setNameCol] = useState(3);
            
            const [bomColWidths, setBomColWidths] = useState({});

            const [orderText, setOrderText] = useState("");
            const [matchCandidates, setMatchCandidates] = useState([]);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            
            const [finalSummary, setFinalSummary] = useState(null); 
            const [finalTree, setFinalTree] = useState(null);       
            const [resultViewMode, setResultViewMode] = useState('tree'); 
            const [breakdownItem, setBreakdownItem] = useState(null); 
            
            const [isLoading, setIsLoading] = useState(false);
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'ascending' });
            const [compareList, setCompareList] = useState(["", ""]);
            const [compResult, setCompResult] = useState(null);

            const {
                imgFileRef, uploadingPart, lightbox, setLightbox, namePopup, setNamePopup,
                pickImageFor, handleImageFile, handleDeleteImage,
                imagesFor, imgSrcFor, imgSrcForFile, coverFileId
            } = usePartImageManager(apiUrl, partImages, setPartImages, currentUser);

            const getSimilarity = (s1, s2) => {
                s1 = String(s1 || "").toLowerCase().trim(); 
                s2 = String(s2 || "").toLowerCase().trim();
                
                if (s1 === s2) return 1.0; 
                if (s1.includes(s2) || s2.includes(s1)) return 0.9; 

                const len1 = s1.length;
                const len2 = s2.length;
                const maxLen = Math.max(len1, len2);
                if (maxLen === 0) return 1.0;

                const track = Array(len2 + 1).fill(null).map(() => Array(len1 + 1).fill(null));

                for (let i = 0; i <= len1; i++) track[0][i] = i;
                for (let j = 0; j <= len2; j++) track[j][0] = j;

                for (let j = 1; j <= len2; j++) {
                    for (let i = 1; i <= len1; i++) {
                        const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
                        track[j][i] = Math.min(
                            track[j][i - 1] + 1, 
                            track[j - 1][i] + 1, 
                            track[j - 1][i - 1] + indicator 
                        );
                    }
                }
                
                const distance = track[len2][len1];
                return 1 - (distance / maxLen);
            };

            const handleCloudLoad = async () => {
                if (!apiUrl) return alert("กรุณาตั้งค่า URL ก่อน");
                setIsLoading(true);
                try {
                    const res = await fetch(apiUrl + "?action=getBOM&t=" + Date.now());
                    const json = await res.json();
                    const data = json.data || json;
                    const names = Object.keys(data).filter(k => k !== 'version');
                    setBomData(data);
                    setSheetNames(names);
                    setCurrentPreviewSheet(names[0]);
                    alert("ดึงข้อมูล BOM สำเร็จ");
                } catch(e) { alert("โหลดข้อมูลไม่สำเร็จ (CORS/Deploy Error): " + e.message); }
                finally { setIsLoading(false); }
            };

            const handlePreCalculate = () => {
                const lines = orderText.split('\n').filter(l => l.trim() !== "");
                const parsedOrders = lines.map(l => {
                    const parts = l.trim().split(/[\s\t,]+/);
                    if (parts.length < 2) return null;
                    return { model: parts[0], qty: parseFloat(parts[parts.length-1]) };
                }).filter(o => o && !isNaN(o.qty));

                if (parsedOrders.length === 0) return alert("กรุณากรอก Order เช่น 'ModelA 100'");

                const candidates = parsedOrders.map(order => {
                    let bestMatch = ""; let maxScore = 0;
                    sheetNames.forEach(sheet => {
                        const score = getSimilarity(order.model, sheet);
                        if (score > maxScore) { maxScore = score; bestMatch = sheet; }
                    });
                    return { ...order, matchedSheet: bestMatch, score: maxScore };
                });

                setMatchCandidates(candidates);
                setShowConfirmModal(true);
            };

            const handleCalculateFinal = () => {
                setShowConfirmModal(false);
                const summaryResults = {};
                const treeResults = [];
                
                matchCandidates.forEach(order => {
                    if (!order.matchedSheet) return;

                    treeResults.push({
                        type: 'JOB_HEADER',
                        partNo: order.matchedSheet, 
                        name: `Production Job: ${order.qty} Unit(s)`,
                        reqQty: order.qty,
                        level: 0,
                        isHeader: true
                    });

                    const sheetRows = bomData[order.matchedSheet];

                    sheetRows.forEach((row, idx) => {
                        if (idx === 0) return; 
                        
                        const pNo = String(row[pNoCol] || "").trim();
                        const qpu = parseFloat(row[qtyCol]) || 0; 
                        const lvl = parseFloat(row[lvlCol]); 
                        const name = row[nameCol] || "";
                        const type = row[typeCol] || "-";

                        // ข้ามบรรทัดที่ไม่มี Part No หรือ Part No ซ้ำกับชื่อ Model ตัวมันเอง (ป้องกันลูปคำนวณซ้ำ)
                        if (!pNo || pNo === order.matchedSheet) return;

                        const totalReq = qpu * order.qty;

                        if (!summaryResults[pNo]) {
                            summaryResults[pNo] = { 
                                partNo: pNo, name: name, level: lvl, type: type, reqQty: 0, breakdown: []
                            };
                        }
                        summaryResults[pNo].reqQty += totalReq;
                        
                        summaryResults[pNo].breakdown.push({ model: order.matchedSheet, qty: totalReq });

                        const stock = inventory.find(i => i.partNo === pNo);
                        const onHand = stock ? stock.qty : 0;

                        treeResults.push({
                            partNo: pNo,
                            name: name,
                            level: lvl, 
                            type: type,
                            reqQty: totalReq,
                            qpu: qpu,
                            onHand: onHand,
                            diff: onHand - totalReq, 
                            parentModel: order.matchedSheet 
                        });
                    });
                });

                const finalSum = Object.values(summaryResults).map(item => {
                    const stock = inventory.find(i => i.partNo === item.partNo);
                    const onHand = stock ? stock.qty : 0;
                    return { ...item, onHand, diff: onHand - item.reqQty };
                });

                setFinalSummary(finalSum);
                setFinalTree(treeResults);
                setStep(3);
                setResultViewMode('tree'); 
            };

            const handleCompare = () => {
                const validModels = compareList.filter(m => m !== ""); 
                if (validModels.length < 2) return alert("กรุณาเลือกอย่างน้อย 2 รุ่น");
                
                const allParts = new Set();
                const modelMaps = validModels.map(m => {
                    const map = {};
                    const rows = bomData[m] || [];
                    rows.slice(1).forEach(r => {
                        const pNo = String(r[pNoCol]||"").trim();
                        if(pNo) {
                            map[pNo] = { qty: parseFloat(r[qtyCol]||0), name: r[nameCol] };
                            allParts.add(pNo);
                        }
                    });
                    return map;
                });

                const rows = Array.from(allParts).map(pNo => {
                    const qs = modelMaps.map(map => map[pNo]?.qty || 0);
                    const name = modelMaps.find(map => map[pNo]?.name)?.[pNo]?.name || "";
                    const isDiff = qs.some(q => q !== qs[0]);
                    return { partNo: pNo, name, quantities: qs, status: isDiff ? 'Diff' : 'Same' };
                });
                
                setCompResult({ models: validModels, rows });
            };

            // --- Export: BOM Compare ---
            const exportCompareExcel = () => {
                if (!compResult) return;
                const data = compResult.rows.map(r => {
                    const o = { "Part No": r.partNo, "Name": r.name };
                    compResult.models.forEach((m, i) => { o[m] = r.quantities[i]; });
                    o["Status"] = r.status;
                    o["รูป (ลิงก์)"] = driveViewLink(partImages, r.partNo);
                    return o;
                });
                exportToExcel(data, "BOM_Compare", "Compare");
            };
            const exportComparePDF = () => {
                if (!compResult) return;
                const headers = ["รูป", "Part No", "Name", ...compResult.models, "Status"];
                const rows = compResult.rows.map(r => {
                    const fid = partFileId(partImages, r.partNo);
                    return [fid ? { imgId: fid } : "", r.partNo, r.name, ...r.quantities.map(q => formatNum(q)), r.status];
                });
                exportTableToPDF("BOM Compare: " + compResult.models.join(" vs "), headers, rows);
            };

            const requestSort = (key) => {
                let direction = 'ascending';
                if (sortConfig.key === key && sortConfig.direction === 'ascending') {
                    direction = 'descending';
                }
                setSortConfig({ key, direction });
            };

            const sortedSummary = useMemo(() => {
                if (!finalSummary) return null;
                let sortableItems = [...finalSummary];
                if (sortConfig.key !== null) {
                    sortableItems.sort((a, b) => {
                        let aValue = a[sortConfig.key];
                        let bValue = b[sortConfig.key];
                        const aNum = parseFloat(aValue);
                        const bNum = parseFloat(bValue);
                        if (!isNaN(aNum) && !isNaN(bNum)) { aValue = aNum; bValue = bNum; } 
                        else { aValue = String(aValue).toLowerCase(); bValue = String(bValue).toLowerCase(); }
                        if (aValue < bValue) return sortConfig.direction === 'ascending' ? -1 : 1;
                        if (aValue > bValue) return sortConfig.direction === 'ascending' ? 1 : -1;
                        return 0;
                    });
                }
                return sortableItems;
            }, [finalSummary, sortConfig]);

            return (
                <div className="animate-fade-in space-y-6">
                    <ImagePreviewModals imgFileRef={imgFileRef} onFileChange={handleImageFile}
                        lightbox={lightbox} setLightbox={setLightbox} namePopup={namePopup} setNamePopup={setNamePopup}
                        imagesFor={imagesFor} imgSrcForFile={imgSrcForFile} pickImageFor={pickImageFor} handleDeleteImage={handleDeleteImage} />

                    <div className="flex bg-white p-2 rounded-xl shadow-sm border mb-6">
                        {['1. Setup BOM', '2. Functions', '3. Result'].map((t, i) => (
                            <button key={i} onClick={() => setStep(i+1)} className={`flex-1 py-2 text-sm font-bold rounded-lg ${step === i+1 ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>{t}</button>
                        ))}
                    </div>

                    {step === 1 && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="font-bold">BOM Configuration</h3>
                                <button onClick={handleCloudLoad} disabled={isLoading} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2">
                                    {isLoading ? <div className="loader"/> : <Icons.Cloud/>} Sync Cloud BOM
                                </button>
                            </div>
                            
                            {sheetNames.length > 0 ? (
                                <>
                                    <div className="flex gap-2 overflow-x-auto pb-4 mb-4">
                                        {sheetNames.map(n => <button key={n} onClick={()=>setCurrentPreviewSheet(n)} className={`px-3 py-1 rounded-full text-xs whitespace-nowrap border ${currentPreviewSheet===n?'bg-slate-800 text-white':'bg-white'}`}>{n}</button>)}
                                    </div>
                                    
                                    <div className="overflow-x-auto border rounded-xl h-96 text-xs">
                                        <table className="w-max border-collapse">
                                            <thead className="bg-white sticky top-0 z-10 shadow-sm">
                                                <tr>
                                                    <th className="p-2 border-b border-r bg-slate-50 text-center w-10">#</th>
                                                    <th className="p-2 border-b border-r bg-slate-50 text-center w-16">รูป</th>
                                                    {bomData[currentPreviewSheet]?.[0]?.map((h, i) => (

                                                            <div className="flex flex-col gap-2">
                                                                <div className="grid grid-cols-3 gap-1">
                                                                    <button onClick={()=>setPNoCol(i)} className={`px-1 py-0.5 border rounded text-[9px] font-bold ${i===pNoCol?'bg-blue-600 text-white':'bg-slate-50 text-slate-400 hover:bg-slate-100'}`}>P#</button>
                                                                    <button onClick={()=>setNameCol(i)} className={`px-1 py-0.5 border rounded text-[9px] font-bold ${i===nameCol?'bg-emerald-500 text-white':'bg-slate-50 text-slate-400 hover:bg-slate-100'}`}>Name</button>
