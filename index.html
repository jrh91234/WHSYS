            const [filterDiff, setFilterDiff] = useState('all');
            const [suggestions, setSuggestions] = useState([]);
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [selectedSugIdx, setSelectedSugIdx] = useState(-1);
            const [ocrProcessing, setOcrProcessing] = useState(false);
            const [ocrProgress, setOcrProgress] = useState(0);
            const [ocrResults, setOcrResults] = useState(null);
            const [showOcrModal, setShowOcrModal] = useState(false);
            const inputRef = useRef(null);
            const ocrFileRef = useRef(null);
            const suggestionsRef = useRef(null);

            useEffect(() => {
                if (inputRef.current) inputRef.current.focus();
            }, []);

            const allKnownParts = useMemo(() => {
                const parts = new Map();
                inventory.forEach(item => {
                    const pNo = String(item.partNo || "").trim().toUpperCase();
                    if (pNo) parts.set(pNo, { partNo: item.partNo, name: item.name || "", source: 'INV' });
                });
                if (bomData) {
                    Object.keys(bomData).forEach(sheet => {
                        const rows = bomData[sheet];
                        if (!rows) return;
                        rows.slice(1).forEach(row => {
                            const pNo = String(row[2] || "").trim().toUpperCase();
                            const name = String(row[3] || "").trim();
                            if (pNo && !parts.has(pNo)) {
                                parts.set(pNo, { partNo: row[2], name, source: 'BOM' });
                            }
                        });
                    });
                }
                return Array.from(parts.values());
            }, [inventory, bomData]);

            const fuzzyMatch = (query, target) => {
                query = String(query || "").toLowerCase();
                target = String(target || "").toLowerCase();
                if (!query) return 0;
                if (target === query) return 1.0;
                if (target.includes(query)) return 0.9;
                if (query.length <= 2) return target.startsWith(query) ? 0.8 : 0;
                let qi = 0;
                for (let ti = 0; ti < target.length && qi < query.length; ti++) {
                    if (target[ti] === query[qi]) qi++;
                }
                return qi === query.length ? 0.5 + (0.3 * query.length / target.length) : 0;
            };

            const handleInputChange = (val) => {
                setInputPartNo(val);
                setSelectedSugIdx(-1);
                const q = val.trim().toUpperCase();
                if (q.length < 1) { setSuggestions([]); setShowSuggestions(false); return; }

                const scored = allKnownParts.map(p => {
                    const pNoScore = fuzzyMatch(q, p.partNo);
                    const nameScore = fuzzyMatch(q, p.name) * 0.7;
                    return { ...p, score: Math.max(pNoScore, nameScore) };
                }).filter(p => p.score > 0.3).sort((a, b) => b.score - a.score).slice(0, 8);

                setSuggestions(scored);
                setShowSuggestions(scored.length > 0);
            };

            const handleSelectSuggestion = (partNo) => {
                setInputPartNo(partNo);
                setShowSuggestions(false);
                setSuggestions([]);
                if (inputRef.current) inputRef.current.focus();
            };

            const handleInputKeyDown = (e) => {
                if (showSuggestions && suggestions.length > 0) {
                    if (e.key === 'ArrowDown') { e.preventDefault(); setSelectedSugIdx(prev => Math.min(prev + 1, suggestions.length - 1)); return; }
                    if (e.key === 'ArrowUp') { e.preventDefault(); setSelectedSugIdx(prev => Math.max(prev - 1, -1)); return; }
                    if (e.key === 'Tab' && selectedSugIdx >= 0) { e.preventDefault(); handleSelectSuggestion(suggestions[selectedSugIdx].partNo); return; }
                    if (e.key === 'Enter' && selectedSugIdx >= 0) { e.preventDefault(); handleSelectSuggestion(suggestions[selectedSugIdx].partNo); return; }
                    if (e.key === 'Escape') { setShowSuggestions(false); return; }
                }
                if (e.key === 'Enter') handleAdd();
            };

            const handleAdd = (partNoOverride, qtyOverride) => {
                const pNo = (partNoOverride || inputPartNo).trim().toUpperCase();
                if (!pNo) return;
                const qty = parseFloat(qtyOverride || inputQty) || 1;

                setCountItems(prev => {
                    const existing = prev.find(i => i.partNo === pNo);
                    if (existing) {
                        return prev.map(i => i.partNo === pNo ? { ...i, counted: i.counted + qty } : i);
                    }
                    const invItem = inventory.find(i => String(i.partNo).toUpperCase() === pNo);
                    const bomPart = allKnownParts.find(p => String(p.partNo).toUpperCase() === pNo);
                    const name = invItem ? invItem.name : (bomPart ? bomPart.name : "(ไม่พบในระบบ)");
                    return [...prev, {
                        partNo: pNo,
                        name: name,
                        systemQty: invItem ? (parseFloat(invItem.qty) || 0) : 0,
                        counted: qty,
                        inSystem: !!invItem
                    }];
                });

                setInputPartNo("");
                setInputQty(1);
                setShowSuggestions(false);
                if (inputRef.current) inputRef.current.focus();
            };

            const handleRemoveItem = (partNo) => {
                setCountItems(prev => prev.filter(i => i.partNo !== partNo));
            };

            const handleEditCounted = (partNo, newQty) => {
                setCountItems(prev => prev.map(i => i.partNo === partNo ? { ...i, counted: parseFloat(newQty) || 0 } : i));
            };

            const handleClearAll = () => {
                if (countItems.length === 0) return;
                if (!confirm("ล้างรายการนับทั้งหมด?")) return;
                setCountItems([]);
                setShowSummary(false);
            };

            const handleApplyAdjust = async () => {
                const itemsToAdjust = countItems.filter(i => i.counted !== i.systemQty);
                if (itemsToAdjust.length === 0) { alert("ไม่มีรายการที่ต้อง Adjust"); return; }

                let updatedInv = [...inventory];
                itemsToAdjust.forEach(item => {
                    const idx = updatedInv.findIndex(i => String(i.partNo).toUpperCase() === item.partNo);
                    if (idx >= 0) {
                        updatedInv[idx] = { ...updatedInv[idx], qty: item.counted };
                    } else {
                        updatedInv.push({ partNo: item.partNo, name: item.name, qty: item.counted, location: '-', unit: 'PCS', minStock: 0 });
                    }
                });
                setInventory(updatedInv);

                if (apiUrl) {
                    fetch(apiUrl, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({
                            action: "bulk_stock_count",
                            items: itemsToAdjust.map(i => ({ partNo: i.partNo, name: i.name, counted: i.counted, systemQty: i.systemQty })),
                            countName: countName,
                            user: currentUser.name
                        })
                    });
                }

                alert(`ปรับสต๊อกเรียบร้อย ${itemsToAdjust.length} รายการ`);
                setShowConfirm(false);
                setCountItems([]);
                setShowSummary(false);
            };

            const handleExport = () => {
                const data = countItems.map(i => ({
                    PartNo: i.partNo,
                    Name: i.name,
                    SystemQty: i.systemQty,
                    Counted: i.counted,
                    Diff: i.counted - i.systemQty,
                    Status: i.counted === i.systemQty ? 'OK' : i.counted > i.systemQty ? 'Over' : 'Short'
                }));
                exportToExcel(data, `StockCount_${countName}`, "StockCount");
            };

            // --- OCR ---
            const ocrFuzzyMatchPart = (rawText) => {
                const cleaned = rawText.replace(/[^a-zA-Z0-9\-_.\/\s]/g, '').trim().toUpperCase();
                if (!cleaned) return null;

                const tokens = cleaned.split(/\s+/);
                let bestMatch = null;
                let bestScore = 0;

                for (const token of tokens) {
                    if (token.length < 2 || /^\d+$/.test(token)) continue;
                    for (const part of allKnownParts) {
                        const pNo = String(part.partNo).toUpperCase();
                        let score = 0;
                        if (pNo === token) { score = 1.0; }
                        else if (pNo.includes(token) || token.includes(pNo)) { score = 0.85; }
                        else {
                            const len1 = token.length, len2 = pNo.length, maxLen = Math.max(len1, len2);
                            if (maxLen === 0) continue;
                            const track = Array(len2 + 1).fill(null).map(() => Array(len1 + 1).fill(null));
                            for (let i = 0; i <= len1; i++) track[0][i] = i;
                            for (let j = 0; j <= len2; j++) track[j][0] = j;
                            for (let j = 1; j <= len2; j++) {
                                for (let i = 1; i <= len1; i++) {
                                    const ind = token[i-1] === pNo[j-1] ? 0 : 1;
                                    track[j][i] = Math.min(track[j][i-1]+1, track[j-1][i]+1, track[j-1][i-1]+ind);
                                }
                            }
                            score = 1 - (track[len2][len1] / maxLen);
                        }
                        if (score > bestScore && score >= 0.55) { bestScore = score; bestMatch = { ...part, score, ocrRaw: token }; }
                    }
                }
                return bestMatch;
            };

            const extractQtyFromLine = (line, matchedPartNo) => {
                let remaining = line;
                if (matchedPartNo) {
                    const idx = remaining.toUpperCase().indexOf(matchedPartNo.toUpperCase());
                    if (idx >= 0) remaining = remaining.substring(idx + matchedPartNo.length);
                }
                const nums = remaining.match(/\b(\d{1,5})\b/g);
                if (!nums) return 1;
                const candidates = nums.map(n => parseInt(n, 10)).filter(n => n > 0 && n <= 99999);
                return candidates.length > 0 ? candidates[0] : 1;
            };

            const resizeImage = (file, maxDim = 1600) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            let w = img.width, h = img.height;
                            if (w > maxDim || h > maxDim) {
                                const ratio = Math.min(maxDim / w, maxDim / h);
                                w = Math.round(w * ratio);
                                h = Math.round(h * ratio);
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = w; canvas.height = h;
                            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                            const dataUrl = canvas.toDataURL('image/png', 0.9);
                            resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/png' });
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const readFileAsBase64 = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (ev) => resolve(ev.target.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
            };

            const handleOcrUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                e.target.value = "";

                if (!apiUrl) { alert("กรุณาตั้งค่า API URL ก่อนใช้ OCR"); return; }

                setOcrProcessing(true);
                setOcrProgress(0);
                setOcrResults(null);
                setShowOcrModal(true);

                try {
                    setOcrProgress(20);
                    const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
                    let base64, mimeType;

                    if (isPdf) {
                        base64 = await readFileAsBase64(file);
                        mimeType = 'application/pdf';
                    } else {
                        const resized = await resizeImage(file);
                        base64 = resized.base64;
                        mimeType = resized.mimeType;
                    }

                    setOcrProgress(40);
                    const res = await fetch(apiUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "ocr_image", imageData: base64, mimeType })
                    });

                    setOcrProgress(80);
                    const json = await res.json();

                    if (json.status !== "success" || !json.text) {
                        throw new Error(json.message || "OCR ไม่สำเร็จ - ตรวจสอบว่าเปิด Drive API ใน Apps Script แล้ว");
                    }

                    setOcrProgress(90);
                    const lines = json.text.split('\n').filter(l => l.trim().length > 2);
                    const results = [];

                    for (const line of lines) {
                        const matched = ocrFuzzyMatchPart(line);
                        if (matched) {
                            const qty = extractQtyFromLine(line, matched.partNo);
                            const existing = results.find(r => r.partNo === matched.partNo);
                            if (existing) { existing.qty += qty; }
                            else {
                                results.push({
                                    partNo: matched.partNo,
                                    name: matched.name,
                                    qty: qty,
                                    confidence: matched.score,
                                    ocrRaw: matched.ocrRaw,
                                    ocrLine: line.trim(),
                                    selected: true
                                });
                            }
                        }
                    }

                    setOcrProgress(100);
                    setOcrResults({ rawText: json.text, items: results, totalLines: lines.length });
                } catch (err) {
                    alert("OCR Error: " + err.message);
                    setShowOcrModal(false);
                } finally {
                    setOcrProcessing(false);
                }
            };

            const handleOcrConfirm = () => {
                if (!ocrResults) return;
                const selected = ocrResults.items.filter(i => i.selected);
                selected.forEach(item => { handleAdd(item.partNo, item.qty); });
                setShowOcrModal(false);
                setOcrResults(null);
            };

            const toggleOcrItem = (idx) => {
                setOcrResults(prev => ({
                    ...prev,
                    items: prev.items.map((item, i) => i === idx ? { ...item, selected: !item.selected } : item)
                }));
            };

            const editOcrQty = (idx, newQty) => {
                setOcrResults(prev => ({
                    ...prev,
                    items: prev.items.map((item, i) => i === idx ? { ...item, qty: parseFloat(newQty) || 0 } : item)
                }));
            };

            const editOcrPartNo = (idx, newPartNo) => {
                const q = newPartNo.trim().toUpperCase();
                const exact = allKnownParts.find(p => String(p.partNo).toUpperCase() === q);
                const suggestions = exact ? [] : allKnownParts
                    .map(p => ({ ...p, score: fuzzyMatch(q, p.partNo) }))
                    .filter(p => p.score > 0.3)
                    .sort((a, b) => b.score - a.score)
                    .slice(0, 5);
                setOcrResults(prev => ({
                    ...prev,
                    items: prev.items.map((item, i) => i === idx ? {
                        ...item,
                        partNo: newPartNo,
                        name: exact ? exact.name : item.name,
                        _suggestions: suggestions,
                        _exactMatch: !!exact
                    } : item)
                }));
            };

            const selectOcrSuggestion = (idx, partNo, name) => {
                setOcrResults(prev => ({
                    ...prev,
                    items: prev.items.map((item, i) => i === idx ? {
                        ...item,
                        partNo: partNo,
                        name: name,
                        confidence: 1.0,
                        _suggestions: [],
                        _exactMatch: true
                    } : item)
                }));
            };

            const summaryData = useMemo(() => {
                return countItems.map(i => ({ ...i, diff: i.counted - i.systemQty }));
            }, [countItems]);

            const filteredSummary = useMemo(() => {
                if (filterDiff === 'all') return summaryData;
                if (filterDiff === 'diff') return summaryData.filter(i => i.diff !== 0);
                if (filterDiff === 'ok') return summaryData.filter(i => i.diff === 0);
                return summaryData;
            }, [summaryData, filterDiff]);

            const stats = useMemo(() => {
                const total = countItems.length;
                const matched = countItems.filter(i => i.counted === i.systemQty).length;
                const over = countItems.filter(i => i.counted > i.systemQty).length;
                const short = countItems.filter(i => i.counted < i.systemQty).length;
                return { total, matched, over, short };
            }, [countItems]);

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold flex items-center gap-2"><Icons.Clipboard className="text-indigo-600"/> นับสต๊อก</h2>
                            <p className="text-sm text-slate-400 mt-1">สแกน/พิมพ์ Part No หรืออัปโหลดรูปใบนับสต๊อก (OCR)</p>
                        </div>
                        <div className="flex items-center gap-2">
                            <input value={countName} onChange={e => setCountName(e.target.value)} className="p-2 border rounded-lg text-sm w-40 outline-none focus:ring-2 focus:ring-indigo-100" placeholder="ชื่อรอบนับ" />
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-sm border">
                        <div className="flex flex-col sm:flex-row gap-3">
                            <div className="flex-1 relative">
                                <label className="block text-xs font-bold text-slate-500 mb-1">Part No (สแกน/พิมพ์) <span className="text-indigo-400 font-normal">- พิมพ์เพื่อค้นหาอัตโนมัติ</span></label>
                                <input
                                    ref={inputRef}
                                    type="text"
                                    value={inputPartNo}
                                    onChange={e => handleInputChange(e.target.value)}
                                    onKeyDown={handleInputKeyDown}
                                    onBlur={() => setTimeout(() => setShowSuggestions(false), 200)}
                                    onFocus={() => { if (suggestions.length > 0) setShowSuggestions(true); }}
                                    className="w-full p-3 border-2 border-indigo-200 rounded-xl text-lg font-mono outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500"
                                    placeholder="สแกนบาร์โค้ด หรือพิมพ์รหัส/ชื่อ..."
                                    autoComplete="off"
                                />
                                {showSuggestions && suggestions.length > 0 && (
                                    <div ref={suggestionsRef} className="absolute z-40 left-0 right-0 top-full mt-1 bg-white border-2 border-indigo-200 rounded-xl shadow-2xl overflow-hidden max-h-64 overflow-y-auto">
                                        {suggestions.map((s, i) => (
                                            <button
                                                key={s.partNo}
                                                onMouseDown={(e) => { e.preventDefault(); handleSelectSuggestion(s.partNo); }}
                                                className={`w-full text-left px-4 py-3 flex items-center gap-3 border-b last:border-b-0 transition ${i === selectedSugIdx ? 'bg-indigo-50' : 'hover:bg-slate-50'}`}
                                            >
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-mono font-bold text-blue-700 text-sm">{s.partNo}</div>
                                                    <div className="text-xs text-slate-400 truncate">{s.name}</div>
                                                </div>
                                                <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${s.source === 'INV' ? 'bg-green-100 text-green-600' : 'bg-purple-100 text-purple-600'}`}>
                                                    {s.source === 'INV' ? 'คลัง' : 'BOM'}
                                                </span>
                                                <span className="text-[10px] text-slate-300">{Math.round(s.score * 100)}%</span>
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div className="w-24">
                                <label className="block text-xs font-bold text-slate-500 mb-1">จำนวน</label>
                                <input
                                    type="number"
                                    value={inputQty}
                                    onChange={e => setInputQty(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Enter') handleAdd(); }}
                                    className="w-full p-3 border rounded-xl text-lg text-center outline-none focus:ring-2 focus:ring-indigo-100"
                                    min="1"
                                />
                            </div>
                            <div className="flex items-end gap-2">
                                <button onClick={() => handleAdd()} className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold text-lg hover:bg-indigo-700 shadow-lg flex items-center gap-2 whitespace-nowrap">
                                    <Icons.Plus/> เพิ่ม
                                </button>
                                <input type="file" ref={ocrFileRef} onChange={handleOcrUpload} className="hidden" accept="image/*,.pdf" />
                                <button onClick={() => ocrFileRef.current.click()} className="bg-amber-500 text-white px-4 py-3 rounded-xl font-bold text-lg hover:bg-amber-600 shadow-lg flex items-center gap-2 whitespace-nowrap" title="OCR - อ่านจากรูป/PDF ใบนับสต๊อก">
                                    <i className="fa-solid fa-camera"></i>
                                </button>
                            </div>
                        </div>

                        {countItems.length > 0 && (
                            <div className="mt-4 flex items-center gap-3 text-sm">
                                <span className="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-bold">{stats.total} รายการ</span>
                                <span className="bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold">{stats.matched} ตรง</span>
                                {stats.over > 0 && <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-bold">{stats.over} เกิน</span>}
                                {stats.short > 0 && <span className="bg-red-100 text-red-700 px-3 py-1 rounded-full font-bold">{stats.short} ขาด</span>}
                            </div>
                        )}
                    </div>

                    {countItems.length > 0 && (
                        <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                            <div className="flex flex-col sm:flex-row justify-between items-center gap-3 p-4 border-b bg-slate-50">
                                <div className="flex gap-2">
                                    <button onClick={() => setShowSummary(false)} className={`px-4 py-2 rounded-lg text-sm font-bold ${!showSummary ? 'bg-indigo-600 text-white' : 'bg-white text-slate-500 border'}`}>รายการนับ</button>
                                    <button onClick={() => setShowSummary(true)} className={`px-4 py-2 rounded-lg text-sm font-bold ${showSummary ? 'bg-indigo-600 text-white' : 'bg-white text-slate-500 border'}`}>สรุปเทียบระบบ</button>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={handleExport} className="bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-1"><Icons.Excel/> Export</button>
                                    <button onClick={handleClearAll} className="bg-red-100 text-red-600 px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-1"><Icons.Trash/> ล้าง</button>
                                </div>
                            </div>

                            {!showSummary ? (
                                <div className="overflow-x-auto max-h-[55vh] overflow-y-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-50 sticky top-0 text-slate-500 font-bold border-b">
                                            <tr>
                                                <th className="p-4">#</th>
                                                <th className="p-4">Part No</th>
                                                <th className="p-4">Description</th>
                                                <th className="p-4 text-right">นับได้</th>
                                                <th className="p-4 text-right">ในระบบ</th>
                                                <th className="p-4 text-right">ผลต่าง</th>
                                                <th className="p-4 text-center">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {[...countItems].reverse().map((item, i) => {
                                                const diff = item.counted - item.systemQty;
                                                return (
                                                    <tr key={item.partNo} className={`hover:bg-slate-50 ${diff !== 0 ? 'bg-orange-50/50' : ''}`}>
                                                        <td className="p-4 text-slate-300">{countItems.length - i}</td>
                                                        <td className="p-4 font-mono font-bold text-blue-600">{item.partNo}</td>
                                                        <td className="p-4 text-slate-600">{item.name} {!item.inSystem && <span className="text-[10px] bg-yellow-100 text-yellow-700 px-1.5 py-0.5 rounded ml-1">NEW</span>}</td>
                                                        <td className="p-4 text-right">
                                                            <input type="number" value={item.counted} onChange={e => handleEditCounted(item.partNo, e.target.value)} className="w-20 text-right p-1 border rounded font-bold text-indigo-700 outline-none focus:ring-2 focus:ring-indigo-100" />
                                                        </td>
                                                        <td className="p-4 text-right text-slate-400">{formatNum(item.systemQty)}</td>
                                                        <td className={`p-4 text-right font-bold ${diff > 0 ? 'text-blue-600' : diff < 0 ? 'text-red-600' : 'text-green-600'}`}>
                                                            {diff > 0 ? '+' : ''}{formatNum(diff)}
                                                        </td>
                                                        <td className="p-4 text-center">
                                                            <button onClick={() => handleRemoveItem(item.partNo)} className="text-slate-300 hover:text-red-500"><Icons.Trash/></button>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            ) : (
                                <div>
                                    <div className="flex gap-2 p-4 border-b">
                                        {[['all', 'ทั้งหมด'], ['diff', 'ไม่ตรง'], ['ok', 'ตรง']].map(([val, label]) => (
                                            <button key={val} onClick={() => setFilterDiff(val)} className={`px-3 py-1 rounded-full text-xs font-bold ${filterDiff === val ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}`}>{label}</button>
                                        ))}
                                    </div>
                                    <div className="overflow-x-auto max-h-[50vh] overflow-y-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-slate-50 sticky top-0 text-slate-500 font-bold border-b">
                                                <tr>
                                                    <th className="p-4">Part No</th>
                                                    <th className="p-4">Description</th>
                                                    <th className="p-4 text-right">ในระบบ</th>
                                                    <th className="p-4 text-right">นับได้</th>
                                                    <th className="p-4 text-right">ผลต่าง</th>
                                                    <th className="p-4 text-center">Status</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y">
                                                {filteredSummary.map((item, i) => (
                                                    <tr key={item.partNo} className={`hover:bg-slate-50 ${item.diff !== 0 ? 'bg-orange-50/50' : ''}`}>
                                                        <td className="p-4 font-mono font-bold text-blue-600">{item.partNo}</td>
                                                        <td className="p-4 text-slate-600">{item.name}</td>
                                                        <td className="p-4 text-right text-slate-400">{formatNum(item.systemQty)}</td>
                                                        <td className="p-4 text-right font-bold text-indigo-700">{formatNum(item.counted)}</td>
                                                        <td className={`p-4 text-right font-bold ${item.diff > 0 ? 'text-blue-600' : item.diff < 0 ? 'text-red-600' : 'text-green-600'}`}>
                                                            {item.diff > 0 ? '+' : ''}{formatNum(item.diff)}
                                                        </td>
                                                        <td className="p-4 text-center">
                                                            {item.diff === 0
                                                                ? <span className="text-[10px] bg-green-600 text-white px-2 py-0.5 rounded">OK</span>
                                                                : item.diff > 0
                                                                ? <span className="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded">Over +{formatNum(item.diff)}</span>
                                                                : <span className="text-[10px] bg-red-600 text-white px-2 py-0.5 rounded">Short {formatNum(item.diff)}</span>
                                                            }
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="p-4 border-t bg-slate-50 flex justify-end">
                                        <button onClick={() => setShowConfirm(true)} className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-indigo-700 flex items-center gap-2">
                                            <Icons.Check/> ยืนยันปรับสต๊อกตามผลนับ
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {countItems.length === 0 && (
                        <div className="bg-white rounded-2xl shadow-sm border p-12 text-center">
                            <div className="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4 text-indigo-400 text-3xl"><Icons.Clipboard/></div>
                            <h3 className="text-lg font-bold text-slate-700 mb-2">เริ่มนับสต๊อก</h3>
                            <p className="text-sm text-slate-400 max-w-md mx-auto">
                                สแกนบาร์โค้ดหรือพิมพ์ Part No แล้วกด Enter<br/>
                                ระบบจะรวมจำนวนให้อัตโนมัติหากรหัสซ้ำ
                            </p>
                            <div className="mt-6 flex justify-center">
                                <button onClick={() => ocrFileRef.current.click()} className="bg-amber-500 text-white px-6 py-3 rounded-xl font-bold hover:bg-amber-600 shadow-lg flex items-center gap-2">
                                    <i className="fa-solid fa-camera"></i> อัปโหลดรูป / PDF ใบนับสต๊อก (OCR)
                                </button>
                            </div>
                        </div>
                    )}

                    {showConfirm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 animate-fade-in">
                                <h3 className="text-lg font-bold mb-2 flex items-center gap-2"><Icons.Warn className="text-orange-500"/> ยืนยันปรับสต๊อก</h3>
                                <p className="text-sm text-slate-500 mb-4">ระบบจะปรับสต๊อกในคลังให้ตรงกับยอดนับจริง (เฉพาะรายการที่มีผลต่าง)</p>
                                <div className="bg-slate-50 rounded-xl p-4 mb-4 text-sm space-y-1">
                                    <div className="flex justify-between"><span className="text-slate-500">รอบนับ:</span><span className="font-bold">{countName}</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500">รายการที่จะปรับ:</span><span className="font-bold text-orange-600">{countItems.filter(i => i.counted !== i.systemQty).length} รายการ</span></div>
                                    <div className="flex justify-between"><span className="text-slate-500">ผู้ดำเนินการ:</span><span className="font-bold">{currentUser.name}</span></div>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowConfirm(false)} className="flex-1 py-3 bg-slate-100 text-slate-500 font-bold rounded-xl">ยกเลิก</button>
                                    <button onClick={handleApplyAdjust} className="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-lg hover:bg-indigo-700">ยืนยัน Adjust</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showOcrModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden animate-fade-in flex flex-col">
                                <div className="p-6 border-b bg-amber-50 flex justify-between items-center">
                                    <div>
                                        <h3 className="text-lg font-bold flex items-center gap-2"><i className="fa-solid fa-camera text-amber-600"></i> OCR - อ่านใบนับสต๊อก <span className="text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded-full font-normal">Google Drive OCR</span></h3>
                                        <p className="text-xs text-slate-500 mt-1">รูปภาพ/PDF จะถูกส่งไป Google Drive เพื่อแกะข้อความ แล้วจับคู่กับฐานข้อมูล Inventory/BOM</p>
                                    </div>
                                    <button onClick={() => { setShowOcrModal(false); setOcrResults(null); }} className="text-slate-400 hover:text-slate-600"><Icons.X className="text-xl"/></button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-6">
                                    {ocrProcessing ? (
                                        <div className="text-center py-12">
                                            <div className="loader mx-auto mb-4" style={{width:40,height:40,borderWidth:4}}></div>
                                            <div className="text-lg font-bold text-slate-700 mb-2">กำลังส่งรูปไป Google Drive OCR...</div>
                                            <div className="w-64 mx-auto bg-slate-200 rounded-full h-3 overflow-hidden">
                                                <div className="bg-amber-500 h-full rounded-full transition-all" style={{width: `${ocrProgress}%`}}></div>
                                            </div>
                                            <div className="text-sm text-slate-400 mt-2">{ocrProgress}%</div>
                                        </div>
                                    ) : ocrResults ? (
                                        <div className="space-y-4">
                                            <div className="flex gap-4 text-sm">
                                                <span className="bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-bold">อ่านได้ {ocrResults.totalLines} บรรทัด</span>
                                                <span className="bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold">จับคู่ได้ {ocrResults.items.length} รายการ</span>
                                            </div>

                                            {ocrResults.items.length === 0 ? (
                                                <div className="text-center py-8">
                                                    <div className="text-slate-400 mb-4"><i className="fa-solid fa-circle-exclamation text-4xl"></i></div>
                                                    <div className="font-bold text-slate-600">ไม่สามารถจับคู่ Part No ได้</div>
                                                    <p className="text-sm text-slate-400 mt-2">ลองถ่ายรูปให้ชัดขึ้น, ใช้ไฟล์ PDF scan, หรือเขียนรหัส Part No ให้ชัดเจน</p>
                                                </div>
                                            ) : (
                                                <div className="border rounded-xl overflow-hidden">
                                                    <table className="w-full text-sm text-left">
                                                        <thead className="bg-slate-50 text-slate-500 font-bold border-b">
                                                            <tr>
                                                                <th className="p-3 w-8"><input type="checkbox" checked={ocrResults.items.every(i => i.selected)} onChange={() => setOcrResults(prev => ({ ...prev, items: prev.items.map(i => ({ ...i, selected: !prev.items.every(x => x.selected) })) }))} /></th>
                                                                <th className="p-3 w-8 text-center">#</th>
                                                                <th className="p-3">Part No (เดา)</th>
                                                                <th className="p-3">OCR อ่านได้</th>
                                                                <th className="p-3 text-right">จำนวน</th>
                                                                <th className="p-3 text-center">ความมั่นใจ</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y">
                                                            {ocrResults.items.map((item, idx) => (
                                                                <tr key={idx} className={`hover:bg-slate-50 ${!item.selected ? 'opacity-40' : ''}`}>
                                                                    <td className="p-3"><input type="checkbox" checked={item.selected} onChange={() => toggleOcrItem(idx)} /></td>
                                                                    <td className="p-3 text-center text-slate-400 font-bold">{idx + 1}</td>
                                                                    <td className="p-3 relative">
                                                                        <input type="text" value={item.partNo} onChange={e => editOcrPartNo(idx, e.target.value)} className={`font-mono font-bold bg-blue-50 border rounded px-2 py-1 w-full outline-none focus:ring-2 focus:ring-blue-200 ${item._exactMatch ? 'text-green-700 border-green-300' : 'text-blue-700 border-blue-200'}`} />
                                                                        <div className={`text-[10px] mt-0.5 truncate font-bold ${item._exactMatch ? 'text-green-600' : 'text-slate-400'}`}>
                                                                            {item._exactMatch && <i className="fa-solid fa-check mr-1"></i>}{item.name}
                                                                        </div>
                                                                        {item._suggestions && item._suggestions.length > 0 && (
                                                                            <div className="absolute z-50 left-3 right-3 top-full bg-white border-2 border-blue-200 rounded-lg shadow-xl overflow-hidden max-h-40 overflow-y-auto">
                                                                                {item._suggestions.map((s, si) => (
                                                                                    <button key={si} onMouseDown={e => { e.preventDefault(); selectOcrSuggestion(idx, s.partNo, s.name); }} className="w-full text-left px-3 py-2 flex items-center gap-2 border-b last:border-b-0 hover:bg-blue-50 text-xs">
                                                                                        <span className="font-mono font-bold text-blue-700">{s.partNo}</span>
                                                                                        <span className="text-slate-400 truncate flex-1">{s.name}</span>
                                                                                        <span className="text-slate-300">{Math.round(s.score * 100)}%</span>
                                                                                    </button>
                                                                                ))}
                                                                            </div>
                                                                        )}
                                                                    </td>
                                                                    <td className="p-3">
                                                                        <div className="text-xs text-slate-500 font-mono bg-slate-100 px-2 py-1 rounded truncate" title={item.ocrLine}>{item.ocrLine}</div>
                                                                    </td>
                                                                    <td className="p-3 text-right">
                                                                        <input type="number" value={item.qty} onChange={e => editOcrQty(idx, e.target.value)} className="w-16 text-right p-1 border rounded font-bold outline-none focus:ring-2 focus:ring-indigo-100" />
                                                                    </td>
                                                                    <td className="p-3 text-center">
                                                                        <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${
                                                                            item.confidence >= 0.9 ? 'bg-green-100 text-green-700' :
                                                                            item.confidence >= 0.7 ? 'bg-yellow-100 text-yellow-700' :
                                                                            'bg-red-100 text-red-700'
                                                                        }`}>{Math.round(item.confidence * 100)}%</span>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}

                                            <details className="text-xs">
                                                <summary className="cursor-pointer text-slate-400 hover:text-slate-600 font-bold">ดู Raw OCR Text</summary>
                                                <pre className="mt-2 bg-slate-900 text-green-400 p-4 rounded-xl overflow-auto max-h-40 whitespace-pre-wrap font-mono">{ocrResults.rawText}</pre>
                                            </details>
                                        </div>
                                    ) : null}
                                </div>

                                {ocrResults && ocrResults.items.length > 0 && (
                                    <div className="p-4 border-t bg-slate-50 flex gap-3">
                                        <button onClick={() => { setShowOcrModal(false); setOcrResults(null); }} className="flex-1 py-3 bg-slate-100 text-slate-500 font-bold rounded-xl">ยกเลิก</button>
                                        <button onClick={handleOcrConfirm} className="flex-1 py-3 bg-amber-500 text-white font-bold rounded-xl shadow-lg hover:bg-amber-600 flex items-center justify-center gap-2">
                                            <Icons.Check/> เพิ่ม {ocrResults.items.filter(i => i.selected).length} รายการ
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const HistoryView = ({ transactions }) => (
            <div className="space-y-6">
                <div className="flex justify-between items-center"><h2 className="text-2xl font-bold">History</h2><button onClick={()=>exportToExcel(transactions, "Log")} className="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded font-bold"><Icons.Download/> Export</button></div>
                <div className="bg-white rounded-2xl shadow-sm border overflow-hidden max-h-[75vh] overflow-y-auto">
                    <table className="w-full text-xs text-left">
                        <thead className="bg-slate-50 sticky top-0">
                            <tr><th className="p-4">Date</th><th className="p-4">Type</th><th className="p-4">Part No</th><th className="p-4 text-right">Qty</th><th className="p-4">Ref</th><th className="p-4">User</th></tr>
                        </thead>
                        <tbody className="divide-y">
                            {transactions.map(t => (
                                <tr key={t.id} className="hover:bg-slate-50">
                                    <td className="p-4 text-slate-400">{new Date(t.date).toLocaleString()}</td>
                                    <td className="p-4"><span className={`px-2 py-0.5 rounded ${t.type==='IN'?'bg-green-100 text-green-700':t.type==='OUT'?'bg-red-100 text-red-700':'bg-orange-100 text-orange-700'}`}>{t.type}</span></td>
                                    <td className="p-4 font-bold">{t.partNo}</td>
                                    <td className="p-4 text-right font-mono">{formatNum(t.qty)}</td>
                                    <td className="p-4 text-slate-500">{t.refDoc}</td>
                                    <td className="p-4 text-slate-500">{t.user}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        );

        const SettingsView = ({ apiUrl, setApiUrl, users, currentUser, onSaveUser, onDeleteUser }) => {
            const [url, setUrl] = useState(apiUrl);
            const [userModal, setUserModal] = useState(false);
            const [editUser, setEditUser] = useState(null);

            const handleSaveUserForm = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const u = {
                    id: editUser ? editUser.id : null,
                    username: formData.get('username'),
                    password: formData.get('password'),
                    name: formData.get('name'),
                    role: formData.get('role')
                };
                if (!u.username || !u.name) return alert("กรอกข้อมูลให้ครบ");
                if (!editUser && !u.password) return alert("กรุณาตั้งรหัสผ่าน");
                
                onSaveUser(u);
                setUserModal(false);
            };

            return (
                <div className="space-y-6 max-w-4xl mx-auto">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border">
                        <h2 className="text-xl font-bold mb-4 flex items-center gap-2"><Icons.Settings/> System Settings</h2>
                        <label className="block text-xs font-bold text-slate-500 mb-2">Google Apps Script URL</label>
                        <div className="flex gap-2">
                            <input type="text" value={url} onChange={e=>setUrl(e.target.value)} disabled={currentUser.role!=='ADMIN'} className="flex-1 p-3 border rounded-xl text-sm" placeholder="https://..."/>
                            <button onClick={()=>{localStorage.setItem(STORAGE_KEY_API_URL, url); setApiUrl(url); alert("บันทึกสำเร็จ");}} disabled={currentUser.role!=='ADMIN'} className="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold disabled:opacity-50">Save</button>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-sm border">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-bold flex items-center gap-2"><Icons.Users/> User Management</h2>
                            {currentUser.role === 'ADMIN' && <button onClick={()=>{setEditUser(null); setUserModal(true);}} className="bg-green-600 text-white px-3 py-1 rounded-lg text-sm font-bold shadow">+ Add User</button>}
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-slate-50 uppercase text-xs font-bold text-slate-500">
                                    <tr><th className="p-3">Username</th><th className="p-3">Name</th><th className="p-3">Role</th><th className="p-3 text-center">Action</th></tr>
                                </thead>
                                <tbody className="divide-y">
                                    {users.map(u => (
                                        <tr key={u.id}>
                                            <td className="p-3 font-mono">{u.username}</td>
                                            <td className="p-3">{u.name}</td>
                                            <td className="p-3"><span className={`px-2 py-0.5 rounded text-xs ${u.role==='ADMIN'?'bg-purple-100 text-purple-700':'bg-slate-100'}`}>{u.role}</span></td>
                                            <td className="p-3 text-center">
                                                {currentUser.role === 'ADMIN' && (
                                                    <div className="flex justify-center gap-2">
                                                        <button onClick={()=>{setEditUser(u); setUserModal(true);}} className="text-blue-500"><Icons.Settings/></button>
                                                        {u.username !== 'admin' && u.id !== currentUser.id && <button onClick={()=>onDeleteUser(u.id)} className="text-red-500"><Icons.Trash/></button>}
                                                    </div>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {userModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <div className="bg-white p-6 rounded-2xl w-full max-w-sm animate-fade-in shadow-xl" onClick={e=>e.stopPropagation()}>
                                <h3 className="font-bold mb-4">{editUser ? 'Edit User' : 'Add New User'}</h3>
                                <form onSubmit={handleSaveUserForm} className="space-y-3">
                                    <input name="username" defaultValue={editUser?.username} className="w-full p-2 border rounded" placeholder="Username" disabled={!!editUser}/>
                                    <input name="name" defaultValue={editUser?.name} className="w-full p-2 border rounded" placeholder="Display Name"/>
                                    <input name="password" type="password" className="w-full p-2 border rounded" placeholder={editUser ? "Password (Leave blank to keep)" : "Password"}/>
                                    <select name="role" defaultValue={editUser?.role || 'STAFF'} className="w-full p-2 border rounded bg-white">
                                        <option value="STAFF">STAFF</option>
                                        <option value="ADMIN">ADMIN</option>
                                    </select>
                                    <div className="flex gap-2 mt-4">
                                        <button type="button" onClick={()=>setUserModal(false)} className="flex-1 py-2 bg-slate-100 rounded-lg">Cancel</button>
                                        <button type="submit" className="flex-1 py-2 bg-green-600 text-white rounded-lg font-bold">Save</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
