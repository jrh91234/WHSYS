            const indexingRef = useRef(false); // กันดัชนีวิ่งซ้อนกัน 2 ชุด (auto + กดปุ่มเอง)
            const runIndexing = async (targets, silent = false) => {
                if (indexingRef.current) return;
                indexingRef.current = true;
                if (!silent) { setVisualBusy(true); setVisualMsg("กำลังโหลดโมเดล AI (ครั้งแรกอาจนานหน่อย)..."); }
                setIndexProg({ done: 0, total: targets.length });
                try {
                    const model = await loadVisionModel();
                    const toSave = [];
                    const toMerge = []; // ดัชนีที่เพิ่งประมวลผลเสร็จ รอใส่กลับเข้า state เป็นชุด
                    let savedCount = 0; // จำนวนที่บันทึกขึ้น cloud ไปแล้ว (ทยอยบันทึกเป็นชุด ๆ ระหว่างทาง)
                    for (let i = 0; i < targets.length; i++) {
                        if (!isMountedRef.current) break; // ออกจากหน้าแล้ว หยุดงานหนัก — รูปที่เหลือรอบเปิดหน้าครั้งถัดไปเก็บตกต่อ
                        const { partNo: p, fileId, prevOcrText } = targets[i];
                        if (!silent) setVisualMsg("กำลังประมวลผลรูปพาร์ท...");
                        setIndexProg({ done: i, total: targets.length });
                        try {
                            const res = await fetch(apiUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "get_image_b64", fileId }) });
                            const json = await res.json();
                            if (json.status !== "success" || !json.base64) continue;
                            const img = await dataUrlToImageEl("data:" + (json.mimeType || "image/jpeg") + ";base64," + json.base64);
                            const vec = await embedImageEl(model, img);
                            const centerVec = await embedImageEl(model, centerCropCanvas(img)); // เวกเตอร์กลางภาพ — ลดผลพื้นหลังตอนเทียบ
                            const colorHist = colorHistFromImage(img); // ลายเซ็นสีจากกลางภาพ — แยกพาร์ททรงเดียวกันคนละสี
                            const patches = await embedImagePatches(model, img); // patch 4 มุม — ให้ขั้นตรวจเชิงลึกตอนค้นหาเทียบได้ทันทีไม่ต้องดึงรูป
                            // อ่านตัวหนังสือ/label บนพาร์ทเก็บไว้เทียบด้วย — "·" = อ่านแล้วแต่ไม่มีตัวหนังสือ (กันไม่ให้ถูกจับมาประมวลผลซ้ำทุกครั้ง)
                            // ใช้ข้อความที่เคย OCR ไว้แล้วถ้ามี (กรณีอัปเกรดดัชนีรุ่นเก่า) — รูปใหม่เช็คในเครื่องก่อน (~10ms) ว่ามีตัวหนังสือไหมค่อยยิง OCR
                            const ocrText = prevOcrText != null ? prevOcrText : (mightContainText(img)
                                ? ((await ocrImageB64(apiUrl, json.base64, json.mimeType || "image/jpeg")) || "·")
                                : "·");
                            toMerge.push({ partNo: p, item: { fileId, vector: vec, centerVec, colorHist, patches, tokens: ocrTokens(ocrText), hasOcr: true, ocrText } });
                            toSave.push({ partNo: p, fileId, embedding: packEmbedding(vec, centerVec, colorHist, patches), ocrText });
                            // ทยอยบันทึกทุก 10 รูป — รอบอัปเกรดดัชนีทั้งคลังกินเวลาหลายนาที ถ้าปิดแท็บกลางคันงานที่ทำแล้วจะได้ไม่หายหมด
                            // และดัชนีที่เสร็จแล้วใช้ค้นหาได้ทันทีโดยไม่ต้องรอครบทั้งรอบ
                            if (toSave.length >= 10) {
                                await fetch(apiUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "save_embeddings", items: toSave }) });
                                mergeIndexed(toMerge);
                                savedCount += toSave.length;
                                toSave.length = 0;
                                toMerge.length = 0;
                            }
                        } catch (err) { console.log("index fail", p, fileId, err); }
                    }
                    setIndexProg({ done: targets.length, total: targets.length });
                    // บันทึกส่วนท้ายที่ค้างอยู่เสมอ (แม้ถูกตัดจบเพราะออกจากหน้า) — งานที่ทำแล้วจะได้ไม่สูญเปล่า
                    if (toSave.length) {
                        if (!silent) setVisualMsg("กำลังบันทึกดัชนี...");
                        await fetch(apiUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "save_embeddings", items: toSave }) });
                        savedCount += toSave.length;
                    }
                    mergeIndexed(toMerge);
                    if (!silent && isMountedRef.current) alert("สร้างดัชนีรูปเสร็จ: " + savedCount + " รูป");
                } catch (e) {
                    if (!silent && isMountedRef.current) alert("สร้างดัชนีไม่สำเร็จ: " + e.message);
                    else console.log("index failed", e);
                } finally {
                    indexingRef.current = false;
                    if (!silent) { setVisualBusy(false); setVisualMsg(""); }
                    setIndexProg({ done: 0, total: 0 });
                }
            };

            const buildIndex = async () => {
                if (!apiUrl) return alert("ยังไม่ได้ตั้งค่า API URL");
                if (indexingRef.current) return alert("กำลังประมวลผลดัชนีอยู่แล้ว — รอให้รอบปัจจุบันเสร็จก่อน");
                // ดัชนีจาก cloud ยังมาไม่ครบ = รายการ "รูปที่ยังไม่มีดัชนี" เชื่อไม่ได้ — กดสร้างตอนนี้อาจประมวลผลรูปที่มีดัชนีอยู่แล้วซ้ำทั้งคลัง
                if (!freshLoaded && !confirm("ดัชนีจาก cloud ยังโหลดไม่ครบ/ล้มเหลว — ถ้าสร้างดัชนีตอนนี้ ระบบอาจประมวลผลรูปที่มีดัชนีอยู่แล้วซ้ำทั้งหมด (เสียเวลาและโควต้า OCR มาก)\n\nแนะนำให้รอโหลดดัชนีให้เสร็จ หรือกด 'ลองใหม่' ก่อน\n\nยืนยันจะสร้างดัชนีต่อเลยหรือไม่?")) return;
                const targets = findUnindexed();
                if (targets.length === 0) return alert("ดัชนีรูปครบแล้ว — ไม่มีรูปใหม่ให้ประมวลผล");
                await runIndexing(targets, false);
            };

            // ซ่อมดัชนีอัตโนมัติ: รูปที่หลุดจากการปิดแอปก่อน auto-index เสร็จ จะถูกเก็บตกให้เองตอนเปิดหน้านี้
            // ข้ามรูปที่เพิ่งอัปภายใน 3 นาที เพราะ auto-index ของมันอาจกำลังวิ่งอยู่ในแท็บนี้/แท็บอื่น
            // รอดัชนี "ของสด" จาก cloud ก่อนเสมอ — ตัดสินจากแคชเก่าอาจสั่งประมวลผลรูปที่แท้จริงมีดัชนีครบแล้ว
            const [autoHealing, setAutoHealing] = useState(false);
            const autoHealedRef = useRef(false); // ซ่อมครั้งเดียวต่อการเปิดหน้า พอแล้ว — ไม่วนซ้ำกินแบต/โควต้า OCR
            useEffect(() => {
                if (!freshLoaded || !apiUrl || autoHealedRef.current) return;
                // คลังมีรูปอยู่แต่ดัชนีในมือว่างเปล่า = "ดัชนียังมาไม่ถึง" ไม่ใช่ "ทั้งคลังยังไม่เคยทำดัชนี" —
                // ถ้าเชื่อตรงนี้จะสั่งประมวลผลใหม่ยกคลัง (กินเวลา/โควต้า OCR มหาศาล) และผู้ใช้ใหม่จะโดนบล็อกไม่ให้ค้นหา
                // ระหว่างรอ รอให้ดัชนีเข้ามาก่อนแล้ว effect นี้จะถูกเรียกอีกรอบเอง (autoHealedRef กันไม่ให้ทำซ้ำ)
                const havePhotos = Object.values(partImages).some(arr => arr && arr.length);
                if (havePhotos && Object.keys(embeddings).length === 0) return;
                const targets = findUnindexed(3 * 60 * 1000);
                if (targets.length === 0) return;
                autoHealedRef.current = true;
                setAutoHealing(true);
                runIndexing(targets, true).finally(() => setAutoHealing(false));
            }, [freshLoaded, embeddings]);

            // รอดัชนีก้อนแรกจาก cloud — ผู้ใช้เครื่องใหม่/เพิ่งล้างแคชจะเปิดหน้ามาแล้วดัชนียังว่างอยู่ชั่วครู่
            // ไม่ต้องรอครบทั้งคลัง แค่มีของให้เทียบก็ค้นได้ (ดัชนีที่เหลือทยอยมาเอง) — เกินเวลาก็ปล่อยผ่านไปค้นเท่าที่มี
            const waitForIndex = async (timeoutMs = 45000) => {
                const t0 = Date.now();
                while (Object.keys(embeddingsRef.current).length === 0
                    && (embLoadingRef.current || indexingRef.current)
                    && isMountedRef.current
                    && Date.now() - t0 < timeoutMs) {
                    await new Promise(r => setTimeout(r, 300));
                }
                return Object.keys(embeddingsRef.current).length > 0;
            };

            const handleQueryImage = async (e) => {
                const file = e.target.files[0]; e.target.value = "";
                if (!file) return;
                setVisualBusy(true); setVisualMsg("กำลังวิเคราะห์รูป..."); setVisualResults(null); setVisualNotice(""); setQueryFile(file);
                try {
                    const dataUrl = await new Promise((res) => { const r = new FileReader(); r.onload = ev => res(ev.target.result); r.readAsDataURL(file); });
                    setQueryPreview(dataUrl);
                    // ดัชนียังว่าง = ยังโหลด/ยังเก็บตกไม่ถึง ไม่ใช่ "ไม่มีดัชนี" — รูปถ่ายมาแล้ว รอให้แทนที่จะไล่ให้ไปกดสร้างดัชนีใหม่ทั้งคลัง
                    if (Object.keys(embeddingsRef.current).length === 0) {
                        setVisualMsg("กำลังรอดัชนีรูปจาก cloud...");
                        await waitForIndex();
                    }
                    // อ่านดัชนีจาก ref ไม่ใช่ตัวแปร closure — ระหว่างรอข้างบนมีก้อนใหม่เข้ามา state จะใหม่กว่าค่าที่ handler นี้จับไว้
                    const emb = embeddingsRef.current;
                    if (Object.keys(emb).length === 0) {
                        setVisualBusy(false); setVisualMsg("");
                        return alert(embLoadErrorRef.current
                            ? "โหลดดัชนีรูปจาก cloud ไม่สำเร็จ (" + embLoadErrorRef.current + ") — กด 'ลองใหม่' ที่ข้อความแจ้งเตือนด้านบนแล้วค้นหาอีกครั้ง"
                            : "ยังไม่มีดัชนีรูปในระบบ — กดปุ่ม 'สร้าง/อัปเดตดัชนีรูป' หนึ่งครั้งเพื่อประมวลผลรูปที่มีอยู่ก่อน");
                    }
                    setVisualMsg("กำลังวิเคราะห์รูป...");
                    const model = await loadVisionModel();
                    const img = await fileToImageEl(file);
                    const q = await embedImageEl(model, img);
                    const qCenter = await embedImageEl(model, centerCropCanvas(img)); // เวกเตอร์กลางภาพของรูปที่ถ่าย — เทียบแบบตัดพื้นหลังออก
                    const qHist = colorHistFromImage(img); // ลายเซ็นสีของรูปที่ถ่าย
                    // ขั้นที่ 1: คะแนนภาพรวมอย่างเดียวก่อน (เร็ว ทำในเครื่องล้วน ๆ) — ยังไม่แตะ OCR
                    const scored = Object.keys(emb).map(p => {
                        let posScore = -1, bestFileId = null, bestItem = null, colorSim = null;
                        emb[p].forEach(it => {
                            // เทียบทุกคู่ระหว่าง (เต็มภาพ, กลางภาพ) ของรูปค้นหากับของรูปดัชนี แล้วเอาคู่ที่ดีที่สุด —
                            // คู่กลางภาพ-กลางภาพช่วยเคสที่ฝั่งใดฝั่งหนึ่ง (หรือทั้งคู่) มีพื้นหลังรก ๆ ติดมาเยอะ
                            let s = cosineSim(q, it.vector);
                            if (it.centerVec) s = Math.max(s, cosineSim(q, it.centerVec), cosineSim(qCenter, it.centerVec));
                            s = Math.max(s, cosineSim(qCenter, it.vector));
                            if (s > posScore) { posScore = s; bestFileId = it.fileId; bestItem = it; }
                            if (qHist && it.colorHist) { const cs = histSim(qHist, it.colorHist); if (colorSim == null || cs > colorSim) colorSim = cs; }
                        });
                        // ปรับตามสี: สีตรงได้บวก สีคนละเรื่องโดนหัก (สูงสุด ±VS_TUNE.colorSpan/2) — รูปดัชนีรุ่นเก่าที่ยังไม่มีลายเซ็นสีไม่ถูกปรับ
                        const colorAdj = colorSim == null ? 0 : (colorSim - 0.5) * VS_TUNE.colorSpan;
                        const base = posScore + colorAdj;
                        return { partNo: p, name: partNameMap[p] || "", base, bestFileId, bestItem, colorSim, score: Math.min(1, base), textSim: 0 };
                    });
                    // ขั้นที่ 2: OCR เฉพาะเมื่อคุ้มจริง ๆ — (ก) มีตัวเต็งที่โบนัสตัวหนังสือ (+0.3 สูงสุด) ยังดันขึ้นถึงเกณฑ์แสดงผลได้
                    // และพาร์ทนั้นมีตัวหนังสือในดัชนีให้เทียบ (ข) รูปที่ถ่ายดูมีตัวหนังสือจริง (เช็คในเครื่อง ~10ms) — ไม่เข้าเงื่อนไขก็ข้าม ไม่เสียเวลารอ backend
                    const ocrWorthIt = scored.some(r =>
                        r.base >= VS_TUNE.minScore - VS_TUNE.ocrWeight &&
                        emb[r.partNo].some(it => it.tokens && it.tokens.size > 0));
                    if (ocrWorthIt && mightContainText(img)) {
                        setVisualMsg("กำลังอ่านตัวหนังสือในรูป...");
                        const queryTokens = ocrTokens(await ocrImageB64(apiUrl, dataUrl.split(',')[1]));
                        if (queryTokens.size > 0) scored.forEach(r => {
                            // โบนัสจากตัวหนังสือ/label ตรงกัน — ช่วยแยกพาร์ทที่หน้าตาเหมือนกันแต่พิมพ์เบอร์/ยี่ห้อต่างกัน
                            r.textSim = Math.max(0, ...emb[r.partNo].map(it => ocrTextSim(queryTokens, it.tokens || new Set())));
                            r.score = Math.min(1, r.base + r.textSim * VS_TUNE.ocrWeight);
                        });
                    }
                    scored.sort((a, b) => b.score - a.score);
                    const filtered = scored.filter(r => r.score >= VS_TUNE.minScore);
                    // ขั้นที่ 3: อันดับต้น ๆ คะแนนสูสีกันมาก = ภาพรวมแยกไม่ออก (เช่น พาร์ทต่างกันแค่จำนวนรู) —
                    // ตรวจรายละเอียดเชิงลึกเฉพาะกลุ่มตัวเต็ง: หั่นรูปเป็นส่วน ๆ เทียบทีละส่วน จุดต่างเล็ก ๆ จะไม่ถูกเฉลี่ยกลืนหาย
                    if (filtered.length >= 2 && filtered[0].score - filtered[1].score < VS_TUNE.rerankMargin) {
                        const group = filtered.filter(r => filtered[0].score - r.score < VS_TUNE.rerankMargin).slice(0, VS_TUNE.rerankMax);
                        if (group.length >= 2) {
                            setVisualMsg("คะแนนสูสี — กำลังตรวจรายละเอียดเชิงลึก (รู/ร่อง/จุดต่างเล็ก ๆ)...");
                            try {
                                // ชุด patch ของรูปที่ถ่าย = 4 มุม + กลางภาพ (เวกเตอร์กลางภาพคำนวณไว้แล้วตอนให้คะแนน ไม่ต้อง embed ซ้ำ)
                                const qPatches = [...(await embedImagePatches(model, img)), qCenter];
                                // คำนวณคะแนนใหม่พักไว้ก่อน แล้วค่อยใส่จริงเมื่อครบทุกพาร์ทในกลุ่ม —
                                // ถ้าพลาดกลางคัน (เช่น ดึงรูปพาร์ทใดไม่ได้) จะได้ไม่เหลือคะแนนครึ่ง rerank ครึ่งเดิมปนกันจนอันดับในกลุ่มเพี้ยน
                                const reranked = [];
                                for (const r of group) {
                                    if (!r.bestFileId) throw new Error("no indexed image for " + r.partNo);
                                    // ทางเร็ว: ดัชนี v2 มี patch เก็บไว้แล้ว เทียบได้ทันที ไม่ต้องดึงรูป/ประมวลผลอะไรอีก
                                    let cPatches = (r.bestItem && r.bestItem.patches)
                                        ? [...r.bestItem.patches, ...(r.bestItem.centerVec ? [r.bestItem.centerVec] : [])]
                                        : patchCacheRef.current[r.bestFileId];
                                    if (!cPatches) {
                                        // ทางช้า (เฉพาะดัชนีรุ่นเก่าที่งานอัปเกรดเบื้องหลังยังเก็บตกไม่ถึง): ดึงรูปมาประมวลผลสด
                                        const res = await fetch(apiUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "get_image_b64", fileId: r.bestFileId }) });
                                        const json = await res.json();
                                        if (json.status !== "success" || !json.base64) throw new Error("fetch image failed for " + r.partNo);
                                        const cImg = await dataUrlToImageEl("data:" + (json.mimeType || "image/jpeg") + ";base64," + json.base64);
                                        cPatches = [...(await embedImagePatches(model, cImg)), await embedImageEl(model, centerCropCanvas(cImg))];
                                        patchCacheRef.current[r.bestFileId] = cPatches;
                                    }
                                    const detail = patchSetSim(qPatches, cPatches);
                                    reranked.push({ r, detail, score: Math.min(1, r.score * (1 - VS_TUNE.detailWeight) + detail * VS_TUNE.detailWeight) });
                                }
                                reranked.forEach(({ r, detail, score }) => { r.detail = detail; r.score = score; });
                                filtered.sort((a, b) => b.score - a.score);
                                setVisualNotice("อันดับต้น ๆ หน้าตาใกล้กันมาก ระบบตรวจรายละเอียดเชิงลึกให้แล้ว — ก่อนยืนยัน โปรดเช็ครายละเอียดเล็ก ๆ เช่น จำนวนรู/ร่อง เทียบกับรูปตัวอย่างอีกครั้ง");
                            } catch (err) {
                                // ตรวจเชิงลึกพลาด (เช่น ดึงรูปไม่ได้) ไม่ใช่เหตุให้การค้นหาล้ม — ใช้คะแนนภาพรวมเดิม แต่ยังเตือนให้คนเช็คเอง
                                console.log("detail re-rank failed", err);
                                setVisualNotice("อันดับต้น ๆ คะแนนสูสีกันมาก — โปรดเช็ครายละเอียดเล็ก ๆ เช่น จำนวนรู/ร่อง เทียบกับรูปตัวอย่างก่อนยืนยัน");
                            }
                        }
                    }
                    // มั่นใจสูง: ตัวท็อปถึงเกณฑ์ (หลังผ่านทุกขั้นรวมถึงตรวจเชิงลึกแล้ว) — ตัดตัวเลือกที่คะแนนไม่ถึงเกณฑ์ทิ้ง
                    // เหลือเฉพาะตัวที่มั่นใจจริง คนหน้างานจะได้ไม่เผลอหยิบตัวคะแนนต่ำที่แค่บังเอิญโผล่มาด้วย
                    let finalResults = filtered;
                    if (filtered.length > 1 && filtered[0].score >= VS_TUNE.highCut) {
                        finalResults = filtered.filter(r => r.score >= VS_TUNE.highCut);
                        // เหลือตัวเดียว = ชัดเจนแล้ว ไม่ต้องโชว์ป้ายเตือน "คะแนนสูสี" ให้สับสน
                        if (finalResults.length === 1) setVisualNotice("");
                    }
                    setVisualResults(finalResults.slice(0, 12));
                } catch (err) {
                    alert("ค้นหาด้วยรูปไม่สำเร็จ: " + err.message);
                } finally { setVisualBusy(false); setVisualMsg(""); }
            };

            return {
                embeddings, embLoaded, visualBusy, visualMsg, indexProg, autoHealing,
                freshLoaded, embLoadProg, embLoadError, retryLoadIndex,
                queryPreview, setQueryPreview, queryFile, visualResults, setVisualResults, visualNotice,
                buildIndex, handleQueryImage
            };
        };

        // ===== รูปประจำ Part (เก็บใน Google Drive) — แยกออกมาเป็นฟังก์ชันเดี่ยว ใช้ร่วมกันได้ทุกหน้าที่โชว์รูปพาร์ท =====
        // partImages: partNo -> [{ fileId, url, updatedAt, user }] — พาร์ทเดียวกันอัปได้หลายรูป/หลายมุม รูปแรกในลิสต์ = รูปปก
        const usePartImageManager = (apiUrl, partImages = {}, setPartImages, currentUser) => {
            const imgFileRef = useRef(null);
            const uploadTargetPart = useRef("");
            const [uploadingPart, setUploadingPart] = useState("");
            const [localPreviews, setLocalPreviews] = useState({}); // fileId -> dataURL (โชว์ทันทีหลังอัป ระหว่างรอ Drive สร้าง thumbnail)
            const [lightbox, setLightbox] = useState(null);          // { partNo, fileId, src }
            const [namePopup, setNamePopup] = useState(null);        // { partNo, name } เมนูเด้งตอนกดชื่อพาร์ท

            const resizeToJpeg = (file, maxDim = 1280, quality = 0.82) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onerror = () => reject(new Error("อ่านไฟล์รูปไม่สำเร็จ"));
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onerror = () => reject(new Error("ไฟล์รูปเสียหายหรือเปิดไม่ได้"));
                        img.onload = () => {
                            let w = img.width, h = img.height;
                            if (w > maxDim || h > maxDim) {
                                const ratio = Math.min(maxDim / w, maxDim / h);
                                w = Math.round(w * ratio); h = Math.round(h * ratio);
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = w; canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); // กันพื้นโปร่งใสกลายเป็นดำตอนแปลงเป็น JPEG
                            ctx.drawImage(img, 0, 0, w, h);
                            const dataUrl = canvas.toDataURL('image/jpeg', quality);
                            resolve({ dataUrl, base64: dataUrl.split(',')[1] });
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const pickImageFor = (partNo, useCamera = false) => {
                if (!partNo) return;
                if (!apiUrl) return alert("กรุณาตั้งค่า API URL ก่อนอัปโหลดรูป");
                if (!imgFileRef.current) return;
                uploadTargetPart.current = partNo;
                // useCamera = true → เปิดกล้องหลังของมือถือเลย (เดสก์ท็อปจะ fallback เป็นเลือกไฟล์)
                if (useCamera) imgFileRef.current.setAttribute('capture', 'environment');
                else imgFileRef.current.removeAttribute('capture');
                imgFileRef.current.click();
            };

            // สร้าง embedding ของรูปที่เพิ่งอัปให้อัตโนมัติแล้วบันทึกขึ้น cloud เบื้องหลัง
            // ไม่ await จากตัวเรียก และไม่โยน error ออกไป กันไม่ให้ค้าง/รบกวน flow อัปโหลดรูปหลัก
            const autoIndexUpload = async (partNo, fileId, dataUrl) => {
                if (!apiUrl) return;
                try {
                    const model = await loadVisionModel();
                    const img = await dataUrlToImageEl(dataUrl);
                    const vec = await embedImageEl(model, img);
                    const centerVec = await embedImageEl(model, centerCropCanvas(img)); // เวกเตอร์กลางภาพ — ลดผลพื้นหลังตอนเทียบ
                    const colorHist = colorHistFromImage(img); // ลายเซ็นสีจากกลางภาพ — แยกพาร์ททรงเดียวกันคนละสี
                    const patches = await embedImagePatches(model, img); // patch 4 มุม — ให้ขั้นตรวจเชิงลึกตอนค้นหาเทียบได้ทันที
                    // อ่านตัวหนังสือ/label บนพาร์ทเก็บไว้เทียบด้วย — "·" = อ่านแล้วแต่ไม่มีตัวหนังสือ (กันไม่ให้ถูกจับมาประมวลผลซ้ำ)
                    // เช็คในเครื่องก่อน (~10ms) ว่ารูปมีตัวหนังสือไหมค่อยยิง OCR — รูปเกลี้ยง ๆ ไม่เปลืองโควต้า
                    const ocrText = mightContainText(img) ? ((await ocrImageB64(apiUrl, dataUrl.split(',')[1])) || "·") : "·";
                    await fetch(apiUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "save_embeddings", items: [{ partNo, fileId, embedding: packEmbedding(vec, centerVec, colorHist, patches), ocrText }] })
                    });
                } catch (err) {
                    console.log("auto-index (background) failed", partNo, fileId, err);
                }
            };

            // อัปโหลดรูปเดี่ยว ๆ ให้พาร์ทหนึ่ง ๆ: resize -> upload -> เพิ่มเข้า partImages -> สร้างดัชนีอัตโนมัติเบื้องหลัง
            // แยกออกมาต่างหากเพื่อให้เรียกใช้ตรง ๆ ได้ (เช่น ตอนยืนยันผลค้นหาด้วยรูปว่าใช่พาร์ทนี้) ไม่ต้องผ่าน input ไฟล์เสมอไป
            const uploadOneImage = async (partNo, file) => {
                const { dataUrl, base64 } = await resizeToJpeg(file);
                const res = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "upload_part_image", partNo, imageData: base64, mimeType: "image/jpeg", user: currentUser?.name || "-" })
                });
                const json = await res.json();
                if (json.status !== "success" || !json.fileId) throw new Error(json.message || "อัปโหลดไม่สำเร็จ");

                setLocalPreviews(prev => ({ ...prev, [json.fileId]: dataUrl })); // โชว์ทันทีระหว่างรอ Drive สร้าง thumbnail
                if (setPartImages) {
                    setPartImages(prev => ({
                        ...prev,
                        [partNo]: [...(prev[partNo] || []), { fileId: json.fileId, url: json.url, updatedAt: new Date().toISOString(), user: currentUser?.name || "-" }]
                    }));
                }
                autoIndexUpload(partNo, json.fileId, dataUrl); // สร้างดัชนีให้เองเบื้องหลัง ไม่ต้องรอ ไม่บล็อก UI
                return json;
            };

            // รองรับเลือกได้หลายไฟล์พร้อมกัน (จากคลังรูป) — อัปทีละไฟล์ ไฟล์ไหนพังก็ข้ามไปไฟล์ถัดไป
            const handleImageFile = async (e) => {
                const files = Array.from(e.target.files || []);
                const partNo = uploadTargetPart.current;
                e.target.value = "";
                if (!files.length || !partNo) return;
                const imageFiles = files.filter(f => f.type.startsWith('image/'));
                if (!imageFiles.length) return alert("กรุณาเลือกไฟล์รูปภาพ");

                setUploadingPart(partNo);
                try {
                    for (const file of imageFiles) {
                        try { await uploadOneImage(partNo, file); }
                        catch (err) { alert(`อัปโหลดรูปไม่สำเร็จ (${file.name}): ` + err.message); }
                    }
                } finally {
                    setUploadingPart("");
                }
            };

            const handleDeleteImage = async (partNo, fileId) => {
                if (!confirm(`ลบรูปนี้ของ ${partNo}?`)) return;
                const backupImages = { ...partImages };
                if (setPartImages) {
                    setPartImages(prev => ({ ...prev, [partNo]: (prev[partNo] || []).filter(img => img.fileId !== fileId) }));
                }
                setLocalPreviews(prev => { const n = { ...prev }; delete n[fileId]; return n; });
                if (!apiUrl) return;
                try {
                    const res = await fetch(apiUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "delete_part_image", partNo, fileId })
                    });
                    const json = await res.json();
                    if (json.status !== "success") throw new Error(json.message || "ลบไม่สำเร็จ");
                } catch (err) {
                    // rollback ถ้าฝั่ง server ลบไม่สำเร็จ กันข้อมูลไม่ตรงกัน
                    if (setPartImages) setPartImages(backupImages);
                    alert("ลบรูปภาพไม่สำเร็จ: " + err.message);
                }
            };

            // ดัชนีสำรองแบบ normalize — รูปเก่าถูกเก็บด้วย Part No ดิบจากชีท (อาจมี nbsp/ช่องว่างติดมา)
            // ส่วนหน้าจอตอนนี้ส่ง Part No ที่ล้างแล้วเข้ามา ถ้าเทียบตรง ๆ ไม่เจอให้ถอยมาเทียบแบบ normalize
            const normImageIndex = useMemo(() => {
                const idx = {};
                Object.keys(partImages || {}).forEach(k => {
                    const nk = normPartNo(k);
                    if (!nk) return;
                    idx[nk] = (idx[nk] || []).concat(partImages[k] || []);
                });
                return idx;
            }, [partImages]);

            const imagesFor = (partNo) => partImages[partNo] || normImageIndex[normPartNo(partNo)] || [];

            // หา src ของรูปเดี่ยว ๆ ตาม fileId (รูปที่เพิ่งอัป > รูปจาก Drive)
            const imgSrcForFile = (fileId, size = 400) => {
                if (!fileId) return "";
                if (localPreviews[fileId]) return localPreviews[fileId];
                return driveThumb(fileId, size);
            };

            // src ของรูปปก (รูปแรก) ของพาร์ท ใช้โชว์เป็น thumbnail ในตาราง/ผลค้นหา
            const imgSrcFor = (partNo, size = 400) => imgSrcForFile(imagesFor(partNo)[0]?.fileId, size);
            const coverFileId = (partNo) => imagesFor(partNo)[0]?.fileId || "";

            return {
                imgFileRef, uploadingPart, lightbox, setLightbox, namePopup, setNamePopup,
                pickImageFor, handleImageFile, handleDeleteImage, uploadOneImage,
                imagesFor, imgSrcFor, imgSrcForFile, coverFileId
            };
        };

        // Modal คู่กัน: lightbox ดูรูปเต็มจอ + popup จัดการรูปตอนกดชื่อพาร์ท (ใช้ร่วมกับ usePartImageManager)
        const ImagePreviewModals = ({ imgFileRef, onFileChange, lightbox, setLightbox, namePopup, setNamePopup, imagesFor, imgSrcForFile, pickImageFor, handleDeleteImage }) => {
            const popImages = namePopup ? imagesFor(namePopup.partNo) : [];
            return (
                <>
                    <input type="file" ref={imgFileRef} onChange={onFileChange} className="hidden" accept="image/*" multiple />

                    {lightbox && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-overlay" onClick={() => setLightbox(null)}>
                            <div className="relative max-w-3xl w-full" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center text-white mb-2">
                                    <span className="font-mono font-bold">{lightbox.partNo}</span>
                                    <div className="flex gap-3 items-center">
                                        <button onClick={() => { const p = lightbox.partNo, fid = lightbox.fileId; setLightbox(null); handleDeleteImage(p, fid); }} className="text-sm hover:text-red-400"><i className="fa-solid fa-trash-can mr-1"></i>ลบรูปนี้</button>
                                        <button onClick={() => setLightbox(null)} className="text-2xl hover:text-slate-300"><Icons.X/></button>
                                    </div>
                                </div>
                                <img src={lightbox.src} alt={lightbox.partNo} className="w-full max-h-[80vh] object-contain rounded-lg bg-white" />
                            </div>
                        </div>
                    )}

                    {namePopup && (
                        <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-4 modal-overlay" onClick={() => setNamePopup(null)}>
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-5 animate-fade-in" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-start mb-1">
                                    <div className="min-w-0">
                                        <div className="font-mono font-bold text-blue-600 truncate">{namePopup.partNo}</div>
                                        <div className="text-sm text-slate-500 truncate">{namePopup.name}</div>
                                    </div>
                                    <button onClick={() => setNamePopup(null)} className="text-slate-400 hover:text-slate-600 text-xl ml-2"><Icons.X/></button>
                                </div>

                                {popImages.length > 0 ? (
                                    <div className="grid grid-cols-4 gap-2 my-3">
                                        {popImages.map((img, i) => (
                                            <div key={img.fileId || i} className="relative group">
                                                <img src={imgSrcForFile(img.fileId, 400)} alt=""
                                                    onClick={() => setLightbox({ partNo: namePopup.partNo, fileId: img.fileId, src: imgSrcForFile(img.fileId, 1600) })}
                                                    className="w-full h-16 object-cover rounded-lg border cursor-zoom-in" />
                                                <button onClick={() => handleDeleteImage(namePopup.partNo, img.fileId)} title="ลบรูปนี้"
                                                    className="absolute -top-1.5 -right-1.5 bg-red-600 text-white rounded-full w-5 h-5 text-[9px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i className="fa-solid fa-xmark"></i></button>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center text-xs text-slate-400 py-4">ยังไม่มีรูป</div>
                                )}

                                <div className="grid grid-cols-2 gap-2 mt-1">
                                    <button onClick={() => { const p = namePopup.partNo; setNamePopup(null); pickImageFor(p, true); }}
                                        className="col-span-2 bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-camera"></i> ถ่ายรูปเพิ่ม
                                    </button>
                                    <button onClick={() => { const p = namePopup.partNo; setNamePopup(null); pickImageFor(p, false); }}
                                        className="col-span-2 bg-slate-100 text-slate-700 py-2.5 rounded-xl font-bold hover:bg-slate-200 flex items-center justify-center gap-2">
                                        <i className="fa-solid fa-image"></i> เลือกจากเครื่อง (เลือกได้หลายรูป)
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        // ป้าย "ผลิตเอง / ซื้อ" ในผลลัพธ์ MRP — ตัดสินจากว่าเลขพาร์ทอยู่ในรายการพาร์ทของแผนกไหนหรือเปล่า
        // "ซื้อ" หมายถึงไม่อยู่ในรายการแผนกที่นำเข้ามาแล้วเท่านั้น ไม่ได้แปลว่าไม่มีแผนกไหนผลิตได้จริง ๆ
        const MakeBuyBadge = ({ madeBy }) => madeBy
            ? <span title={`อยู่ในรายการพาร์ทของแผนก ${madeBy}`} className="text-[10px] bg-amber-100 text-amber-800 border border-amber-300 px-2 py-0.5 rounded whitespace-nowrap">ผลิตเอง · {madeBy}</span>
            : <span title="ไม่อยู่ในรายการพาร์ทของแผนกที่นำเข้ามา" className="text-[10px] bg-slate-100 text-slate-500 border border-slate-200 px-2 py-0.5 rounded whitespace-nowrap">ซื้อ</span>;

        const AdvancedMRPView = ({ inventory, addTransaction, bomData, setBomData, deptData = {}, deptConfig = {}, apiUrl, partImages = {}, setPartImages, currentUser }) => {
            // เลขพาร์ท -> แผนกที่ผลิตเอง ใช้ติดป้าย "ผลิตเอง / ซื้อ" ในผลลัพธ์ MRP
            const makerDepts = useMemo(() => makerDeptsOf(deptData, deptConfig), [deptData, deptConfig]);
            const hasDeptList = useMemo(() => Object.keys(deptData || {}).length > 0, [deptData]);
            const [step, setStep] = useState(1);
            const [mode, setMode] = useState('plan'); 
            const [sheetNames, setSheetNames] = useState(Object.keys(bomData) || []);
            const [currentPreviewSheet, setCurrentPreviewSheet] = useState(sheetNames[0] || "");
            
            const [pNoCol, setPNoCol] = useState(2);
            const [qtyCol, setQtyCol] = useState(4);
            const [lvlCol, setLvlCol] = useState(0);
            const [typeCol, setTypeCol] = useState(6);
            const [nameCol, setNameCol] = useState(3);
            
            const [bomColWidths, setBomColWidths] = useState({});

            const [orderText, setOrderText] = useState("");
            const [matchCandidates, setMatchCandidates] = useState([]);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            
            const [finalSummary, setFinalSummary] = useState(null); 
            const [finalTree, setFinalTree] = useState(null);       
            const [resultViewMode, setResultViewMode] = useState('tree'); 
            const [breakdownItem, setBreakdownItem] = useState(null); 
            
            const [isLoading, setIsLoading] = useState(false);
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'ascending' });
            const [compareList, setCompareList] = useState(["", ""]);
            const [compResult, setCompResult] = useState(null);

            const {
                imgFileRef, uploadingPart, lightbox, setLightbox, namePopup, setNamePopup,
                pickImageFor, handleImageFile, handleDeleteImage,
                imagesFor, imgSrcFor, imgSrcForFile, coverFileId
            } = usePartImageManager(apiUrl, partImages, setPartImages, currentUser);

            const getSimilarity = (s1, s2) => {
                s1 = String(s1 || "").toLowerCase().trim(); 
                s2 = String(s2 || "").toLowerCase().trim();
                
                if (s1 === s2) return 1.0; 
                if (s1.includes(s2) || s2.includes(s1)) return 0.9; 

                const len1 = s1.length;
                const len2 = s2.length;
                const maxLen = Math.max(len1, len2);
                if (maxLen === 0) return 1.0;

                const track = Array(len2 + 1).fill(null).map(() => Array(len1 + 1).fill(null));

                for (let i = 0; i <= len1; i++) track[0][i] = i;
                for (let j = 0; j <= len2; j++) track[j][0] = j;

                for (let j = 1; j <= len2; j++) {
                    for (let i = 1; i <= len1; i++) {
                        const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
                        track[j][i] = Math.min(
                            track[j][i - 1] + 1, 
                            track[j - 1][i] + 1, 
                            track[j - 1][i - 1] + indicator 
                        );
                    }
                }
                
                const distance = track[len2][len1];
                return 1 - (distance / maxLen);
            };

            const handleCloudLoad = async () => {
                if (!apiUrl) return alert("กรุณาตั้งค่า URL ก่อน");
                setIsLoading(true);
                try {
                    const res = await fetch(apiUrl + "?action=getBOM&t=" + Date.now());
                    const json = await res.json();
                    const data = json.data || json;
                    const names = Object.keys(data).filter(k => k !== 'version');
                    setBomData(data);
                    setSheetNames(names);
                    setCurrentPreviewSheet(names[0]);
                    alert("ดึงข้อมูล BOM สำเร็จ");
                } catch(e) { alert("โหลดข้อมูลไม่สำเร็จ (CORS/Deploy Error): " + e.message); }
                finally { setIsLoading(false); }
            };

            const handlePreCalculate = () => {
                const lines = orderText.split('\n').filter(l => l.trim() !== "");
                const parsedOrders = lines.map(l => {
                    const parts = l.trim().split(/[\s\t,]+/);
                    if (parts.length < 2) return null;
                    return { model: parts[0], qty: parseFloat(parts[parts.length-1]) };
                }).filter(o => o && !isNaN(o.qty));

                if (parsedOrders.length === 0) return alert("กรุณากรอก Order เช่น 'ModelA 100'");

                const candidates = parsedOrders.map(order => {
                    let bestMatch = ""; let maxScore = 0;
                    sheetNames.forEach(sheet => {
                        const score = getSimilarity(order.model, sheet);
                        if (score > maxScore) { maxScore = score; bestMatch = sheet; }
                    });
                    return { ...order, matchedSheet: bestMatch, score: maxScore };
                });

                setMatchCandidates(candidates);
                setShowConfirmModal(true);
            };

            const handleCalculateFinal = () => {
                setShowConfirmModal(false);
                const summaryResults = {};
                const treeResults = [];
                
                matchCandidates.forEach(order => {
                    if (!order.matchedSheet) return;

                    treeResults.push({
                        type: 'JOB_HEADER',
                        partNo: order.matchedSheet, 
                        name: `Production Job: ${order.qty} Unit(s)`,
                        reqQty: order.qty,
                        level: 0,
                        isHeader: true
                    });

                    const sheetRows = bomData[order.matchedSheet];

                    sheetRows.forEach((row, idx) => {
                        if (idx === 0) return; 
                        
                        const pNo = String(row[pNoCol] || "").trim();
                        const qpu = parseFloat(row[qtyCol]) || 0; 
                        const lvl = parseFloat(row[lvlCol]); 
                        const name = row[nameCol] || "";
                        const type = row[typeCol] || "-";

                        // ข้ามบรรทัดที่ไม่มี Part No หรือ Part No ซ้ำกับชื่อ Model ตัวมันเอง (ป้องกันลูปคำนวณซ้ำ)
                        if (!pNo || pNo === order.matchedSheet) return;

                        const totalReq = qpu * order.qty;
                        // อยู่ในรายการพาร์ทของแผนกไหน = แผนกนั้นผลิตเอง ไม่ต้องสั่งซื้อ
                        const madeBy = (makerDepts[normPartNo(pNo)] || []).join(", ");

                        if (!summaryResults[pNo]) {
                            summaryResults[pNo] = {
                                partNo: pNo, name: name, level: lvl, type: type, reqQty: 0, madeBy: madeBy, breakdown: []
                            };
                        }
                        summaryResults[pNo].reqQty += totalReq;
                        
                        summaryResults[pNo].breakdown.push({ model: order.matchedSheet, qty: totalReq });

                        const stock = inventory.find(i => i.partNo === pNo);
                        const onHand = stock ? stock.qty : 0;

                        treeResults.push({
                            partNo: pNo,
                            name: name,
                            level: lvl,
                            type: type,
                            reqQty: totalReq,
                            qpu: qpu,
                            onHand: onHand,
                            diff: onHand - totalReq,
                            madeBy: madeBy,
                            parentModel: order.matchedSheet
                        });
                    });
                });

                const finalSum = Object.values(summaryResults).map(item => {
                    const stock = inventory.find(i => i.partNo === item.partNo);
                    const onHand = stock ? stock.qty : 0;
                    return { ...item, onHand, diff: onHand - item.reqQty };
                });

                setFinalSummary(finalSum);
                setFinalTree(treeResults);
                setStep(3);
                setResultViewMode('tree'); 
            };

            const handleCompare = () => {
                const validModels = compareList.filter(m => m !== ""); 
                if (validModels.length < 2) return alert("กรุณาเลือกอย่างน้อย 2 รุ่น");
                
                const allParts = new Set();
                const modelMaps = validModels.map(m => {
                    const map = {};
                    const rows = bomData[m] || [];
                    rows.slice(1).forEach(r => {
                        const pNo = String(r[pNoCol]||"").trim();
                        if(pNo) {
                            map[pNo] = { qty: parseFloat(r[qtyCol]||0), name: r[nameCol] };
                            allParts.add(pNo);
                        }
                    });
                    return map;
                });

                const rows = Array.from(allParts).map(pNo => {
                    const qs = modelMaps.map(map => map[pNo]?.qty || 0);
                    const name = modelMaps.find(map => map[pNo]?.name)?.[pNo]?.name || "";
                    const isDiff = qs.some(q => q !== qs[0]);
                    return { partNo: pNo, name, quantities: qs, status: isDiff ? 'Diff' : 'Same' };
                });
                
                setCompResult({ models: validModels, rows });
            };

            // --- Export: BOM Compare ---
            const exportCompareExcel = () => {
                if (!compResult) return;

                    compResult.models.forEach((m, i) => { o[m] = r.quantities[i]; });
                    o["Status"] = r.status;
                    o["รูป (ลิงก์)"] = driveViewLink(partImages, r.partNo);
                    return o;

                exportToExcel(data, "BOM_Compare", "Compare");
            };
            const exportComparePDF = () => {
                if (!compResult) return;
                const headers = ["รูป", "Part No", "Name", ...compResult.models, "Status"];
                const rows = compResult.rows.map(r => {
                    const fid = partFileId(partImages, r.partNo);

                exportTableToPDF("BOM Compare: " + compResult.models.join(" vs "), headers, rows);

            const requestSort = (key) => {

                        if (aValue < bValue) return sortConfig.direction === 'ascending' ? -1 : 1;
                        if (aValue > bValue) return sortConfig.direction === 'ascending' ? 1 : -1;
                        return 0;
                    });

                return sortableItems;

            return (
                <div className="animate-fade-in space-y-6">

                                    {isLoading ? <div className="loader"/> : <Icons.Cloud/>} Sync Cloud BOM
                                </button>
                            </div>

                                                                </div>
                                                                <div className="font-bold text-slate-700 truncate" title={h}>{h || `Col ${i}`}</div>
                                                            </div>
                                                        </ResizableTh>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {bomData[currentPreviewSheet]?.slice(1).map((row, ri) => {
                                                    const rowPartNo = String(row[pNoCol] || "").trim();
                                                    const thumb = rowPartNo ? imgSrcFor(rowPartNo) : "";
                                                    return (
                                                    <tr key={ri} className="border-b hover:bg-slate-50">
                                                        <td className="p-2 border-r text-center text-slate-300">{ri+1}</td>
                                                        <td className="p-1 border-r text-center align-middle">
                                                            {!rowPartNo ? <span className="text-slate-200">-</span>
                                                            : uploadingPart === rowPartNo ? <div className="loader mx-auto" style={{width:18,height:18,borderWidth:2}}></div>
                                                            : thumb ? (
                                                                <div className="relative group inline-block">
                                                                    <DriveImg src={thumb} fileId={coverFileId(rowPartNo)} size={400} alt={rowPartNo}
                                                                        onClick={() => setLightbox({ partNo: rowPartNo, fileId: coverFileId(rowPartNo), src: imgSrcFor(rowPartNo, 1600) })}
                                                                        className="w-10 h-10 object-cover rounded border cursor-zoom-in mx-auto" />
                                                                    <button onClick={() => pickImageFor(rowPartNo)} title="เพิ่มรูป"
                                                                        className="absolute -top-1 -right-1 bg-blue-600 text-white rounded-full w-4 h-4 text-[8px] opacity-0 group-hover:opacity-100 transition flex items-center justify-center"><i className="fa-solid fa-plus"></i></button>
                                                                </div>
                                                            ) : (
                                                                <button onClick={() => pickImageFor(rowPartNo)} title="อัปโหลดรูป"
                                                                    className="w-10 h-10 rounded border border-dashed border-slate-300 text-slate-300 hover:text-blue-500 hover:border-blue-400 mx-auto flex items-center justify-center"><i className="fa-solid fa-camera"></i></button>
                                                            )}
                                                        </td>
                                                        {row.map((c, ci) => {
                                                            const isName = ci===nameCol && rowPartNo;
                                                            return (
                                                            <td key={ci}
                                                                className={`p-2 border-r max-w-[150px]
                                                                ${ci===pNoCol?'bg-blue-50 text-blue-700 font-bold truncate':''}
                                                                ${ci===qtyCol?'bg-sky-50 text-sky-700 font-bold truncate':''}
                                                                ${isName?'bg-emerald-50 p-0 overflow-hidden':'truncate'}
                                                            `}>{isName ? (
                                                                <button type="button"
                                                                    onClick={() => setNamePopup({ partNo: rowPartNo, name: String(c||"") })}
                                                                    title="กดเพื่อถ่ายรูป / จัดการรูปพาร์ทนี้"
                                                                    className="w-full h-full text-left px-2 py-2 text-emerald-700 font-medium active:bg-emerald-100 hover:underline flex items-center gap-1 min-w-0">
                                                                    <i className="fa-solid fa-camera text-emerald-400 text-[10px] shrink-0"></i>
                                                                    <span className="truncate">{c}</span>
                                                                </button>
                                                            ) : c}</td>
                                                            );
                                                        })}
                                                    </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="mt-4 text-xs text-slate-500 flex gap-4">
                                        <span>Part No: <b className="text-blue-600">{pNoCol}</b></span>
                                        <span>Name: <b className="text-emerald-600">{nameCol}</b></span>
                                        <span>Qty: <b className="text-sky-600">{qtyCol}</b></span>

                        </div>
                    )}

                    {step === 2 && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border">

                                 <button onClick={()=>setMode('plan')} className={`pb-2 px-2 text-sm font-bold whitespace-nowrap transition ${mode==='plan'?'border-b-2 border-blue-600 text-blue-600':'text-slate-400 hover:text-slate-600'}`}><Icons.Production className="mr-1"/> Production Plan</button>
                                 <button onClick={()=>setMode('compare')} className={`pb-2 px-2 text-sm font-bold whitespace-nowrap transition ${mode==='compare'?'border-b-2 border-purple-600 text-purple-600':'text-slate-400 hover:text-slate-600'}`}><Icons.Compare className="mr-1"/> BOM Compare</button>
                             </div>
                            
                            {mode === 'plan' && (
                                <>
                                    <textarea value={orderText} onChange={e=>setOrderText(e.target.value)} className="w-full h-40 p-4 border rounded-xl font-mono text-sm mb-4 outline-none focus:ring-2 focus:ring-blue-100" placeholder="ModelA 100&#10;ModelB 50"></textarea>
                                    <button onClick={handlePreCalculate} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2">
                                        <Icons.Check/> Check & Calculate
                                    </button>
                                </>
                            )}
                            
                            {mode === 'compare' && (
                                <>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                                        {compareList.map((m, i) => (
                                            <div key={i}>
                                                <label className="text-xs font-bold text-purple-500">Model {i+1}</label>
                                                <select value={m} onChange={e=>{const l=[...compareList]; l[i]=e.target.value; setCompareList(l);}} className="w-full p-2 border rounded">
                                                    <option value="">-- Select --</option>
                                                    {sheetNames.map(s=><option key={s} value={s}>{s}</option>)}
                                                </select>
                                            </div>
                                        ))}
                                        <button onClick={()=>setCompareList([...compareList, ""])} className="mt-6 border border-dashed rounded text-purple-500 hover:bg-purple-50"><Icons.Plus/></button>

                                    <button onClick={handleCompare} className="w-full bg-purple-600 text-white py-3 rounded-xl font-bold">Compare</button>
                                    {compResult && (
                                      <div className="mt-6">
                                        <div className="flex justify-end gap-2 mb-2">
                                            <button onClick={exportCompareExcel} className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 hover:bg-emerald-700"><i className="fa-solid fa-file-excel"></i> Excel</button>
                                            <button onClick={exportComparePDF} className="bg-red-500 text-white px-3 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1 hover:bg-red-600"><i className="fa-solid fa-file-pdf"></i> PDF</button>

                                                <th className="p-3 border hover:bg-slate-100" onClick={()=>requestSort('name')}>Description {sortConfig.key==='name' && <Icons.Sort/>}</th>
                                                <th className="p-3 border hover:bg-slate-100" onClick={()=>requestSort('type')}>Type {sortConfig.key==='type' && <Icons.Sort/>}</th>

                    "Part No": it.partNo,

                    "Used In (Model)": it.model,
                    "Qty/Unit": it.qtyPerUnit == null ? "-" : it.qtyPerUnit,

                exportToExcel(data, "Part_Cart", "Parts");
            };

                const data = partSearchResults.map(it => ({
                    "Part No": it.partNo,
                    "Name": it.name,
                    "แหล่ง": it.source,
                    "Used In (Model)": it.model,
                    "Qty": it.qty == null ? "-" : it.qty,
                    "Type": it.type,
                    "รายละเอียด": extrasText(it.extras),
                    "รูป (ลิงก์)": driveViewLink(partImages, it.partNo)
                }));
                exportToExcel(data, "Part_Search", "Search");
            };

                    const fid = partFileId(partImages, it.partNo);
                    return [fid ? { imgId: fid } : "", it.partNo, it.name, it.source, it.model,

                                                                        <span key={s} className="text-[10px] text-slate-400" title="พาร์ทเลขเดียวกันนี้มีข้อมูลจากอีกแหล่งด้วย — กรองดูได้จากปุ่มด้านบน">
                                                                            <i className="fa-solid fa-link text-[9px] mr-1"></i>มีใน {s} ด้วย
                                                                        </span>
                                                                    ))}
                                                                    {hasExtras && (
                                                                        <button type="button" onClick={() => toggleRow(rowKey)}
                                                                            className="text-[10px] font-bold text-amber-600 hover:text-amber-700">
                                                                            <i className={`fa-solid ${isOpen ? 'fa-chevron-up' : 'fa-chevron-down'} text-[9px] mr-1`}></i>
                                                                            {isOpen ? "ซ่อนข้อมูลงานผลิต" : "ดูข้อมูลงานผลิต"}

                                                        </td>
