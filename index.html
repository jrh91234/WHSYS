<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Factory BOM - Cloud Edition</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f1f5f9; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); }
        
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; border: 2px solid #f1f5f9; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #3498db; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .resizer { position: absolute; right: 0; top: 0; height: 100%; width: 5px; background: rgba(0, 0, 0, 0.05); cursor: col-resize; user-select: none; touch-action: none; z-index: 20; }
        .resizer:hover, .resizing { background: #3b82f6; width: 4px; }

        .sidebar-link { transition: all 0.2s; }
        .sidebar-link:hover, .sidebar-link.active { background-color: #1e293b; color: white; transform: translateX(5px); }
        
        /* Safe area for mobile bottom nav */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;
            const apiUrl = 'https://script.google.com/macros/s/AKfycbySTjMR2ib4HIBwHmJ0oKR9eVDlKEaR362AqjgBnCd3m-RTPYZ5fdZ7DXZqERSZrtWa8A/exec';
        // --- Configuration ---
        const STORAGE_KEY_INV = "nlc_erp_inventory";
        const STORAGE_KEY_TRANS = "nlc_erp_transactions";
        const STORAGE_KEY_API_URL = "nlc_erp_api_url";
        const STORAGE_KEY_USERS = "nlc_erp_users";
        const STORAGE_KEY_SESSION = "nlc_erp_session"; 
        const STORAGE_KEY_BOM_DATA = "nlc_erp_bom_data";
        const STORAGE_KEY_BOM_VERSION = "nlc_erp_bom_version";
        const STORAGE_KEY_DEPT_DATA = "nlc_erp_dept_data";
        const STORAGE_KEY_DEPT_CONFIG = "nlc_erp_dept_config";
        const STORAGE_KEY_PART_IMAGES = "nlc_erp_part_images";
        const STORAGE_KEY_PART_CART = "nlc_erp_part_cart";

        // สร้าง URL รูป thumbnail จาก Google Drive fileId (ไฟล์ต้องตั้งแชร์ "ใครมีลิงก์ดูได้")
        const driveThumb = (fileId, size = 400) => fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w${size}` : "";

        // ลิงก์เปิดดูรูปใน Drive (สำหรับใส่ในไฟล์ Excel/PDF ที่ export) — ใช้รูปแรก (cover) ของพาร์ท
        const driveViewLink = (partImages, partNo) => {
            const fid = (partImages[String(partNo || "").trim()] || [])[0]?.fileId;
            return fid ? `https://drive.google.com/file/d/${fid}/view` : "";
        };
        const partFileId = (partImages, partNo) => (partImages[String(partNo || "").trim()] || [])[0]?.fileId || "";

        // แปลงข้อมูลรูปพาร์ทให้เป็นรูปแบบใหม่ (partNo -> [รูป, ...]) เสมอ
        // กันแอปพังจากข้อมูลรุ่นเก่า (partNo -> รูปเดียว) ที่ค้างใน localStorage หรือมาจาก backend ที่ยังไม่ได้ deploy ใหม่
        const normalizePartImages = (raw) => {
            const out = {};
            Object.keys(raw || {}).forEach(p => {
                const v = raw[p];
                if (Array.isArray(v)) { if (v.length) out[p] = v.filter(img => img && img.fileId); }
                else if (v && v.fileId) out[p] = [v]; // รูปแบบเก่า: object รูปเดียว -> ห่อเป็น array
            });
            return out;
        };

        // <img> สำหรับรูป Drive ที่ทนต่อการโหลดพร้อมกันหลายรูป (rate-limit):
        // ใช้ lh3.googleusercontent.com เป็นหลัก (เร็ว/โดน throttle น้อย) → ถ้าพลาด fallback ไป
        // drive.google.com/thumbnail → ถ้ายังพลาดอีกให้ลองซ้ำแบบหน่วงเวลา (สูงสุด 3 ครั้ง)
        // ถ้า src เป็น data: (รูปที่เพิ่งอัป) จะใช้ตรง ๆ ไม่ผ่าน fallback
        const DriveImg = ({ src, fileId, size = 400, alt, className, onClick }) => {
            const isData = !!src && src.startsWith('data:');
            const chain = fileId ? [
                `https://lh3.googleusercontent.com/d/${fileId}=w${size}`,
                `https://drive.google.com/thumbnail?id=${fileId}&sz=w${size}`,
            ] : (src ? [src] : []);
            const [idx, setIdx] = useState(0);
            const [bust, setBust] = useState(0);
            const tries = useRef(0);
            useEffect(() => { setIdx(0); setBust(0); tries.current = 0; }, [fileId, src, size]);

            if (isData) return <img src={src} alt={alt} className={className} onClick={onClick} />;
            if (chain.length === 0) return null;

            const base = chain[Math.min(idx, chain.length - 1)];
            const cur = bust ? base + (base.includes('?') ? '&' : '?') + 'r=' + bust : base;
            const handleError = () => {
                if (idx < chain.length - 1) { setIdx(idx + 1); return; }
                if (tries.current < 3) { tries.current++; setTimeout(() => { setIdx(0); setBust(Date.now()); }, 500 * tries.current); }
            };
            return <img src={cur} alt={alt} className={className} loading="lazy" referrerPolicy="no-referrer" onClick={onClick} onError={handleError} />;
        };

        // ===== ค้นหาด้วยรูป (Visual Search) — TensorFlow.js + MobileNet (โหลดตอนใช้งานเท่านั้น) =====
        let __visionModel = null;
        let __visionModelReady = null; // ตัวโมเดลที่พร้อมใช้ล่าสุด (ค่าจริง ไม่ใช่ promise) — ใช้แทนตัวเก่าที่ตายไปหลังกู้ GPU
        const loadVisionModel = () => {
            if (__visionModel) return __visionModel;
            const loadScript = (src) => new Promise((res, rej) => {
                const s = document.createElement('script');
                s.src = src; s.async = true;
                s.onload = () => res();
                s.onerror = () => rej(new Error('โหลดสคริปต์ AI ไม่สำเร็จ (ตรวจอินเทอร์เน็ต): ' + src));
                document.head.appendChild(s);
            });
            __visionModel = (async () => {
                if (!window.tf) await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');
                if (!window.mobilenet) await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');
                const m = await window.mobilenet.load({ version: 2, alpha: 1.0 });
                __visionModelReady = m;
                return m;
            })().catch((e) => { __visionModel = null; throw e; });
            return __visionModel;
        };
        // GPU บางเครื่อง (โดยเฉพาะมือถือ) พังกลางคันเมื่อหน่วยความจำตึง: "Failed to link vertex and fragment shaders" /
        // "WebGL context lost" — พอพังแล้วจะพังทุกครั้งจนกว่าจะรีเฟรชหน้า ทางกู้คือสลับไปประมวลผลด้วย CPU (ช้าลงแต่ไม่ล้ม)
        // แล้วโหลดโมเดลใหม่ เพราะ weight ชุดเก่าค้างอยู่ในหน่วยความจำ GPU ที่ตายไปแล้ว
        const isGpuGlitch = (e) => /shader|webgl|context|framebuffer|texture/i.test(String((e && e.message) || e));
        let __gpuRecovering = null; // กันหลาย embed ที่พังพร้อมกันแย่งกันกู้ซ้ำซ้อน — กู้รอบเดียวแล้วใช้ร่วมกัน
        const recoverVisionModel = () => {
            if (__gpuRecovering) return __gpuRecovering;
            __gpuRecovering = (async () => {
                console.log("GPU glitch — switching TF.js to CPU backend");
                try { await window.tf.setBackend('cpu'); await window.tf.ready(); } catch (e) { console.log("setBackend cpu failed", e); }
                __visionModel = null; __visionModelReady = null;
                return await loadVisionModel(); // โหลดโมเดลใหม่บน backend ใหม่ (ไฟล์ติด cache เบราว์เซอร์อยู่แล้ว ไม่ช้า)
            })().finally(() => { __gpuRecovering = null; });
            return __gpuRecovering;
        };
        const l2normalize = (v) => {
            let s = 0; for (let i = 0; i < v.length; i++) s += v[i] * v[i];
            s = Math.sqrt(s) || 1;
            const o = new Float32Array(v.length);
            for (let i = 0; i < v.length; i++) o[i] = v[i] / s;
            return o;
        };
        const embedOnce = async (model, imgEl) => {
            const t = model.infer(imgEl, true); // embedding vector
            const data = await t.data();
            if (t.dispose) t.dispose();
            return l2normalize(Float32Array.from(data));
        };
        const embedImageEl = async (model, imgEl) => {
            // ใช้โมเดลตัวล่าสุดเสมอ — ตัวที่ผู้เรียกถืออยู่อาจเป็นตัวเก่าที่ตายไปแล้วหลังการกู้ GPU รอบก่อน
            try {
                return await embedOnce(__visionModelReady || model, imgEl);
            } catch (e) {
                if (!isGpuGlitch(e)) throw e;
                const fresh = await recoverVisionModel(); // GPU พัง → สลับ CPU + โหลดโมเดลใหม่ แล้วลองซ้ำอีกครั้งเดียว
                return await embedOnce(fresh, imgEl);
            }
        };
        // เก็บเวกเตอร์แบบ int8 (quantize) → base64 เพื่อประหยัดพื้นที่ในชีต
        const embToB64 = (vec) => {
            const q = new Int8Array(vec.length);
            for (let i = 0; i < vec.length; i++) { let x = Math.round(vec[i] * 127); q[i] = x > 127 ? 127 : (x < -127 ? -127 : x); }
            const bytes = new Uint8Array(q.buffer);
            let bin = ''; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin);
        };
        const b64ToEmb = (str) => {
            try {
                const bin = atob(str);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const q = new Int8Array(bytes.buffer);
                const o = new Float32Array(q.length);
                for (let i = 0; i < q.length; i++) o[i] = q[i] / 127;
                return o;
            } catch (e) { return null; }
        };
        const cosineSim = (a, b) => { let s = 0; const n = Math.min(a.length, b.length); for (let i = 0; i < n; i++) s += a[i] * b[i]; return s; };

        // ===== เวกเตอร์กลางภาพ (center crop) — ลดผลของพื้นหลังที่ MobileNet เอามาคำนวณทั้งเฟรม =====
        // ตัดเฉพาะบริเวณกลางภาพ (ซึ่งเกือบแน่ว่าเป็นตัวพาร์ท ไม่ใช่โต๊ะ/พื้น) มาทำเวกเตอร์คู่กับเวกเตอร์เต็มภาพ
        const CENTER_CROP_RATIO = 0.6;
        const centerCropCanvas = (imgEl, size = 224) => {
            const W = imgEl.naturalWidth || imgEl.width, H = imgEl.naturalHeight || imgEl.height;
            const w = Math.round(W * CENTER_CROP_RATIO), h = Math.round(H * CENTER_CROP_RATIO);
            const c = document.createElement('canvas'); c.width = size; c.height = size;
            c.getContext('2d').drawImage(imgEl, Math.floor((W - w) / 2), Math.floor((H - h) / 2), w, h, 0, 0, size, size);
            return c;
        };

        // ===== ลายเซ็นสีของพาร์ท (color histogram) — MobileNet ถูกฝึกมาให้แทบไม่สนสี พาร์ททรงเดียวกันคนละสีจึงแยกไม่ออก =====
        // เก็บการกระจายโทนสีจากกลางภาพ: 18 ช่องตามเฉดสี (hue) สำหรับพิกเซลมีสี + 6 ช่องตามความสว่างสำหรับพิกเซลเทา/ขาว/ดำ
        const COLOR_HUE_BINS = 18, COLOR_GRAY_BINS = 6;
        const colorHistFromImage = (imgEl) => {
            try {
                const c = centerCropCanvas(imgEl, 64);
                const ctx = c.getContext('2d', { willReadFrequently: true });
                const d = ctx.getImageData(0, 0, 64, 64).data;
                const hist = new Float32Array(COLOR_HUE_BINS + COLOR_GRAY_BINS);
                let count = 0;
                for (let j = 0; j < d.length; j += 4) {
                    const r = d[j] / 255, g = d[j + 1] / 255, b = d[j + 2] / 255;
                    const max = Math.max(r, g, b), min = Math.min(r, g, b);
                    const v = max, s = max ? (max - min) / max : 0;
                    if (s < 0.22 || v < 0.15) {
                        // พิกเซลแทบไม่มีสี (เทา/ขาว/ดำ/โลหะ) — แยกตามความสว่างแทน จะได้แยกพาร์ทดำกับพาร์ทขาวออก
                        hist[COLOR_HUE_BINS + Math.min(COLOR_GRAY_BINS - 1, Math.floor(v * COLOR_GRAY_BINS))]++;
                    } else {
                        let hue;
                        if (max === r) hue = ((g - b) / (max - min)) % 6;
                        else if (max === g) hue = (b - r) / (max - min) + 2;
                        else hue = (r - g) / (max - min) + 4;
                        hue = (hue * 60 + 360) % 360;
                        hist[Math.floor(hue / 360 * COLOR_HUE_BINS) % COLOR_HUE_BINS]++;
                    }
                    count++;
                }
                for (let i = 0; i < hist.length; i++) hist[i] /= (count || 1);
                return hist;
            } catch (e) { return null; } // อ่านสีไม่ได้ = ไม่ใช้สัญญาณสี ไม่กระทบคะแนนหลัก
        };
        // ความคล้ายของ histogram 2 อัน (histogram intersection): 1 = การกระจายสีเหมือนกันเป๊ะ, 0 = ไม่ทับกันเลย
        const histSim = (a, b) => { let s = 0; const n = Math.min(a.length, b.length); for (let i = 0; i < n; i++) s += Math.min(a[i], b[i]); return s; };
        const histToB64 = (h) => {
            const q = new Uint8Array(h.length);
            for (let i = 0; i < h.length; i++) { const x = Math.round(h[i] * 255); q[i] = x > 255 ? 255 : (x < 0 ? 0 : x); }
            let bin = ''; for (let i = 0; i < q.length; i++) bin += String.fromCharCode(q[i]);
            return btoa(bin);
        };
        const b64ToHist = (str) => {
            try {
                const bin = atob(str);
                const o = new Float32Array(bin.length);
                for (let i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i) / 255;
                return o;
            } catch (e) { return null; }
        };
        // แพ็คข้อมูลดัชนีของรูป 1 รูปลงช่องเดียวในชีต (คอลัมน์ Embedding เดิม ไม่ต้องแก้ backend):
        // "v2|<เต็มภาพ>|<กลางภาพ>|<ลายเซ็นสี>|<patch มุม 4 ตัว>" — ตัวคั่น | ไม่ชนกับ base64
        // v1 (ไม่มี patch) และค่าเก่าที่ไม่มี | ยังอ่านได้ตามเดิม — patch ที่ขาดจะถูกเติมโดยงานอัปเกรดดัชนีเบื้องหลัง
        const packEmbedding = (vec, centerVec, hist, patches) =>
            ["v2", embToB64(vec), embToB64(centerVec), hist ? histToB64(hist) : "", ...(patches || []).map(embToB64)].join("|");
        const unpackEmbedding = (str) => {
            const s = String(str || "");
            if (s.startsWith("v2|") || s.startsWith("v1|")) {
                const parts = s.split("|");
                const patches = parts.slice(4).map(b64ToEmb).filter(Boolean);
                return {
                    vector: b64ToEmb(parts[1]),
                    centerVec: parts[2] ? b64ToEmb(parts[2]) : null,
                    colorHist: parts[3] ? b64ToHist(parts[3]) : null,
                    patches: patches.length === 4 ? patches : null
                };
            }
            return { vector: b64ToEmb(s), centerVec: null, colorHist: null, patches: null };
        };

        // ===== แคชดัชนีในเครื่อง (IndexedDB) — ดัชนีใหญ่ขึ้นมากหลังเก็บ patch (รูปละ ~10KB) โหลดจาก cloud ทุกครั้งช้าโดยเฉพาะมือถือ =====
        // เปิดหน้ามาใช้แคชได้ทันที แล้วค่อยดึงของสดจาก cloud เบื้องหลังครั้งเดียวต่อการเปิดเว็บ (stale-while-revalidate)
        // ใช้ IndexedDB ไม่ใช่ localStorage เพราะเก็บ Float32Array/Set ตรง ๆ ได้ (ไม่ต้องแปลงซ้ำ) และไม่ติดเพดาน ~5MB
        const VS_CACHE_DB = 'whsys_vs_cache', VS_CACHE_KEY = 'index';
        const vsCacheOpen = () => new Promise((res, rej) => {
            const r = indexedDB.open(VS_CACHE_DB, 1);
            r.onupgradeneeded = () => r.result.createObjectStore('kv');
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error);
        });
        const vsCacheGet = async () => {
            let db = null;
            try {
                db = await vsCacheOpen();
                return await new Promise((res, rej) => {
                    const t = db.transaction('kv').objectStore('kv').get(VS_CACHE_KEY);
                    t.onsuccess = () => res(t.result || null);
                    t.onerror = () => rej(t.error);
                });
            } catch (e) { return null; } // เครื่องที่ใช้ IndexedDB ไม่ได้ (เช่น private mode เก่า ๆ) = โหลดจาก cloud ตามเดิม
            finally { if (db) db.close(); } // ปิดทุกครั้ง — เปิดทิ้งไว้สะสมจะช้าและบล็อกการอัปเวอร์ชัน db ในอนาคต
        };
        const vsCachePut = async (data) => {
            let db = null;
            try {
                db = await vsCacheOpen();
                await new Promise((res, rej) => {
                    const t = db.transaction('kv', 'readwrite').objectStore('kv').put(data, VS_CACHE_KEY);
                    t.onsuccess = res;
                    t.onerror = () => rej(t.error);
                });
            } catch (e) { console.log("vs cache put failed", e); }
            finally { if (db) db.close(); }
        };
        let __vsRevalidated = false; // ดึงของสดจาก cloud แค่ครั้งเดียวต่อการเปิดเว็บ — สลับหน้าไปมาไม่โหลดก้อนใหญ่ซ้ำ

        // ===== ตรวจรายละเอียดเชิงลึก (patch embedding) — ใช้ตอนคะแนนสูสี แยกพาร์ทที่ต่างกันแค่จุดเล็ก ๆ เช่น จำนวนรู =====
        // MobileNet ทั้งภาพจะเฉลี่ยรายละเอียดเล็ก ๆ ทิ้ง — หั่นรูปเป็น 4 มุม แล้ว embed แยกทีละส่วน (ส่วนกลางภาพใช้เวกเตอร์ centerCrop ที่มีอยู่แล้ว)
        // รูที่หายไป 1 รูจะโผล่เป็นความต่างชัด ๆ ในส่วนนั้น แทนที่จะจมหายไปในค่าเฉลี่ยทั้งภาพ
        // คำนวณล่วงหน้าตอนทำดัชนีแล้วเก็บลงชีต — ตอนค้นหาจึงเทียบได้ทันทีไม่ต้องดึงรูป/ประมวลผลซ้ำ
        const embedImagePatches = async (model, imgEl) => {
            const W = imgEl.naturalWidth || imgEl.width, H = imgEl.naturalHeight || imgEl.height;
            const hw = Math.floor(W / 2), hh = Math.floor(H / 2);
            const regions = [
                [0, 0, hw, hh], [W - hw, 0, hw, hh],                     // บนซ้าย, บนขวา
                [0, H - hh, hw, hh], [W - hw, H - hh, hw, hh]            // ล่างซ้าย, ล่างขวา
            ];
            const c = document.createElement('canvas'); c.width = 224; c.height = 224;
            const ctx = c.getContext('2d');
            const out = [];
            for (const [sx, sy, sw, sh] of regions) {
                ctx.clearRect(0, 0, 224, 224);
                ctx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, 224, 224);
                out.push(await embedImageEl(model, c));
            }
            return out;
        };
        // ความคล้ายระหว่างชุด patch 2 ชุด แบบจับคู่ที่ดีที่สุด (ทนต่อการถ่ายเยื้องตำแหน่งกันเล็กน้อย):
        // แต่ละ patch ฝั่งหนึ่งหาคู่ที่เหมือนสุดจากอีกฝั่ง แล้วเฉลี่ยทั้ง 2 ทิศ — ถ้ามี patch ที่หาคู่ดี ๆ ไม่ได้ (รายละเอียดต่างกัน) ค่าเฉลี่ยจะตกลงชัดเจน
        const patchSetSim = (A, B) => {
            const oneWay = (X, Y) => X.reduce((s, x) => s + Math.max(...Y.map(y => cosineSim(x, y))), 0) / X.length;
            return (oneWay(A, B) + oneWay(B, A)) / 2;
        };

        // ===== เช็คเร็ว ๆ ว่ารูป "น่าจะมีตัวหนังสือ" ไหม — ไว้ข้ามการส่ง OCR (ประหยัดเวลารอ + โควต้า) =====
        // หลักการ: cell ที่มีตัวหนังสือต่างจาก cell ที่แค่มีขอบวัตถุพาดผ่าน 3 อย่าง —
        //   (1) ขอบคมหนาแน่นมาก (ลายเส้นตัวอักษรถี่ทุก 2-3 พิกเซล ไม่ใช่เส้นเดียว)
        //   (2) ขอบมีทั้งแนวนอนและแนวตั้งปนกัน (ตัวอักษรมีเส้นทุกทิศ — ขอบพาร์ท/เงาเป็นเส้นตรงทิศเดียว)
        //   (3) เจอ cell แบบนี้หลาย cell (ข้อความจริงกินพื้นที่กว้างกว่า 16px เสมอ)
        // เกณฑ์ยังเอียงข้าง "เผื่อไว้": ผิวลายถี่ ๆ (knurling/ตะแกรง) อาจหลอกให้ตอบ "มี" ได้ = แค่เสีย OCR หนึ่งรอบเท่าพฤติกรรมเดิม
        // เกณฑ์ทั้งหมดปรับได้จากหน้า "ตั้งค่าค้นหาด้วยรูป" (admin) — ค่าอยู่ใน VS_TUNE (textContrast/textDensity/textBalance/textCells)
        const mightContainText = (imgEl) => {
            try {
                const W = 256;
                const srcW = imgEl.naturalWidth || imgEl.width || W;
                const srcH = imgEl.naturalHeight || imgEl.height || W;
                const H = Math.max(32, Math.round(srcH * W / srcW));
                const c = document.createElement('canvas'); c.width = W; c.height = H;
                const ctx = c.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(imgEl, 0, 0, W, H);
                const d = ctx.getImageData(0, 0, W, H).data;
                const g = new Float32Array(W * H);
                for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2];
                const cell = 16, cols = Math.floor(W / cell), rows = Math.floor(H / cell);
                let busyCells = 0;
                for (let cy = 0; cy < rows; cy++) {
                    for (let cx = 0; cx < cols; cx++) {
                        let edges = 0, hEdges = 0, vEdges = 0;
                        for (let y = cy * cell; y < (cy + 1) * cell - 1; y++) {
                            for (let x = cx * cell; x < (cx + 1) * cell - 1; x++) {
                                const i = y * W + x;
                                const h = Math.abs(g[i] - g[i + 1]) > VS_TUNE.textContrast;
                                const v = Math.abs(g[i] - g[i + W]) > VS_TUNE.textContrast;
                                if (h) hEdges++;
                                if (v) vEdges++;
                                if (h || v) edges++;
                            }
                        }
                        if (edges / (cell * cell) >= VS_TUNE.textDensity &&
                            Math.min(hEdges, vEdges) >= VS_TUNE.textBalance * (hEdges + vEdges)) {
                            busyCells++;
                            if (busyCells >= VS_TUNE.textCells) return true;
                        }
                    }
                }
                return false;
            } catch (e) { return true; } // เช็คไม่ได้ (เช่น canvas ใช้ไม่ได้) = ถือว่ามี ส่ง OCR ตามเดิม ไม่เสียความแม่นยำ
        };
        const fileToImageEl = (file) => new Promise((res, rej) => {
            const r = new FileReader();
            r.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้'));
            r.onload = (e) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error('รูปเสียหาย')); img.src = e.target.result; };
            r.readAsDataURL(file);
        });
        const dataUrlToImageEl = (u) => new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error('รูปเสียหาย')); img.src = u; });

        // ===== เทียบตัวหนังสือ/label บนพาร์ท (จาก OCR) — เสริมการเทียบหน้าตารูปของ MobileNet ที่อ่านตัวหนังสือไม่ได้ =====
        // แตกข้อความ OCR เป็นคำ ๆ (token) แบบหยาบ: ตัวพิมพ์เล็กทั้งหมด เก็บเฉพาะ a-z/0-9/ไทย ยาวอย่างน้อย 2 ตัวอักษร
        const ocrTokens = (text) => {
            const m = String(text || "").toLowerCase().match(/[a-z0-9฀-๿]{2,}/g);
            return new Set(m || []);
        };
        // ความคล้ายของข้อความ 2 ชุดแบบ Dice coefficient (0-1) — 0 ถ้าฝั่งใดฝั่งหนึ่งไม่มีตัวหนังสือเลย
        const ocrTextSim = (tokensA, tokensB) => {
            if (!tokensA.size || !tokensB.size) return 0;
            let inter = 0;
            tokensA.forEach(t => { if (tokensB.has(t)) inter++; });
            return (2 * inter) / (tokensA.size + tokensB.size);
        };
        // อ่านตัวหนังสือในรูปผ่าน backend (Google Drive OCR) — คืน "" ถ้าอ่านไม่ได้/ล้มเหลว ไม่โยน error กัน flow หลักพัง
        const ocrImageB64 = async (apiUrl, base64, mimeType = "image/jpeg") => {
            if (!apiUrl || !base64) return "";
            try {
                const res = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "ocr_image", imageData: base64, mimeType })
                });
                const json = await res.json();
                return json.status === "success" ? String(json.text || "").trim() : "";
            } catch (e) { console.log("ocr failed", e); return ""; }
        };

        const DEFAULT_API_URL ="https://script.google.com/macros/s/AKfycby923XbLtP0TxMmKNG1JyhmtZeMNNALNCCJLXWr1GI70NYH0h7AI27c7yP2-L3h9Ne_zQ/exec"; 
        
        const INITIAL_INVENTORY = [
            { partNo: "DEMO-001", name: "สินค้าตัวอย่าง (กำลังเชื่อมต่อ Cloud...)", qty: 0, location: "-", unit: "PCS", minStock: 0 }
        ];

        const INITIAL_USERS = [
            { id: 1, username: 'admin', password: '1111', name: 'Administrator', role: 'ADMIN' }
        ];

        // toLocaleString() ตัดทศนิยมเหลือ 3 ตำแหน่งโดยปริยาย ทำให้ Qty/Unit ที่ละเอียดกว่านั้น
        // (เช่น 0.000125) ถูกปัดจนเพี้ยนหรือกลายเป็น 0 — บังคับให้แสดงได้ถึง 6 ตำแหน่ง
        const formatNum = (n) => typeof n === 'number' ? n.toLocaleString(undefined, { maximumFractionDigits: 6 }) : "0";

        // Part No ที่พิมพ์มาจาก Excel มักมีขยะที่มองไม่เห็นติดมา: non-breaking space ( ),
        // zero-width space, ขึ้นบรรทัดใหม่ท้ายเซลล์ — .trim() เฉย ๆ ไม่กินตัวพวกนี้ ทำให้พิมพ์เลขที่ถูกต้องแล้วหาไม่เจอ
        // cleanPartNo = ใช้ "แสดงผล/เก็บ" (คงตัวพิมพ์เล็กใหญ่เดิม), normPartNo = ใช้ "เทียบ/จับคู่" (ตัดขยะ + uppercase)
        const cleanPartNo = (v) => String(v == null ? "" : v)
            .replace(/[\u00A0\u200B-\u200D\uFEFF]/g, " ")
            .replace(/\s+/g, " ")
            .trim();
        const normPartNo = (v) => cleanPartNo(v).replace(/\s/g, "").toUpperCase();

        // ข้อความหลายบรรทัดในเซลล์ Excel (เช่น Tooling No. หลายตัว) → บรรทัดเดียวคั่นด้วย comma
        const cleanCell = (v) => String(v == null ? "" : v)
            .replace(/[\u00A0\u200B-\u200D\uFEFF]/g, " ")
            .replace(/\s*\n\s*/g, ", ")
            .replace(/\s+/g, " ")
            .trim();

        // ===== แหล่งข้อมูลพาร์ทแยกแผนก =====
        // ชีท DEPT_<แผนก> ในสเปรดชีตเดียวกัน ไม่ใช่ BOM ของสินค้า (ไม่มี Qty/Unit ไม่เข้าการระเบิด BOM ในหน้า MRP)
        // แต่ค้นหารวมกับ BOM ได้ในหน้า "ค้นหาพาร์ท" — ผังคอลัมน์ของแต่ละแผนกมาจากชีท SheetConfig
        const DEPT_SHEET_PREFIX = "DEPT_";
        // ผังสำรอง ใช้เมื่อยังไม่มีแถวของแผนกนั้นใน SheetConfig (ตรงกับไฟล์ Part List ของแผนก Stamping)
        const DEPT_COLS_DEFAULT = {
            pNoCol: 3, nameCol: 2, modelCol: 1, typeCol: 9,
            extras: [
                { col: 5, label: "Spec" },
                { col: 6, label: "ขนาด (หนา*กว้าง*ยาว)" },
                { col: 7, label: "Step" },
                { col: 8, label: "Tooling No." },
                { col: 10, label: "เครื่อง/Machine" }
            ]
        };
        // รวมฟิลด์เสริมของแผนกเป็นข้อความบรรทัดเดียว ใช้ตอน export Excel/PDF
        const extrasText = (extras) => (extras || []).map(e => `${e.label}: ${e.value}`).join(" | ");

        const deptColsOf = (deptConfig, deptName) => {
            const cfg = (deptConfig || {})[deptName];
            if (!cfg || !(cfg.pNoCol >= 0)) return { label: deptName, ...DEPT_COLS_DEFAULT };
            return { label: cfg.label || deptName, ...cfg, extras: cfg.extras || [] };
        };

        // แปลงชีทของแผนกเป็นรายการพาร์ทหน้าตาเดียวกับผลค้นหา BOM (บวกฟิลด์ extras ของงานแผนกนั้น)
        const deptPartRows = (deptData, deptConfig) => {
            const out = [];
            Object.keys(deptData || {}).forEach(deptName => {
                const cols = deptColsOf(deptConfig, deptName);
                (deptData[deptName] || []).slice(1).forEach(row => {
                    const partNo = cleanPartNo(row[cols.pNoCol]);
                    const name = cleanCell(row[cols.nameCol]);
                    if (!partNo && !name) return;
                    out.push({
                        partNo, name,
                        model: cleanCell(row[cols.modelCol]),
                        qty: null,                                   // ไม่ใช่ BOM สินค้า จึงไม่มี Qty/Unit
                        type: cleanCell(row[cols.typeCol]) || "-",
                        sourceKey: deptName,
                        source: cols.label,
                        extras: (cols.extras || [])
                            .map(e => ({ label: e.label, value: cleanCell(row[e.col]) }))
                            .filter(e => e.value)
                    });
                });
            });
            return out;
        };
        // พาร์ทที่โผล่อยู่ในรายการของแผนกผลิต = ของที่ผลิตเอง ไม่ใช่ของซื้อ
        // คืน map: เลขพาร์ทแบบ normalize -> ชื่อแผนกที่ผลิต (พาร์ทเดียวหลายแผนกได้)
        const makerDeptsOf = (deptData, deptConfig) => {
            const map = {};
            deptPartRows(deptData, deptConfig).forEach(it => {
                const key = normPartNo(it.partNo);
                if (!key) return;
                if (!map[key]) map[key] = [];
                if (!map[key].includes(it.source)) map[key].push(it.source);
            });
            return map;
        };

        // ===== ตรวจจับชีทแผนกที่ลืมตั้งชื่อขึ้นต้นด้วย DEPT_ =====
        // ระบบแยกแหล่งด้วยชื่อชีทล้วน ๆ ชีทที่ไม่ขึ้นต้นด้วย DEPT_ จะถูกนับเป็น "รุ่นสินค้า" ทันที
        // แล้วอ่านด้วยผังของ BOM (C=Part No) ซึ่งคนละช่องกับไฟล์แผนก (D=Part No) — ค้นเลขพาร์ทจึงไม่เจอ
        // และชื่อชีทจะไปโผล่ปนกับรุ่นสินค้าจริงในหน้า MRP โดยไม่มีใครรู้
        // ตรงนี้แค่ "เตือน" ไม่เดาแทนผู้ใช้ เพราะถ้าเดาผิดจะไปกระทบการระเบิด BOM ในหน้า MRP
        const DEPT_HEADER_STRONG = ["tooling", "picture", "รูป", "แม่พิมพ์"];  // BOM ของสินค้าแทบไม่มีคอลัมน์พวกนี้
        const DEPT_HEADER_WEAK = ["process", "step", "machine", "spec"];
        const BOM_HEADER_HINTS = ["qty", "quantity", "unit", "จำนวน", "หน่วย"];  // มีคอลัมน์พวกนี้ = BOM สินค้าจริง

        const looksLikeDeptSheet = (rows) => {
            const header = (rows || [])[0];
            if (!Array.isArray(header)) return false;
            const cells = header.map(c => cleanCell(c).toLowerCase()).filter(Boolean);
            if (!cells.length) return false;
            const hasAny = (hints) => hints.filter(h => cells.some(c => c.includes(h))).length;
            if (hasAny(BOM_HEADER_HINTS)) return false;
            // ต้องมีคอลัมน์เด่นของงานแผนกอย่างน้อย 1 และเข้าเค้ารวมกันอย่างน้อย 2 — กันเตือนมั่วใส่ BOM จริง
            return hasAny(DEPT_HEADER_STRONG) >= 1 &&
                   (hasAny(DEPT_HEADER_STRONG) + hasAny(DEPT_HEADER_WEAK)) >= 2;
        };

        const findMisnamedDeptSheets = (bomData) =>
            Object.keys(bomData || {}).filter(name => looksLikeDeptSheet(bomData[name]));

        const getStorage = (key, def) => {
            const saved = localStorage.getItem(key);
            try { return saved ? JSON.parse(saved) : def; } catch(e) { return def; }
        };
        const setStorage = (key, val) => localStorage.setItem(key, JSON.stringify(val));

        const exportToExcel = (data, fileName, sheetName = "Sheet1") => {
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, sheetName);
            XLSX.writeFile(wb, `${fileName}_${new Date().toISOString().slice(0,10)}.xlsx`);
        };

        // Export ตารางเป็น PDF ผ่านหน้าต่าง print ของเบราว์เซอร์ (รองรับภาษาไทยเต็มที่ ไม่ต้องใช้ไลบรารีเพิ่ม)
        const exportTableToPDF = (title, headers, rows) => {
            const esc = (s) => String(s ?? "").replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            // cell ที่เป็น { imgId: fileId } จะแสดงเป็นรูป (ลอง lh3 ก่อน ถ้าพลาด fallback ไป drive thumbnail)
            const cellHtml = (c) => {
                if (c && typeof c === 'object' && c.imgId) {
                    const id = esc(c.imgId);
                    return `<img src="https://lh3.googleusercontent.com/d/${id}=w200" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='https://drive.google.com/thumbnail?id=${id}&sz=w200';" style="width:56px;height:56px;object-fit:contain;border:1px solid #e2e8f0;border-radius:4px;">`;
                }
                return esc(c);
            };
            const thead = '<tr>' + headers.map(h => `<th>${esc(h)}</th>`).join('') + '</tr>';
            const tbody = rows.map(r => '<tr>' + r.map(c => `<td>${cellHtml(c)}</td>`).join('') + '</tr>').join('');
            const html = `<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>${esc(title)}</title>
                <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
                <style>
                    *{font-family:'Sarabun','TH Sarabun New',sans-serif;box-sizing:border-box;}
                    body{padding:24px;color:#1e293b;margin:0;}
                    h2{margin:0 0 4px;font-size:18px;} .sub{color:#64748b;font-size:12px;margin-bottom:16px;}
                    table{width:100%;border-collapse:collapse;font-size:12px;}
                    th,td{border:1px solid #cbd5e1;padding:6px 8px;text-align:left;vertical-align:top;}
                    thead th{background:#f1f5f9;}
                    tbody tr:nth-child(even) td{background:#f8fafc;}
                    @media print{@page{margin:12mm;}}
                </style></head><body>
                <h2>${esc(title)}</h2>
                <div class="sub">พิมพ์เมื่อ ${esc(new Date().toLocaleString('th-TH'))} · ${rows.length} รายการ</div>
                <table><thead>${thead}</thead><tbody>${tbody}</tbody></table>
                <scr` + `ipt>window.onload=function(){setTimeout(function(){window.print();},300);};</scr` + `ipt>
                </body></html>`;
            const w = window.open('', '_blank');
            if (!w) { alert('เบราว์เซอร์บล็อก popup — กรุณาอนุญาต popup ของเว็บนี้แล้วลองใหม่'); return; }
            w.document.write(html);
            w.document.close();
        };

        const Icons = {
            Dashboard: (p) => <i className={`fa-solid fa-chart-line ${p.className}`}></i>,
            Warehouse: (p) => <i className={`fa-solid fa-warehouse ${p.className}`}></i>,
            Production: (p) => <i className={`fa-solid fa-industry ${p.className}`}></i>,
            History: (p) => <i className={`fa-solid fa-clock-rotate-left ${p.className}`}></i>,
            Settings: (p) => <i className={`fa-solid fa-gear ${p.className}`}></i>,
            Plus: (p) => <i className={`fa-solid fa-plus ${p.className}`}></i>,
            Minus: (p) => <i className={`fa-solid fa-minus ${p.className}`}></i>,
            Save: (p) => <i className={`fa-solid fa-floppy-disk ${p.className}`}></i>,
            Warn: (p) => <i className={`fa-solid fa-triangle-exclamation ${p.className}`}></i>,
            Box: (p) => <i className={`fa-solid fa-box-open ${p.className}`}></i>,
            Excel: (p) => <i className={`fa-solid fa-file-excel ${p.className}`}></i>,
            Trash: (p) => <i className={`fa-solid fa-trash-can ${p.className}`}></i>,
            Cloud: (p) => <i className={`fa-solid fa-cloud ${p.className}`}></i>,
            Refresh: (p) => <i className={`fa-solid fa-rotate ${p.className}`}></i>,
            Wand: (p) => <i className={`fa-solid fa-wand-magic-sparkles ${p.className}`}></i>,
            Download: (p) => <i className={`fa-solid fa-download ${p.className}`}></i>,
            Search: (p) => <i className={`fa-solid fa-magnifying-glass ${p.className}`}></i>,
            Compare: (p) => <i className={`fa-solid fa-code-compare ${p.className}`}></i>,
            X: (p) => <i className={`fa-solid fa-xmark ${p.className}`}></i>,
            User: (p) => <i className={`fa-solid fa-user ${p.className}`}></i>,
            Users: (p) => <i className={`fa-solid fa-users ${p.className}`}></i>,
            Check: (p) => <i className={`fa-solid fa-check ${p.className}`}></i>,
            Sort: (p) => <i className={`fa-solid fa-sort ${p.className}`}></i>,
            Clipboard: (p) => <i className={`fa-solid fa-clipboard-check ${p.className}`}></i>,
            Camera: (p) => <i className={`fa-solid fa-camera ${p.className}`}></i>
        };

        const ResizableTh = ({ width, onResize, children, className, onClick }) => {
            const [resizing, setResizing] = useState(false);
            const startX = useRef(0);
            const startWidth = useRef(0);

            const handleMouseDown = (e) => {
                e.preventDefault(); e.stopPropagation(); 
                setResizing(true);
                startX.current = e.pageX;
                startWidth.current = width;
                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);
            };

            const handleMouseMove = (e) => {
                requestAnimationFrame(() => {
                    const diff = e.pageX - startX.current;
                    onResize(Math.max(50, startWidth.current + diff));
                });
            };

            const handleMouseUp = () => {
                setResizing(false);
                document.removeEventListener('mousemove', handleMouseMove);
                document.removeEventListener('mouseup', handleMouseUp);
            };

            return (
                <th className={`relative ${className} bg-slate-50`} style={{ width: width, minWidth: width }}>
                    <div className="flex items-center justify-center h-full w-full relative z-10 cursor-pointer" onClick={onClick}>
                        {children}
                    </div>
                    <div className={`resizer ${resizing ? 'resizing' : ''}`} onMouseDown={handleMouseDown} onClick={(e) => e.stopPropagation()} />
                </th>
            );
        };

        const MobileNavItem = ({ icon, label, active, onClick }) => {
            const Icon = Icons[icon];
            return (
                <button onClick={onClick} className={`flex flex-col items-center justify-center w-full py-1 ${active ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                    <div className={`text-xl mb-0.5 ${active ? '-translate-y-0.5' : ''} transition-transform`}><Icon/></div>
                    <span className="text-[10px] font-bold">{label}</span>
                </button>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [currentUser, setCurrentUser] = useState(() => getStorage(STORAGE_KEY_SESSION, null));
            const [currentView, setCurrentView] = useState("dashboard");
            const [inventory, setInventory] = useState(() => getStorage(STORAGE_KEY_INV, INITIAL_INVENTORY));
            const [transactions, setTransactions] = useState(() => getStorage(STORAGE_KEY_TRANS, []));
            const [users, setUsers] = useState(() => getStorage(STORAGE_KEY_USERS, INITIAL_USERS));
            const [bomData, setBomData] = useState(() => getStorage(STORAGE_KEY_BOM_DATA, {}));
            const [bomVersion, setBomVersion] = useState(() => getStorage(STORAGE_KEY_BOM_VERSION, 0));
            const [deptData, setDeptData] = useState(() => getStorage(STORAGE_KEY_DEPT_DATA, {}));
            const [deptConfig, setDeptConfig] = useState(() => getStorage(STORAGE_KEY_DEPT_CONFIG, {}));
            const [partImages, setPartImages] = useState(() => normalizePartImages(getStorage(STORAGE_KEY_PART_IMAGES, {})));
            const [apiUrl, setApiUrl] = useState(() => localStorage.getItem(STORAGE_KEY_API_URL) || DEFAULT_API_URL);
            
            const [isLoading, setIsLoading] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            useEffect(() => {
                setStorage(STORAGE_KEY_INV, inventory);
                setStorage(STORAGE_KEY_TRANS, transactions);
                setStorage(STORAGE_KEY_USERS, users);
                setStorage(STORAGE_KEY_BOM_DATA, bomData);
                setStorage(STORAGE_KEY_BOM_VERSION, bomVersion);
                setStorage(STORAGE_KEY_PART_IMAGES, partImages);
                setStorage(STORAGE_KEY_DEPT_DATA, deptData);
                setStorage(STORAGE_KEY_DEPT_CONFIG, deptConfig);
            }, [inventory, transactions, users, bomData, bomVersion, partImages, deptData, deptConfig]);

            useEffect(() => {
                if (currentUser) { setStorage(STORAGE_KEY_SESSION, currentUser); }
                fetchAllData(true); 
                if(!currentUser) { localStorage.removeItem(STORAGE_KEY_SESSION); }
            }, [currentUser]);

            useEffect(() => {
                if (!apiUrl) return;
                
                const checkAndSync = async () => {
                    try {
                        const res = await fetch(apiUrl + "?action=checkVersion&t=" + Date.now());
                        const data = await res.json();
                        if (data.lastUpdated && data.lastUpdated > bomVersion) {
                            console.log("Found new version, auto-syncing...");
                            fetchAllData(true);
                        }
                    } catch (e) {
                        console.log("Auto sync check failed (Offline or CORS?)");
                    }
                };

                const interval = setInterval(checkAndSync, 10000);
                return () => clearInterval(interval);
            }, [apiUrl, bomVersion]);

            const fetchAllData = async (isBackground = false) => {
                if (!apiUrl) return;
                if (!isBackground) setIsLoading(true);
                else setIsSyncing(true);

                try {
                    // แก้ไข: เปลี่ยนจาก getData เป็น getInventory ให้ตรงกับ API ใน Backend
                    const res = await fetch(apiUrl + "?action=getInventory&t=" + Date.now()); 
                    const data = await res.json();
                    
                    if (data.inventory) setInventory(data.inventory);
                    if (data.transactions) setTransactions(data.transactions);
                    if (data.users) setUsers(data.users); 

                    const resBOM = await fetch(apiUrl + "?action=getBOM&t=" + Date.now());
                    const jsonBOM = await resBOM.json();
                    const sheetData = jsonBOM.data || jsonBOM;
                    const version = jsonBOM.version || Date.now();
                    
                    // แยกชีทของแผนก (DEPT_*) ออกจาก BOM สินค้า — backend รุ่นใหม่แยกมาให้แล้วใน jsonBOM.depts
                    // แต่ยังแยกซ้ำฝั่งนี้ด้วย เผื่อ backend ยังไม่ได้ deploy ใหม่ ชีท DEPT_* จะได้ไม่หลุดไปเป็น "รุ่นสินค้า" ในหน้า MRP
                    const filteredBOM = {};
                    const fallbackDepts = {};
                    Object.keys(sheetData).forEach(key => {
                        if (key.toLowerCase() === 'data' || key === 'version' || key === 'depts' || key === 'deptConfig') return;
                        if (key === 'SheetConfig' || key === 'NegativeExamples') return; // ชีทระบบ ไม่ใช่ BOM
                        if (key.indexOf(DEPT_SHEET_PREFIX) === 0) fallbackDepts[key.substring(DEPT_SHEET_PREFIX.length)] = sheetData[key];
                        else filteredBOM[key] = sheetData[key];
                    });

                    setBomData(filteredBOM);
                    setBomVersion(version);
                    setDeptData(jsonBOM.depts && Object.keys(jsonBOM.depts).length ? jsonBOM.depts : fallbackDepts);
                    if (jsonBOM.deptConfig) setDeptConfig(jsonBOM.deptConfig);

                    try {
                        const resImg = await fetch(apiUrl + "?action=getImages&t=" + Date.now());
                        const jsonImg = await resImg.json();
                        if (jsonImg.images) setPartImages(normalizePartImages(jsonImg.images));
                    } catch (imgErr) { console.log("Image sync skipped", imgErr); }

                } catch (e) {
                    console.error("Sync Error", e); 
                } finally { 
                    setIsLoading(false); 
                    setIsSyncing(false);
                }
            };

            const handleLogin = async (u, p) => {
                const cleanU = String(u).trim();
                const cleanP = String(p).trim();
                
                if (!cleanU || !cleanP) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");

                setIsLoading(true);
                try {
                    // 1. ส่งข้อมูลตรวจสอบล็อกอินไปยัง Cloud โดยตรง
                    const res = await fetch(`${apiUrl}?action=login&username=${encodeURIComponent(cleanU)}&password=${encodeURIComponent(cleanP)}`);
                    const data = await res.json();
                    
                    if (data.status === "success") {
                        setCurrentUser(data.user);
                        fetchAllData(); 
                        return;
                    } else {
                        // เพิ่ม: ถ้า Cloud ปฏิเสธ ให้แสดงข้อความจาก Cloud ทันที จะได้รู้ว่าเกิดจากอะไร
                        alert(`เข้าสู่ระบบไม่สำเร็จ: ${data.message || "Username หรือ Password ในระบบ Cloud ไม่ถูกต้อง"}`);
                        setIsLoading(false);
                        return; 
                    }
                } catch (error) {
                    console.warn("Cloud login failed, trying local fallback...", error);
                    // 2. แผนสำรอง: กรณีออฟไลน์ หรือ URL พังให้เช็คบัญชีในเครื่องที่แคชไว้
                    // ตรวจสอบ property password ก่อนเทียบเพราะข้อมูลจาก getInventory จะลบรหัสผ่านทิ้งไปแล้ว
                    const localUser = users.find(x => String(x.username).trim() === cleanU && x.password && String(x.password).trim() === cleanP);
                    
                    if (localUser) {
                        setCurrentUser(localUser);
                        fetchAllData(); 
                    } else if (cleanU === 'admin' && cleanP === '1111') {
                        // Fallback ฉุกเฉินกรณีพึ่งเปิดเว็บครั้งแรกและต่อ Cloud ไม่ได้
                        setCurrentUser({ id: 1, username: 'admin', name: 'Administrator', role: 'ADMIN' });
                        fetchAllData();
                    } else {
                        alert("ไม่สามารถเชื่อมต่อ Cloud ได้ และไม่มีข้อมูลบัญชีนี้ในเครื่อง\n(โปรดเช็ค URL API หรือการเชื่อมต่ออินเทอร์เน็ต)");
                    }
                } finally {
                    setIsLoading(false);
                }
            };

            const addTransaction = async (type, partNo, qty, refDoc, note, newItemData = null) => {
                const newTx = { id: Date.now().toString(), date: new Date().toISOString(), type, partNo, qty: parseFloat(qty), refDoc, note, user: currentUser.name };
                setTransactions(prev => [newTx, ...prev]);
                let updatedInv = [...inventory];
                const idx = updatedInv.findIndex(i => i.partNo === partNo);
                if (idx >= 0) {
                    let nQty = updatedInv[idx].qty;
                    if (type === 'IN' || type === 'INIT') nQty += parseFloat(qty);
                    else if (type === 'OUT') nQty -= parseFloat(qty);
                    else if (type === 'ADJUST') nQty = parseFloat(qty);
                    updatedInv[idx] = { ...updatedInv[idx], qty: nQty };
                } else if (newItemData) {
                    updatedInv.push({ ...newItemData, unit: 'PCS' });
                }
                setInventory(updatedInv);
                if (apiUrl) fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "add_transaction", data: newTx, itemData: newItemData }) });
            };

            const handleDeleteItem = async (partNo) => {
                if(!confirm(`ต้องการลบ ${partNo} ใช่หรือไม่?`)) return;
                setInventory(prev => prev.filter(i => i.partNo !== partNo));
                addTransaction('ADJUST', partNo, 0, 'DELETE', 'Item Deleted');
                if (apiUrl) fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete_item", partNo }) });
            };

            const handleSaveUser = async (u) => {
                const isNew = !u.id;
                let newUser = {...u};
                if(isNew) {
                    if(users.some(existing => existing.username === u.username)) return alert("Username ซ้ำ");
                    newUser.id = Date.now();
                }
                
                let newUsers = isNew ? [...users, newUser] : users.map(user => user.id === u.id ? {...user, ...u} : user);
                setUsers(newUsers);
                if (apiUrl) fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "save_user", user: newUser }) });
            };

            const handleDeleteUser = async (id) => {
                setUsers(prev => prev.filter(u => u.id !== id));
                if (apiUrl) fetch(apiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete_user", id }) });
            };

            if (!currentUser) return <LoginView onLogin={handleLogin} isLoading={isLoading} apiUrl={apiUrl} setApiUrl={setApiUrl} />;

            return (
                <div className="flex h-screen bg-slate-100 relative overflow-hidden">
                    <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col hidden md:flex h-full">
                        <div className="p-6 border-b border-slate-800 font-bold text-white flex items-center gap-2"><Icons.Warehouse/> BOM</div>
                        <nav className="flex-1 p-4 space-y-1 overflow-y-auto">
                            <SidebarItem icon="Dashboard" label="ภาพรวม" active={currentView==='dashboard'} onClick={()=>setCurrentView('dashboard')} />
                            <SidebarItem icon="Warehouse" label="คลังสินค้า" active={currentView==='inventory'} onClick={()=>setCurrentView('inventory')} />
                            <SidebarItem icon="Production" label="แผนผลิต (MRP)" active={currentView==='mrp'} onClick={()=>setCurrentView('mrp')} />
                            <SidebarItem icon="Search" label="ค้นหาพาร์ท" active={currentView==='searchpart'} onClick={()=>setCurrentView('searchpart')} />
                            <SidebarItem icon="Camera" label="ค้นหาด้วยรูป" active={currentView==='visualsearch'} onClick={()=>setCurrentView('visualsearch')} />
                            <SidebarItem icon="Clipboard" label="นับสต๊อก" active={currentView==='stockcount'} onClick={()=>setCurrentView('stockcount')} />
                            <SidebarItem icon="History" label="ประวัติรายการ" active={currentView==='history'} onClick={()=>setCurrentView('history')} />
                            <SidebarItem icon="Settings" label="ตั้งค่า" active={currentView==='settings'} onClick={()=>setCurrentView('settings')} />
                        </nav>
                        <div className="p-4 border-t border-slate-800 text-xs text-center flex flex-col gap-2">
                            <div className="flex justify-between items-center w-full">
                                <span>{currentUser.name}</span>
                                <button onClick={()=>setCurrentUser(null)} className="text-red-400 font-bold">Logout</button>
                            </div>
                            {isSyncing && <div className="text-blue-400 flex items-center justify-center gap-2"><div className="loader w-3 h-3"></div> Auto Syncing...</div>}
                        </div>
                    </aside>

                    <div className="md:hidden fixed top-0 left-0 right-0 bg-slate-900 text-white p-4 z-30 flex justify-between items-center shadow-lg">
                        <div className="font-bold flex items-center gap-2"><Icons.Warehouse/> BOM</div>
                        <div className="flex items-center gap-3">
                             {isSyncing && <div className="text-blue-400 flex items-center justify-center gap-1 text-xs"><div className="loader w-2 h-2 border-white border-t-transparent"></div></div>}
                            <button onClick={()=>setCurrentUser(null)} className="text-xs bg-slate-800 px-3 py-1 rounded">Logout</button>
                        </div>
                    </div>
                    
                    <main className="flex-1 overflow-y-auto p-4 md:p-8 pt-20 md:pt-8 pb-24 md:pb-8 h-full">
                        {currentView === 'dashboard' && <DashboardView inventory={inventory} transactions={transactions} toInventory={()=>setCurrentView('inventory')} />}
                        {currentView === 'inventory' && <InventoryView inventory={inventory} setInventory={setInventory} addTransaction={addTransaction} deleteItem={handleDeleteItem} apiUrl={apiUrl} currentUser={currentUser} setTransactions={setTransactions} partImages={partImages} setPartImages={setPartImages} />}
                        {currentView === 'mrp' && <AdvancedMRPView inventory={inventory} addTransaction={addTransaction} bomData={bomData} setBomData={setBomData} deptData={deptData} deptConfig={deptConfig} apiUrl={apiUrl} partImages={partImages} setPartImages={setPartImages} currentUser={currentUser} />}
                        {currentView === 'searchpart' && <SearchPartView inventory={inventory} bomData={bomData} deptData={deptData} deptConfig={deptConfig} apiUrl={apiUrl} partImages={partImages} setPartImages={setPartImages} currentUser={currentUser} />}
                        {currentView === 'visualsearch' && <VisualSearchView inventory={inventory} bomData={bomData} deptData={deptData} deptConfig={deptConfig} apiUrl={apiUrl} partImages={partImages} setPartImages={setPartImages} currentUser={currentUser} />}
                        {currentView === 'stockcount' && <StockCountView inventory={inventory} setInventory={setInventory} addTransaction={addTransaction} currentUser={currentUser} apiUrl={apiUrl} bomData={bomData} />}
                        {currentView === 'history' && <HistoryView transactions={transactions} />}
                        {currentView === 'settings' && <SettingsView apiUrl={apiUrl} setApiUrl={setApiUrl} users={users} currentUser={currentUser} onSaveUser={handleSaveUser} onDeleteUser={handleDeleteUser} />}
                    </main>

                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-2 z-30 flex justify-between items-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] pb-safe">
                        <MobileNavItem icon="Dashboard" label="ภาพรวม" active={currentView==='dashboard'} onClick={()=>setCurrentView('dashboard')} />
                        <MobileNavItem icon="Warehouse" label="คลัง" active={currentView==='inventory'} onClick={()=>setCurrentView('inventory')} />
                        <MobileNavItem icon="Production" label="ผลิต" active={currentView==='mrp'} onClick={()=>setCurrentView('mrp')} />
                        <MobileNavItem icon="Search" label="ค้นหา" active={currentView==='searchpart'} onClick={()=>setCurrentView('searchpart')} />
                        <MobileNavItem icon="Camera" label="รูปภาพ" active={currentView==='visualsearch'} onClick={()=>setCurrentView('visualsearch')} />
                        <MobileNavItem icon="Clipboard" label="นับสต๊อก" active={currentView==='stockcount'} onClick={()=>setCurrentView('stockcount')} />
                        <MobileNavItem icon="History" label="ประวัติ" active={currentView==='history'} onClick={()=>setCurrentView('history')} />
                        <MobileNavItem icon="Settings" label="ตั้งค่า" active={currentView==='settings'} onClick={()=>setCurrentView('settings')} />
                    </div>
                </div>
            );
        };

        const SidebarItem = ({ icon, label, active, onClick }) => {
            const Icon = Icons[icon];
            return <button onClick={onClick} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 text-sm font-medium sidebar-link ${active ? 'active text-blue-400 bg-slate-800' : 'hover:text-white hover:bg-slate-800'}`}><Icon/> {label}</button>;
        };

        const LoginView = ({ onLogin, isLoading, apiUrl, setApiUrl }) => {
            const [u, setU] = useState(""); 
            const [p, setP] = useState("");
            const [showConfig, setShowConfig] = useState(false);
            const [tempUrl, setTempUrl] = useState(apiUrl);

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-800 p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center relative">
                        <button onClick={()=>setShowConfig(!showConfig)} className="absolute top-4 right-4 text-slate-300 hover:text-slate-500" title="Connection Settings"><Icons.Settings/></button>
                        
                        <div className="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-white text-2xl"><Icons.Warehouse/></div>
                        <h1 className="text-xl font-bold mb-6 text-slate-800">NLC Factory ERP</h1>
                        
                        {showConfig ? (
                            <div className="mb-6 animate-fade-in text-left bg-slate-50 p-4 rounded-xl border">
                                <label className="text-xs font-bold text-slate-500 mb-1 block">API URL (Google Apps Script)</label>
                                <textarea value={tempUrl} onChange={e=>setTempUrl(e.target.value)} className="w-full p-2 border rounded text-xs mb-2 h-20 break-all" />
                                <div className="flex gap-2">
                                    <button onClick={()=>setShowConfig(false)} className="flex-1 py-2 bg-slate-200 rounded text-xs font-bold text-slate-600">Cancel</button>
                                    <button onClick={()=>{ setApiUrl(tempUrl); localStorage.setItem(STORAGE_KEY_API_URL, tempUrl); setShowConfig(false); alert("บันทึก URL แล้ว กรุณารอสักครู่ระบบจะรีโหลดข้อมูล..."); window.location.reload(); }} className="flex-1 bg-blue-600 text-white py-2 rounded text-xs font-bold">Save & Reload</button>
                                </div>
                            </div>
                        ) : (
                            <>
                                <input type="text" value={u} onChange={e=>setU(e.target.value)} className="w-full p-3 border rounded-xl mb-3 outline-none focus:ring-2 focus:ring-blue-100" placeholder="Username"/>
                                <input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==='Enter'&&onLogin(u,p)} className="w-full p-3 border rounded-xl mb-6 outline-none focus:ring-2 focus:ring-blue-100" placeholder="Password"/>
                                <button onClick={()=>onLogin(u,p)} disabled={isLoading} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition disabled:opacity-50">
                                    {isLoading ? "Connecting..." : "Login"}
                                </button>
                                <div className="mt-4 text-[10px] text-slate-400">Cloud Status: {isLoading ? 'Syncing...' : 'Ready'}</div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // ===== ค้นหาพาร์ท (Search Part) — แยกออกมาเป็นฟังก์ชันเดี่ยว ไม่ฝังลึกอยู่ใน AdvancedMRPView =====
        // ค้นทั้ง BOM ของสินค้า และรายการพาร์ทแยกแผนก (DEPT_*) ในครั้งเดียว แล้วติดป้ายบอกแหล่งที่มาให้แต่ละรายการ
        // ทั้งสองแหล่งอยู่กันคนละก้อน ไม่ถูกรวมเข้าหากัน — พาร์ทเดียวกันที่มีทั้งสองแหล่งจะขึ้นเป็นคนละบรรทัด
        const SOURCE_BOM = "BOM";
        const usePartSearch = (bomData, sheetNames = [], { pNoCol, nameCol, qtyCol, typeCol } = {}, deptData = {}, deptConfig = {}) => {
            const [searchPartQuery, setSearchPartQuery] = useState("");
            const [partSearchResults, setPartSearchResults] = useState(null);
            const [sourceFilter, setSourceFilter] = useState("ALL");

            // รวมทุกแหล่งเป็นดัชนีเดียวไว้ก่อน (คำนวณใหม่เฉพาะตอนข้อมูลเปลี่ยน ไม่ใช่ทุกครั้งที่กดค้นหา)
            const partIndex = useMemo(() => {
                const items = [];
                sheetNames.forEach(sheet => {
                    (bomData?.[sheet] || []).slice(1).forEach(row => {
                        const partNo = cleanPartNo(row[pNoCol]);
                        const name = cleanCell(row[nameCol]);
                        if (!partNo && !name) return;
                        items.push({
                            partNo, name,
                            model: sheet,
                            qty: parseFloat(row[qtyCol]) || 0,
                            type: row[typeCol] || "-",
                            sourceKey: SOURCE_BOM,
                            source: SOURCE_BOM,
                            extras: []
                        });
                    });
                });
                deptPartRows(deptData, deptConfig).forEach(it => items.push(it));

                // เตรียมข้อความสำหรับค้นไว้ล่วงหน้า — ของแผนกให้ค้นจาก Tooling No./Process/ขนาด ได้ด้วย
                // (ช่างมักจำเป็นเลขแม่พิมพ์มากกว่าเลขพาร์ท)
                return items.map(it => ({
                    ...it,
                    _key: normPartNo(it.partNo),
                    _text: [it.name, it.model, it.type, ...(it.extras || []).map(e => e.value)].join(" ").toLowerCase()
                }));
            }, [bomData, sheetNames, deptData, deptConfig, pNoCol, nameCol, qtyCol, typeCol]);

            // พาร์ทไหนมีอยู่ในแหล่งใดบ้าง — ใช้ติดป้าย "มีข้อมูลของแผนก ..." บนผลลัพธ์ฝั่ง BOM และกลับกัน
            const sourcesOfPart = useMemo(() => {
                const map = {};
                partIndex.forEach(it => {
                    if (!it._key) return;
                    if (!map[it._key]) map[it._key] = [];
                    if (!map[it._key].includes(it.source)) map[it._key].push(it.source);
                });
                return map;
            }, [partIndex]);

            // รายชื่อแหล่งทั้งหมดที่มีข้อมูลจริง ใช้สร้างปุ่มกรอง (ไม่มีแผนกเลย = ไม่ต้องโชว์ปุ่ม)
            const availableSources = useMemo(() => {
                const seen = [];
                partIndex.forEach(it => { if (!seen.includes(it.source)) seen.push(it.source); });
                return seen;
            }, [partIndex]);

            const handlePartSearch = () => {
                if (!searchPartQuery.trim()) return alert("กรุณาพิมพ์คำค้นหา");

                const term = searchPartQuery.trim().toLowerCase();
                const keyTerm = normPartNo(searchPartQuery);

                const results = partIndex.filter(it =>
                    (keyTerm && it._key.includes(keyTerm)) || it._text.includes(term)
                );

                setPartSearchResults(results);
            };

            // ผลลัพธ์หลังกรองตามแหล่ง — เก็บผลดิบไว้เพื่อสลับตัวกรองได้โดยไม่ต้องค้นใหม่
            const filteredResults = useMemo(() => {
                if (!partSearchResults) return null;
                if (sourceFilter === "ALL") return partSearchResults;
                return partSearchResults.filter(it => it.source === sourceFilter);
            }, [partSearchResults, sourceFilter]);

            return {
                searchPartQuery, setSearchPartQuery, partSearchResults: filteredResults, rawResults: partSearchResults,
                setPartSearchResults, handlePartSearch,
                sourceFilter, setSourceFilter, availableSources, sourcesOfPart
            };
        };

        // ===== ตะกร้าพาร์ท — เก็บพาร์ทที่เลือกจากผลค้นหาไว้รวมกัน แล้ว export เป็น Excel ทีเดียว =====
        // เก็บใน localStorage เพื่อให้ตะกร้าคงอยู่ข้ามการค้นหาหลายรอบ (พาร์ทเดียวกันคนละโมเดลนับเป็นคนละรายการ)
        // key รวม "แหล่ง" ด้วย เพราะพาร์ทเดียวกันมีได้ทั้งฝั่ง BOM และฝั่งแผนก (คนละข้อมูล ต้องหยิบใส่ตะกร้าแยกกันได้)
        const cartKeyOf = (it) => `${normPartNo(it.partNo)}||${it.model || ""}||${it.source || SOURCE_BOM}`;
        const usePartCart = () => {
            const [cart, setCart] = useState(() => getStorage(STORAGE_KEY_PART_CART, []));
            useEffect(() => { setStorage(STORAGE_KEY_PART_CART, cart); }, [cart]);

            const inCart = (it) => cart.some(c => cartKeyOf(c) === cartKeyOf(it));
            const toggleCart = (it) => setCart(prev => {
                const k = cartKeyOf(it);
                if (prev.some(c => cartKeyOf(c) === k)) return prev.filter(c => cartKeyOf(c) !== k);
                return [...prev, {
                    partNo: cleanPartNo(it.partNo),
                    name: it.name || "",
                    model: it.model || "",
                    qtyPerUnit: it.qty,
                    type: it.type || "-",
                    source: it.source || SOURCE_BOM,
                    extras: it.extras || [],
                    qty: 1
                }];
            });
            const removeFromCart = (key) => setCart(prev => prev.filter(c => cartKeyOf(c) !== key));
            const setCartQty = (key, qty) => setCart(prev => prev.map(c => cartKeyOf(c) === key ? { ...c, qty } : c));
            const clearCart = () => setCart([]);

            return { cart, inCart, toggleCart, removeFromCart, setCartQty, clearCart };
        };

        // ===== ค้นหาด้วยรูป (Visual Search) — แยกออกมาเป็นฟังก์ชันเดี่ยว ไม่ฝังลึกอยู่ใน AdvancedMRPView =====
        // embeddings: partNo -> [{ fileId, vector }] — พาร์ทเดียวกันมีได้หลายรูป/หลายมุม คะแนนของพาร์ทคือค่าที่ดีที่สุดในบรรดารูปทั้งหมด
        // ===== ค่าปรับจูนของค้นหาด้วยรูป — admin แก้ได้จากหน้าจอ (ปุ่ม "ตั้งค่า" ในหน้าค้นหาด้วยรูป) =====
        // ค่ากลางเก็บบน cloud (Script Properties) บังคับใช้ทุกเครื่อง/ทุกผู้ใช้ — localStorage เป็นแค่สำเนาไว้ใช้ตอนออฟไลน์
        const VS_TUNE_DEFAULTS = {
            ocrWeight: 0.3,        // โบนัสสูงสุดเมื่อตัวหนังสือ/label ตรงกันเป๊ะ
            minScore: 0.5,         // ตัดผลที่คะแนนต่ำกว่านี้ทิ้ง
            rerankMargin: 0.06,    // อันดับต้นห่างกันน้อยกว่านี้ = สูสี ต้องตรวจรายละเอียดเชิงลึก
            rerankMax: 4,          // ตรวจเชิงลึกสูงสุดกี่พาร์ท (แต่ละพาร์ทต้องดึงรูป + embed 5 patch)
            detailWeight: 0.45,    // น้ำหนักคะแนนรายละเอียดตอนผสมกับคะแนนภาพรวม
            colorSpan: 0.2,        // ช่วงผลของสี: สีตรงเป๊ะ +ครึ่งหนึ่งของค่านี้ / สีคนละเรื่อง -ครึ่งหนึ่ง
            colorBadge: 0.35,      // ความคล้ายสีต่ำกว่านี้ขึ้นป้าย "สีต่าง"
            highCut: 0.9,          // ตัวท็อปถึงเกณฑ์นี้ = ตัดตัวเลือกที่ต่ำกว่าเกณฑ์ทิ้ง
            textContrast: 48,      // ความต่างความสว่างขั้นต่ำที่นับเป็น "ขอบคม" (ใช้เช็คว่ารูปมีตัวหนังสือไหมก่อนยิง OCR)
            textDensity: 0.4,     // สัดส่วนพิกเซลขอบคมใน cell ที่ถือว่าหนาแน่นระดับตัวหนังสือ
            textBalance: 0.25,     // ทิศขอบที่น้อยกว่า (นอน/ตั้ง) ต้องมีอย่างน้อยสัดส่วนนี้
            textCells: 2           // ต้องเจอ cell เข้าเกณฑ์อย่างน้อยกี่ cell ถึงถือว่ามีตัวหนังสือ
        };
        const VS_TUNE = { ...VS_TUNE_DEFAULTS, ...getStorage('vs_tune', {}) };
        const saveVsTune = (vals) => { Object.assign(VS_TUNE, vals); setStorage('vs_tune', vals); };
        // ค่ากลางจาก cloud (admin ตั้งครั้งเดียว มีผลทุกเครื่อง/ทุกผู้ใช้) — เขียนทับค่าในเครื่องเสมอ
        // แล้วเก็บสำเนาลง localStorage ไว้เป็นค่าตั้งต้นรอบถัดไปตอนออฟไลน์/โหลด cloud พลาด
        const applyVsSettings = (s) => {
            if (!s) return;
            const clean = {};
            Object.keys(VS_TUNE_DEFAULTS).forEach(k => { const n = parseFloat(s[k]); if (!isNaN(n)) clean[k] = n; });
            if (Object.keys(clean).length) saveVsTune({ ...VS_TUNE_DEFAULTS, ...clean });
        };

        const useVisualSearch = (apiUrl, partImages = {}, partNameMap = {}) => {
            const [embeddings, setEmbeddings] = useState({});
            // เงาของ embeddings ไว้อ่านในงาน async ที่ค้างข้าม render (เช่น ค้นหาที่รอดัชนีก้อนแรกมาถึง) —
            // closure ของ handler จับค่า ณ render ที่ผูก event ไว้ ถ้าอ่านจาก state ตรง ๆ หลัง await จะได้ของเก่าเสมอ
            const embeddingsRef = useRef({});
            useEffect(() => { embeddingsRef.current = embeddings; }, [embeddings]);
            const [embLoaded, setEmbLoaded] = useState(false);
            const [visualBusy, setVisualBusy] = useState(false);
            const [visualMsg, setVisualMsg] = useState("");
            const [indexProg, setIndexProg] = useState({ done: 0, total: 0 });
            const [queryPreview, setQueryPreview] = useState("");
            const [queryFile, setQueryFile] = useState(null); // ไฟล์รูปที่ใช้ค้นหาล่าสุด — เก็บไว้เผื่อ user ยืนยันแล้วอยากบันทึกเป็นรูปของพาร์ทนั้นเลย
            const [visualResults, setVisualResults] = useState(null);
            const [visualNotice, setVisualNotice] = useState(""); // ข้อความเตือนประกอบผลค้นหา เช่น "คะแนนสูสี ตรวจรายละเอียดแล้ว โปรดเช็คจำนวนรูก่อนยืนยัน"
            const patchCacheRef = useRef({}); // fileId -> patch vectors ที่คำนวณแล้ว — ค้นซ้ำรูปเดิมไม่ต้องดึง/embed ใหม่ (อยู่แค่ในหน่วยความจำต่อ session)

            const [freshLoaded, setFreshLoaded] = useState(false); // ดัชนี "ของสด" จาก cloud มาถึงครบแล้ว — งานซ่อมดัชนีรอธงนี้ กันตัดสินจากแคชเก่า
            const [embLoadProg, setEmbLoadProg] = useState({ done: 0, total: 0 }); // ความคืบหน้าโหลดดัชนีจาก cloud (นับเป็นแถวรูป)
            const [embLoadError, setEmbLoadError] = useState(""); // โหลดดัชนีพลาด — โชว์ให้เห็น + มีปุ่มลองใหม่ (เดิมกลืนเงียบลง console ผู้ใช้ไม่รู้ว่าค้างอยู่ตรงไหน)
            const embLoadErrorRef = useRef("");                  // อ่านหลัง await ได้ค่าล่าสุดจริง (เช่น โหลดพังระหว่างที่การค้นหากำลังรอดัชนีอยู่)
            useEffect(() => { embLoadErrorRef.current = embLoadError; }, [embLoadError]);
            const embLoadingRef = useRef(false); // กันโหลดซ้อนกัน (เช่น กดลองใหม่รัว ๆ)

            // แปลงข้อมูลดัชนีดิบ 1 ก้อนจาก cloud แล้วรวมเข้าสถานะแบบระวัง: ตัวที่ข้อมูลครบกว่า (เช่น เพิ่งอัปเกรด/ประมวลผลในเครื่อง) ชนะ —
            // กัน race ที่ของสด (ดึงมาก่อน) เขียนทับดัชนีที่เพิ่งประมวลผลเสร็จระหว่างรอโหลด
            const vsCompleteness = (it) => (it.hasOcr ? 1 : 0) + (it.centerVec ? 1 : 0) + (it.colorHist ? 1 : 0) + (it.patches ? 1 : 0);
            const mergeEmbChunk = (raw) => {
                const chunk = {};
                Object.keys(raw || {}).forEach(p => {
                    const list = (raw[p] || [])
                        .map(it => {
                            const u = unpackEmbedding(it.embedding);
                            if (!u.vector) return null;
                            return { fileId: it.fileId, vector: u.vector, centerVec: u.centerVec, colorHist: u.colorHist, patches: u.patches, tokens: ocrTokens(it.ocrText), hasOcr: !!it.ocrText, ocrText: String(it.ocrText || "") };
                        })
                        .filter(Boolean);
                    if (list.length) chunk[p] = list;
                });
                if (!Object.keys(chunk).length) return;
                setEmbeddings(prev => {
                    const merged = { ...prev };
                    Object.keys(chunk).forEach(p => {
                        const byId = {};
                        (merged[p] || []).forEach(it => { byId[it.fileId] = it; });
                        chunk[p].forEach(it => {
                            const c = byId[it.fileId];
                            if (!c || vsCompleteness(it) >= vsCompleteness(c)) byId[it.fileId] = it; // ครบเท่ากัน = ของสดจาก cloud ชนะ
                        });
                        merged[p] = Object.values(byId);
                    });
                    return merged;
                });
            };

            const loadEmbeddings = React.useCallback(async () => {
                if (!apiUrl) { setEmbLoaded(true); return; }
                if (embLoadingRef.current) return;
                embLoadingRef.current = true;
                try {
                    // ขั้นที่ 1: ใช้แคชในเครื่องก่อน — หน้าพร้อมค้นหาแทบทันที ไม่ต้องรอโหลดก้อนใหญ่จาก cloud (ช้ามากบนมือถือ)
                    const cached = await vsCacheGet();
                    const haveCache = !!(cached && cached.embeddings && Object.keys(cached.embeddings).length);
                    if (haveCache) {
                        setEmbeddings(cached.embeddings);
                        setEmbLoaded(true);
                    }
                    // ขั้นที่ 2: ดึงของสดจาก cloud เบื้องหลัง แค่ครั้งเดียวต่อการเปิดเว็บ — สลับหน้าไปมาไม่โหลดซ้ำ
                    // ข้ามได้เฉพาะเมื่อ "มีดัชนีในแคชให้ใช้จริง" เท่านั้น — ธง __vsRevalidated อยู่ระดับหน้าเว็บ แต่ตัวดัชนีเป็น state
                    // ของ component ที่ถูกล้างทุกครั้งที่สลับหน้า ถ้าแคชเขียนไม่ลง (โควต้าเต็ม/private mode) การข้ามตรงนี้
                    // จะทำให้กลับเข้าหน้ามาแล้วดัชนีว่างถาวร → ค้นหาไม่ได้ และงานเก็บตกดัชนีจะเข้าใจผิดว่าทั้งคลังยังไม่มีดัชนี
                    if (__vsRevalidated && haveCache) { setEmbLoaded(true); setFreshLoaded(true); return; }
                    setEmbLoadError("");
                    try {
                        // ค่ากลางของระบบค้นหา (admin ตั้งจากหน้า "ตั้งค่า") — ดึงคู่ขนานไปกับดัชนี ไม่เพิ่มเวลารอ
                        // backend รุ่นเก่าที่ยังไม่มี action นี้ / ดึงพลาด = ใช้ค่าในเครื่องเดิมต่อ ไม่กระทบการโหลดหลัก
                        const settingsPromise = fetch(apiUrl + "?action=getVsSettings&t=" + Date.now())
                            .then(r => (r.ok ? r.json() : null)).catch(() => null);
                        // โหลดดัชนีทีละก้อนเล็ก ๆ — ก้อนเดียวทั้งคลัง (~10KB/รูป × หลายร้อยรูป) ช้า/ล้มบนมือถือ
                        // แต่ละก้อนที่มาถึงถูกใส่เข้าดัชนีทันที ค้นหาได้เลยไม่ต้องรอครบ + ตัวเลขความคืบหน้าเดินให้เห็น
                        const CHUNK_ROWS = 60;
                        let offset = 0;
                        while (true) {
                            const res = await fetch(apiUrl + "?action=getEmbeddings&offset=" + offset + "&limit=" + CHUNK_ROWS + "&t=" + Date.now());
                            if (!res.ok) throw new Error("HTTP " + res.status);
                            const json = await res.json();
                            mergeEmbChunk(json.embeddings);
                            setEmbLoaded(true); // มีดัชนีบางส่วนแล้ว — ปลดล็อกการค้นหาได้เลย
                            if (typeof json.total !== 'number') break; // backend รุ่นเก่า (ยังไม่ deploy ตัวรองรับแบ่งก้อน): ตอบทั้งหมดมาแล้วในครั้งเดียว
                            const got = typeof json.count === 'number' ? json.count : CHUNK_ROWS;
                            if (got <= 0) break;
                            offset += got;
                            setEmbLoadProg({ done: Math.min(offset, json.total), total: json.total });
                            if (offset >= json.total) break;
                        }
                        const settingsJson = await settingsPromise;
                        if (settingsJson && settingsJson.settings) applyVsSettings(settingsJson.settings);
                        __vsRevalidated = true;
                        setFreshLoaded(true);
                    } catch (e) {
                        // โหลดของสดพลาด = ใช้แคชต่อไป ค้นหายังทำงานได้ — แต่ต้องบอกผู้ใช้ ไม่กลืนเงียบ
                        console.log("load embeddings failed", e);
                        setEmbLoadError(String((e && e.message) || e));
                    }
                } finally {
                    embLoadingRef.current = false;
                    setEmbLoaded(true);
                    setEmbLoadProg({ done: 0, total: 0 });
                }
            }, [apiUrl]);
            useEffect(() => { if (!embLoaded) loadEmbeddings(); }, [embLoaded, loadEmbeddings]);

            // กดลองโหลดดัชนีจาก cloud ใหม่ (หลังพลาด เช่น เน็ตหลุด) — ปลดธง revalidate แล้วให้ effect เดิมยิง loadEmbeddings อีกรอบ
            const retryLoadIndex = () => {
                __vsRevalidated = false;
                setEmbLoadError("");
                setEmbLoaded(false);
            };

            // เก็บดัชนีล่าสุดลงแคชในเครื่องทุกครั้งที่เปลี่ยนหลังโหลดรอบแรกเสร็จ (จากแคชหรือ cloud ก็ตาม) —
            // ใช้ embLoaded ไม่ใช่ freshLoaded: ถ้าดึงของสดพลาด (ออฟไลน์/quota) ดัชนีที่เพิ่งประมวลผลในเครื่อง
            // ยังต้องถูกเก็บลงแคช ไม่งั้นรีเฟรชแล้วหาย — การเขียนข้อมูลแคชเดิมซ้ำหนึ่งรอบตอนเพิ่งโหลดเป็น no-op ที่ยอมได้
            useEffect(() => {
                if (!embLoaded) return;
                vsCachePut({ embeddings, ts: Date.now() });
            }, [embLoaded, embeddings]);

            // หารูปที่ยังไม่มีดัชนี (หรือทำดัชนีไว้ก่อนมีระบบอ่านตัวหนังสือ) — skipRecentMs ไว้ข้ามรูปที่เพิ่งอัป
            // ซึ่งงาน auto-index เบื้องหลังของมันอาจกำลังวิ่งอยู่ กันประมวลผลซ้ำซ้อนกันเอง
            const findUnindexed = (skipRecentMs = 0) => {
                const targets = [];
                const now = Date.now();
                Object.keys(partImages).forEach(p => {
                    const indexed = {};
                    (embeddings[p] || []).forEach(it => { indexed[it.fileId] = it; });
                    (partImages[p] || []).forEach(img => {
                        if (!img.fileId) return;
                        if (skipRecentMs && img.updatedAt && (now - new Date(img.updatedAt).getTime()) < skipRecentMs) return;
                        const existing = indexed[img.fileId];
                        // ทำดัชนีใหม่ทั้งรูปที่ยังไม่มีดัชนี และรูปดัชนีรุ่นเก่า (ยังไม่มี OCR / เวกเตอร์กลางภาพ / ลายเซ็นสี / patch มุม)
                        // ถ้าเคย OCR ไว้แล้ว ส่งข้อความเดิมติดไปด้วย จะได้ไม่เปลืองโควต้า OCR ซ้ำตอนอัปเกรดดัชนี
                        if (!existing || !existing.hasOcr || !existing.centerVec || !existing.colorHist || !existing.patches)
                            targets.push({ partNo: p, fileId: img.fileId, prevOcrText: (existing && existing.hasOcr) ? existing.ocrText : null });
                    });
                });
                return targets;
            };

            // component นี้ถูก unmount ตอนสลับไปหน้าอื่น แต่ loop async ที่วิ่งอยู่ไม่ตายตาม —
            // ต้องเช็คธงนี้ในทุกรอบ loop ไม่งั้นสลับหน้าไปมาจะได้ loop ซ้อนกันหลายชุดทำงานซ้ำซ้อน
            const isMountedRef = useRef(true);
            useEffect(() => {
                isMountedRef.current = true;
                return () => { isMountedRef.current = false; };
            }, []);

            // ใส่ดัชนีที่เพิ่งประมวลผลเสร็จกลับเข้า state แบบ "รวม" ไม่ใช่ "ทับ" — รอบประมวลผลกินเวลาหลายนาที
            // ระหว่างนั้นดัชนีก้อนใหม่จาก cloud ยังทยอยมาถึงเรื่อย ๆ ถ้าเขียนทับด้วยสำเนาที่ถ่ายไว้ตอนเริ่ม ของที่มาถึงระหว่างทางจะหายหมด
            const mergeIndexed = (items) => {
                if (!items.length) return;
                setEmbeddings(prev => {
                    const merged = { ...prev };
                    items.forEach(({ partNo, item }) => {
                        merged[partNo] = [...(merged[partNo] || []).filter(it => it.fileId !== item.fileId), item];
                    });
                    return merged;
                });
            };

            // ประมวลผลดัชนีตามรายการที่ระบุ: ดึงรูปจาก Drive (ผ่าน proxy) -> แปลงเวกเตอร์ + OCR -> บันทึก — ทำทีละรูป
            // silent = โหมดซ่อมอัตโนมัติเบื้องหลัง (ไม่เด้ง alert ไม่ล็อกปุ่มค้นหา)
