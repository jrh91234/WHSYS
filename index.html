                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const InventoryView = ({ inventory, setInventory, addTransaction, deleteItem, apiUrl, currentUser, setTransactions }) => {
            const [searchTerm, setSearchTerm] = useState("");
            const [editItem, setEditItem] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const fileInputRef = useRef(null);

            const handleDownloadTemplate = () => {
                const templateData = [
                    { 
                        PartNo: "EX-001", 
                        Name: "Example Part", 
                        Qty: 100, 
                        Unit: "pcs", 
                        Cost: 10.5, 
                        Type: "Raw Material", 
                        Min: 10, 
                        Max: 1000 
                    }
                ];
                
                const ws = XLSX.utils.json_to_sheet(templateData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template");
                XLSX.writeFile(wb, "Inventory_Template.xlsx");
            };

            const handleImportExcel = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws);

                        if (data.length === 0) {
                            alert("ไม่พบข้อมูลในไฟล์ Excel");
                            return;
                        }

                        const itemsToImport = data.map(row => {
                            const partNo = String(row.PartNo || row.partno || row["Part No"] || "").trim();
                            if (!partNo) return null;

                            return {
                                partNo: partNo,
                                name: String(row.Name || row.name || "Unknown"),
                                qty: parseFloat(row.Qty || row.qty) || 0,
                                location: "-",
                                unit: String(row.Unit || row.unit || "pcs"),
                                minStock: parseFloat(row.Min || row.min || 0),
                                type: String(row.Type || row.type || "Raw Material")
                            };
                        }).filter(item => item !== null);

                        if (itemsToImport.length === 0) {
                            alert("ไม่มีข้อมูลที่ถูกต้องในการนำเข้า");
                            return;
                        }

                        // สร้างรายการประวัติ (Transaction) ไว้รอส่งพร้อมกัน
                        const txObj = {
                            id: Date.now().toString(), 
                            date: new Date().toISOString(), 
                            type: 'ADJUST', 
                            partNo: 'SYSTEM', 
                            qty: 0, 
                            refDoc: 'IMPORT', 
                            note: `Excel Bulk Import: ${itemsToImport.length} items`, 
                            user: currentUser ? currentUser.name : "-"
                        };

                        if (apiUrl) {
                            console.log("กำลังส่งข้อมูลไปบันทึก...");
                            
                            // ส่งข้อมูลและประวัติไปใน request เดียว
                            await fetch(apiUrl, {
                                method: "POST",
                                mode: "no-cors", 
                                body: JSON.stringify({ 
                                    action: "bulk_import", 
                                    items: itemsToImport,
                                    transaction: txObj 
                                })
                            });
                        }

                        const newInventory = [...inventory];
                        itemsToImport.forEach(item => {
                            const idx = newInventory.findIndex(i => i.partNo === item.partNo);
                            if (idx > -1) {
                                newInventory[idx] = { ...newInventory[idx], ...item };
                            } else {
                                newInventory.push(item);
                            }
                        });
                        
                        // อัปเดตข้อมูลหน้าจอ
                        setInventory(newInventory);
                        setTransactions(prev => [txObj, ...prev]);
                        
                        alert(`นำเข้าและบันทึกข้อมูลสำเร็จ! (${itemsToImport.length} รายการ)`);

                    } catch (error) {
                        console.error(error);
                        alert("เกิดข้อผิดพลาด: " + error.message);
                    } finally {
                        e.target.value = ""; 
                    }
                };
                reader.readAsBinaryString(file);
            };

            const handleDelete = (partNo) => {
                if(confirm(`Delete ${partNo}?`)) {
                    setInventory(inventory.filter(i => String(i.partNo) !== String(partNo)));
                    addTransaction('ADJUST', partNo, 0, 'DELETE', 'Item Deleted');
                }
            };

            const handleSaveItem = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const item = {
                    partNo: String(formData.get('partNo')),
                    name: formData.get('name'),
                    qty: parseFloat(formData.get('qty')) || 0,
                    unit: formData.get('unit'),
                    cost: parseFloat(formData.get('cost')) || 0,
                    type: formData.get('type'),
                    min: parseFloat(formData.get('min')) || 0,
                    max: parseFloat(formData.get('max')) || 0,
                    lastUpdated: new Date().toISOString()
                };

                const existingIdx = inventory.findIndex(i => String(i.partNo) === item.partNo);
                if (editItem && existingIdx > -1) {
                    const newInv = [...inventory];
                    newInv[existingIdx] = item;
                    setInventory(newInv);
                    addTransaction('ADJUST', item.partNo, item.qty, 'EDIT', 'Manual Edit');
                } else {
                    if (existingIdx > -1) return alert("Part No already exists!");
                    setInventory([...inventory, item]);
                    addTransaction('INIT', item.partNo, item.qty, 'NEW', 'Added via Form', item);
                }
                setIsModalOpen(false);
            };

            const filteredInventory = inventory.filter(i =>
                String(i.partNo || "").toLowerCase().includes(searchTerm.toLowerCase()) ||
                String(i.name || "").toLowerCase().includes(searchTerm.toLowerCase())
            );

            const handleExportExcel = () => {
                const exportData = filteredInventory.filter(item => item.qty !== 0).map(item => ({
                    PartNo: item.partNo || "",
                    Name: item.name || "",
                    Qty: item.qty || 0,
                    Unit: item.unit || "",
                    Cost: item.cost || 0,
                    Type: item.type || "",
                    Min: item.min || 0,
                    Max: item.max || 0,
                    Location: item.location || "",
                    LastUpdated: item.lastUpdated || ""
                }));
                if (exportData.length === 0) {
                    alert("ไม่มีข้อมูลสำหรับ Export");
                    return;
                }
                exportToExcel(exportData, "Inventory", "Inventory");
            };

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border">
                        <div className="flex gap-2 w-full md:w-auto">
                            <input 
                                type="text" 
                                placeholder="Search Part No / Name..." 
                                value={searchTerm}
                                onChange={e=>setSearchTerm(e.target.value)}
                                className="p-2 border rounded-lg w-full md:w-64 outline-none focus:ring-2 focus:ring-blue-100"
                            />
                        </div>
                        <div className="flex gap-2 w-full md:w-auto overflow-x-auto">
                            <button onClick={handleDownloadTemplate} className="bg-slate-100 text-slate-600 px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-slate-200 whitespace-nowrap">
                                <i className="fa-solid fa-file-arrow-down"></i> Template
                            </button>
                            
                            <input type="file" ref={fileInputRef} onChange={handleImportExcel} className="hidden" accept=".xlsx, .xls, .csv" />
                            <button onClick={() => fileInputRef.current.click()} className="bg-green-600 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-green-700 whitespace-nowrap">
                                <i className="fa-solid fa-file-excel"></i> Import
                            </button>

                            <button onClick={handleExportExcel} className="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-emerald-700 whitespace-nowrap">
                                <i className="fa-solid fa-file-arrow-up"></i> Export
                            </button>

                            <button onClick={()=>{setEditItem(null); setIsModalOpen(true);}} className="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-blue-700 whitespace-nowrap">
                                <i className="fa-solid fa-plus"></i> Add Item
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-slate-50 text-slate-500 font-bold border-b">
                                    <tr>
                                        <th className="p-4">Part No</th>
                                        <th className="p-4">Description</th>
                                        <th className="p-4 text-right">Qty</th>
                                        <th className="p-4 text-center">Unit</th>
                                        <th className="p-4 text-right">Cost</th>
                                        <th className="p-4 text-center">Type</th>
                                        <th className="p-4 text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y">
                                    {filteredInventory.length === 0 ? (
                                        <tr><td colSpan="7" className="p-8 text-center text-slate-400">ไม่พบรายการสินค้า</td></tr>
                                    ) : (
                                        filteredInventory.map((item, i) => {
                                            const qty = parseFloat(item.qty) || 0;
                                            const min = parseFloat(item.min ?? item.minStock) || 0;
                                            const cost = parseFloat(item.cost) || 0;
                                            const unit = item.unit || "-";
                                            const type = item.type || "-";

                                            return (
                                                <tr key={i} className="hover:bg-slate-50 transition">
                                                    <td className="p-4 font-mono font-bold text-blue-600">{item.partNo}</td>
                                                    <td className="p-4 text-slate-600">{item.name}</td>
                                                    <td className={`p-4 text-right font-bold ${qty <= min ? 'text-red-500' : 'text-slate-700'}`}>
                                                        {qty.toLocaleString()}
                                                        {qty <= min && <i className="fa-solid fa-triangle-exclamation ml-2 text-xs" title="Low Stock"></i>}
                                                    </td>
                                                    <td className="p-4 text-center text-slate-400 text-xs">{unit}</td>
                                                    <td className="p-4 text-right text-slate-500">{cost.toLocaleString()}</td>
                                                    <td className="p-4 text-center"><span className="bg-slate-100 text-slate-500 px-2 py-1 rounded text-xs">{type}</span></td>
                                                    <td className="p-4 text-center">
                                                        <div className="flex justify-center gap-2">
                                                            <button onClick={()=>{setEditItem(item); setIsModalOpen(true);}} className="text-slate-400 hover:text-blue-600"><i className="fa-solid fa-pen-to-square"></i></button>
                                                            <button onClick={()=>handleDelete(item.partNo)} className="text-slate-400 hover:text-red-600"><i className="fa-solid fa-trash"></i></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
                                <div className="p-6 border-b flex justify-between items-center bg-slate-50">
                                    <h3 className="font-bold text-lg">{editItem ? 'Edit Item' : 'New Item'}</h3>
                                    <button onClick={()=>setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-xl"></i></button>
                                </div>
                                <form onSubmit={handleSaveItem} className="p-6 space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="col-span-2 sm:col-span-1">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Part No</label>
                                            <input name="partNo" defaultValue={editItem?.partNo} required className="w-full p-2 border rounded-lg bg-slate-50 outline-none focus:ring-2 focus:ring-blue-100" readOnly={!!editItem} />
                                        </div>
                                        <div className="col-span-2 sm:col-span-1">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Type</label>
                                            <select name="type" defaultValue={editItem?.type || "General"} className="w-full p-2 border rounded-lg bg-white outline-none focus:ring-2 focus:ring-blue-100">
                                                <option value="General">General</option>
                                                <option value="Raw Material">Raw Material</option>
                                                <option value="Work in Process">Work in Process</option>
                                                <option value="Finished Goods">Finished Goods</option>
                                            </select>
                                        </div>
                                        <div className="col-span-2">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Description</label>
                                            <input name="name" defaultValue={editItem?.name} required className="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-100" />
                                        </div>
                                        <div className="col-span-1">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Quantity</label>
                                            <input name="qty" type="number" step="0.01" defaultValue={editItem?.qty} required className="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-100" />
                                        </div>
                                        <div className="col-span-1">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Unit</label>
                                            <input name="unit" defaultValue={editItem?.unit || "pcs"} className="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-100" />
                                        </div>
                                        <div className="col-span-1">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Cost</label>
                                            <input name="cost" type="number" step="0.01" defaultValue={editItem?.cost} className="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-100" />
                                        </div>
                                        <div className="col-span-1">
                                            <label className="block text-xs font-bold text-slate-500 mb-1">Safety Stock (Min)</label>
                                            <input name="min" type="number" defaultValue={editItem?.min || editItem?.minStock} className="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-100" />
                                        </div>
                                    </div>
                                    <div className="pt-4 flex gap-3">
                                        <button type="button" onClick={()=>setIsModalOpen(false)} className="flex-1 py-3 bg-slate-100 text-slate-500 font-bold rounded-xl hover:bg-slate-200">Cancel</button>
                                        <button type="submit" className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg">Save Item</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const StockCountView = ({ inventory, setInventory, addTransaction, currentUser, apiUrl, bomData }) => {
            const [countItems, setCountItems] = useState([]);
            const [inputPartNo, setInputPartNo] = useState("");
            const [inputQty, setInputQty] = useState(1);
            const [countName, setCountName] = useState(() => `SC-${new Date().toISOString().slice(0,10)}`);
            const [showSummary, setShowSummary] = useState(false);
            const [showConfirm, setShowConfirm] = useState(false);
            const [filterDiff, setFilterDiff] = useState('all');
            const [suggestions, setSuggestions] = useState([]);
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [selectedSugIdx, setSelectedSugIdx] = useState(-1);
            const [ocrProcessing, setOcrProcessing] = useState(false);
            const [ocrProgress, setOcrProgress] = useState(0);
            const [ocrResults, setOcrResults] = useState(null);
            const [showOcrModal, setShowOcrModal] = useState(false);
            const inputRef = useRef(null);
            const ocrFileRef = useRef(null);
            const suggestionsRef = useRef(null);

            useEffect(() => {
                if (inputRef.current) inputRef.current.focus();
            }, []);

            const allKnownParts = useMemo(() => {
                const parts = new Map();
                inventory.forEach(item => {
                    const pNo = String(item.partNo || "").trim().toUpperCase();
                    if (pNo) parts.set(pNo, { partNo: item.partNo, name: item.name || "", source: 'INV' });
                });
                if (bomData) {
                    Object.keys(bomData).forEach(sheet => {
                        const rows = bomData[sheet];
                        if (!rows) return;
                        rows.slice(1).forEach(row => {
                            const pNo = String(row[2] || "").trim().toUpperCase();
                            const name = String(row[3] || "").trim();
                            if (pNo && !parts.has(pNo)) {
                                parts.set(pNo, { partNo: row[2], name, source: 'BOM' });
                            }
                        });
                    });
                }
                return Array.from(parts.values());
            }, [inventory, bomData]);

            const fuzzyMatch = (query, target) => {
                query = String(query || "").toLowerCase();
                target = String(target || "").toLowerCase();
                if (!query) return 0;
                if (target === query) return 1.0;
                if (target.includes(query)) return 0.9;
                if (query.length <= 2) return target.startsWith(query) ? 0.8 : 0;
                let qi = 0;
                for (let ti = 0; ti < target.length && qi < query.length; ti++) {
                    if (target[ti] === query[qi]) qi++;
                }
                return qi === query.length ? 0.5 + (0.3 * query.length / target.length) : 0;
            };

            const handleInputChange = (val) => {
                setInputPartNo(val);
                setSelectedSugIdx(-1);
                const q = val.trim().toUpperCase();
                if (q.length < 1) { setSuggestions([]); setShowSuggestions(false); return; }

                const scored = allKnownParts.map(p => {
                    const pNoScore = fuzzyMatch(q, p.partNo);
                    const nameScore = fuzzyMatch(q, p.name) * 0.7;
                    return { ...p, score: Math.max(pNoScore, nameScore) };
                }).filter(p => p.score > 0.3).sort((a, b) => b.score - a.score).slice(0, 8);

                setSuggestions(scored);
                setShowSuggestions(scored.length > 0);
            };

            const handleSelectSuggestion = (partNo) => {
                setInputPartNo(partNo);
                setShowSuggestions(false);
                setSuggestions([]);
                if (inputRef.current) inputRef.current.focus();
            };

            const handleInputKeyDown = (e) => {
                if (showSuggestions && suggestions.length > 0) {
                    if (e.key === 'ArrowDown') { e.preventDefault(); setSelectedSugIdx(prev => Math.min(prev + 1, suggestions.length - 1)); return; }
                    if (e.key === 'ArrowUp') { e.preventDefault(); setSelectedSugIdx(prev => Math.max(prev - 1, -1)); return; }
                    if (e.key === 'Tab' && selectedSugIdx >= 0) { e.preventDefault(); handleSelectSuggestion(suggestions[selectedSugIdx].partNo); return; }
                    if (e.key === 'Enter' && selectedSugIdx >= 0) { e.preventDefault(); handleSelectSuggestion(suggestions[selectedSugIdx].partNo); return; }
                    if (e.key === 'Escape') { setShowSuggestions(false); return; }
                }
                if (e.key === 'Enter') handleAdd();
            };

            const handleAdd = (partNoOverride, qtyOverride) => {
                const pNo = (partNoOverride || inputPartNo).trim().toUpperCase();
                if (!pNo) return;
                const qty = parseFloat(qtyOverride || inputQty) || 1;

                setCountItems(prev => {
                    const existing = prev.find(i => i.partNo === pNo);
                    if (existing) {
                        return prev.map(i => i.partNo === pNo ? { ...i, counted: i.counted + qty } : i);
                    }
                    const invItem = inventory.find(i => String(i.partNo).toUpperCase() === pNo);
                    const bomPart = allKnownParts.find(p => String(p.partNo).toUpperCase() === pNo);
                    const name = invItem ? invItem.name : (bomPart ? bomPart.name : "(ไม่พบในระบบ)");
                    return [...prev, {
                        partNo: pNo,
                        name: name,
                        systemQty: invItem ? (parseFloat(invItem.qty) || 0) : 0,
                        counted: qty,
                        inSystem: !!invItem
                    }];
                });

                setInputPartNo("");
                setInputQty(1);
                setShowSuggestions(false);
                if (inputRef.current) inputRef.current.focus();
            };

            const handleRemoveItem = (partNo) => {
                setCountItems(prev => prev.filter(i => i.partNo !== partNo));
            };

            const handleEditCounted = (partNo, newQty) => {
                setCountItems(prev => prev.map(i => i.partNo === partNo ? { ...i, counted: parseFloat(newQty) || 0 } : i));
            };

            const handleClearAll = () => {
                if (countItems.length === 0) return;
                if (!confirm("ล้างรายการนับทั้งหมด?")) return;
                setCountItems([]);
                setShowSummary(false);
            };

            const handleApplyAdjust = async () => {
                const itemsToAdjust = countItems.filter(i => i.counted !== i.systemQty);
                if (itemsToAdjust.length === 0) { alert("ไม่มีรายการที่ต้อง Adjust"); return; }

                let updatedInv = [...inventory];
                itemsToAdjust.forEach(item => {
                    const idx = updatedInv.findIndex(i => String(i.partNo).toUpperCase() === item.partNo);
                    if (idx >= 0) {
                        updatedInv[idx] = { ...updatedInv[idx], qty: item.counted };
                    } else {
                        updatedInv.push({ partNo: item.partNo, name: item.name, qty: item.counted, location: '-', unit: 'PCS', minStock: 0 });
                    }
                });
                setInventory(updatedInv);

                if (apiUrl) {
                    fetch(apiUrl, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({
                            action: "bulk_stock_count",
                            items: itemsToAdjust.map(i => ({ partNo: i.partNo, name: i.name, counted: i.counted, systemQty: i.systemQty })),
                            countName: countName,
                            user: currentUser.name
                        })
                    });
                }

                alert(`ปรับสต๊อกเรียบร้อย ${itemsToAdjust.length} รายการ`);
                setShowConfirm(false);
                setCountItems([]);
                setShowSummary(false);
            };

            const handleExport = () => {
                const data = countItems.map(i => ({
                    PartNo: i.partNo,
                    Name: i.name,
                    SystemQty: i.systemQty,
                    Counted: i.counted,
                    Diff: i.counted - i.systemQty,
                    Status: i.counted === i.systemQty ? 'OK' : i.counted > i.systemQty ? 'Over' : 'Short'
                }));
                exportToExcel(data, `StockCount_${countName}`, "StockCount");
            };

            // --- OCR ---
            const ocrFuzzyMatchPart = (rawText) => {
                const cleaned = rawText.replace(/[^a-zA-Z0-9\-_.\/\s]/g, '').trim().toUpperCase();
                if (!cleaned) return null;

                const tokens = cleaned.split(/\s+/);
                let bestMatch = null;
                let bestScore = 0;

                for (const token of tokens) {
                    if (token.length < 2 || /^\d+$/.test(token)) continue;
                    for (const part of allKnownParts) {
                        const pNo = String(part.partNo).toUpperCase();
                        let score = 0;
                        if (pNo === token) { score = 1.0; }
                        else if (pNo.includes(token) || token.includes(pNo)) { score = 0.85; }
                        else {
                            const len1 = token.length, len2 = pNo.length, maxLen = Math.max(len1, len2);
                            if (maxLen === 0) continue;
                            const track = Array(len2 + 1).fill(null).map(() => Array(len1 + 1).fill(null));
                            for (let i = 0; i <= len1; i++) track[0][i] = i;
                            for (let j = 0; j <= len2; j++) track[j][0] = j;
                            for (let j = 1; j <= len2; j++) {
                                for (let i = 1; i <= len1; i++) {
                                    const ind = token[i-1] === pNo[j-1] ? 0 : 1;
                                    track[j][i] = Math.min(track[j][i-1]+1, track[j-1][i]+1, track[j-1][i-1]+ind);
                                }
                            }
                            score = 1 - (track[len2][len1] / maxLen);
                        }
                        if (score > bestScore && score >= 0.55) { bestScore = score; bestMatch = { ...part, score, ocrRaw: token }; }
                    }
                }
                return bestMatch;
            };

            const extractQtyFromLine = (line, matchedPartNo) => {
                let remaining = line;
                if (matchedPartNo) {
                    const idx = remaining.toUpperCase().indexOf(matchedPartNo.toUpperCase());
                    if (idx >= 0) remaining = remaining.substring(idx + matchedPartNo.length);
                }
                const nums = remaining.match(/\b(\d{1,5})\b/g);
                if (!nums) return 1;
                const candidates = nums.map(n => parseInt(n, 10)).filter(n => n > 0 && n <= 99999);
                return candidates.length > 0 ? candidates[0] : 1;
            };

            const resizeImage = (file, maxDim = 1600) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            let w = img.width, h = img.height;
                            if (w > maxDim || h > maxDim) {
                                const ratio = Math.min(maxDim / w, maxDim / h);
                                w = Math.round(w * ratio);
                                h = Math.round(h * ratio);
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = w; canvas.height = h;
                            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                            const dataUrl = canvas.toDataURL('image/png', 0.9);
                            resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/png' });
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const readFileAsBase64 = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (ev) => resolve(ev.target.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
            };

            const handleOcrUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                e.target.value = "";

                if (!apiUrl) { alert("กรุณาตั้งค่า API URL ก่อนใช้ OCR"); return; }

                setOcrProcessing(true);
                setOcrProgress(0);
                setOcrResults(null);
                setShowOcrModal(true);

                try {
                    setOcrProgress(20);
                    const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
                    let base64, mimeType;

                    if (isPdf) {
                        base64 = await readFileAsBase64(file);
                        mimeType = 'application/pdf';
                    } else {
                        const resized = await resizeImage(file);
                        base64 = resized.base64;
                        mimeType = resized.mimeType;
                    }

                    setOcrProgress(40);
                    const res = await fetch(apiUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "ocr_image", imageData: base64, mimeType })
                    });

                    setOcrProgress(80);
                    const json = await res.json();

                    if (json.status !== "success" || !json.text) {
                        throw new Error(json.message || "OCR ไม่สำเร็จ - ตรวจสอบว่าเปิด Drive API ใน Apps Script แล้ว");
                    }

                    setOcrProgress(90);
                    const lines = json.text.split('\n').filter(l => l.trim().length > 2);
                    const results = [];

                    for (const line of lines) {
                        const matched = ocrFuzzyMatchPart(line);
                        if (matched) {
                            const qty = extractQtyFromLine(line, matched.partNo);
                            const existing = results.find(r => r.partNo === matched.partNo);
                            if (existing) { existing.qty += qty; }
                            else {
                                results.push({
                                    partNo: matched.partNo,
                                    name: matched.name,
                                    qty: qty,
                                    confidence: matched.score,
                                    ocrRaw: matched.ocrRaw,
                                    ocrLine: line.trim(),
                                    selected: true
                                });
                            }
                        }
                    }

                    setOcrProgress(100);
                    setOcrResults({ rawText: json.text, items: results, totalLines: lines.length });
                } catch (err) {
                    alert("OCR Error: " + err.message);
                    setShowOcrModal(false);
                } finally {
                    setOcrProcessing(false);
                }
            };

            const handleOcrConfirm = () => {
                if (!ocrResults) return;
                const selected = ocrResults.items.filter(i => i.selected);
                selected.forEach(item => { handleAdd(item.partNo, item.qty); });
                setShowOcrModal(false);
                setOcrResults(null);
            };

            const toggleOcrItem = (idx) => {
                setOcrResults(prev => ({
                    ...prev,
                    items: prev.items.map((item, i) => i === idx ? { ...item, selected: !item.selected } : item)
                }));
            };

            const editOcrQty = (idx, newQty) => {
                setOcrResults(prev => ({
                    ...prev,
                    items: prev.items.map((item, i) => i === idx ? { ...item, qty: parseFloat(newQty) || 0 } : item)
                }));
            };

            const editOcrPartNo = (idx, newPartNo) => {
                const q = newPartNo.trim().toUpperCase();
                const exact = allKnownParts.find(p => String(p.partNo).toUpperCase() === q);
                const suggestions = exact ? [] : allKnownParts
                    .map(p => ({ ...p, score: fuzzyMatch(q, p.partNo) }))
                    .filter(p => p.score > 0.3)
                    .sort((a, b) => b.score - a.score)
                    .slice(0, 5);
                setOcrResults(prev => ({
                    ...prev,
                    items: prev.items.map((item, i) => i === idx ? {
                        ...item,
                        partNo: newPartNo,
                        name: exact ? exact.name : item.name,
                        _suggestions: suggestions,
                        _exactMatch: !!exact
                    } : item)
                }));
            };

            const selectOcrSuggestion = (idx, partNo, name) => {
                setOcrResults(prev => ({
                    ...prev,
                    items: prev.items.map((item, i) => i === idx ? {
                        ...item,
                        partNo: partNo,
                        name: name,
                        confidence: 1.0,
                        _suggestions: [],
                        _exactMatch: true
                    } : item)
                }));
            };

            const summaryData = useMemo(() => {
                return countItems.map(i => ({ ...i, diff: i.counted - i.systemQty }));
            }, [countItems]);

            const filteredSummary = useMemo(() => {
                if (filterDiff === 'all') return summaryData;
                if (filterDiff === 'diff') return summaryData.filter(i => i.diff !== 0);
                if (filterDiff === 'ok') return summaryData.filter(i => i.diff === 0);
                return summaryData;
            }, [summaryData, filterDiff]);

            const stats = useMemo(() => {
                const total = countItems.length;
                const matched = countItems.filter(i => i.counted === i.systemQty).length;
                const over = countItems.filter(i => i.counted > i.systemQty).length;
                const short = countItems.filter(i => i.counted < i.systemQty).length;
                return { total, matched, over, short };
            }, [countItems]);

            return (
                <div className="animate-fade-in space-y-6">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold flex items-center gap-2"><Icons.Clipboard className="text-indigo-600"/> นับสต๊อก</h2>
                            <p className="text-sm text-slate-400 mt-1">สแกน/พิมพ์ Part No หรืออัปโหลดรูปใบนับสต๊อก (OCR)</p>
                        </div>
                        <div className="flex items-center gap-2">
                            <input value={countName} onChange={e => setCountName(e.target.value)} className="p-2 border rounded-lg text-sm w-40 outline-none focus:ring-2 focus:ring-indigo-100" placeholder="ชื่อรอบนับ" />
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-sm border">
                        <div className="flex flex-col sm:flex-row gap-3">
                            <div className="flex-1 relative">
                                <label className="block text-xs font-bold text-slate-500 mb-1">Part No (สแกน/พิมพ์) <span className="text-indigo-400 font-normal">- พิมพ์เพื่อค้นหาอัตโนมัติ</span></label>
                                <input
                                    ref={inputRef}
                                    type="text"
                                    value={inputPartNo}
                                    onChange={e => handleInputChange(e.target.value)}
                                    onKeyDown={handleInputKeyDown}
                                    onBlur={() => setTimeout(() => setShowSuggestions(false), 200)}
                                    onFocus={() => { if (suggestions.length > 0) setShowSuggestions(true); }}
                                    className="w-full p-3 border-2 border-indigo-200 rounded-xl text-lg font-mono outline-none focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500"
                                    placeholder="สแกนบาร์โค้ด หรือพิมพ์รหัส/ชื่อ..."
                                    autoComplete="off"
                                />
                                {showSuggestions && suggestions.length > 0 && (
                                    <div ref={suggestionsRef} className="absolute z-40 left-0 right-0 top-full mt-1 bg-white border-2 border-indigo-200 rounded-xl shadow-2xl overflow-hidden max-h-64 overflow-y-auto">
                                        {suggestions.map((s, i) => (
                                            <button
                                                key={s.partNo}
                                                onMouseDown={(e) => { e.preventDefault(); handleSelectSuggestion(s.partNo); }}
                                                className={`w-full text-left px-4 py-3 flex items-center gap-3 border-b last:border-b-0 transition ${i === selectedSugIdx ? 'bg-indigo-50' : 'hover:bg-slate-50'}`}
                                            >
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-mono font-bold text-blue-700 text-sm">{s.partNo}</div>
                                                    <div className="text-xs text-slate-400 truncate">{s.name}</div>
                                                </div>
                                                <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${s.source === 'INV' ? 'bg-green-100 text-green-600' : 'bg-purple-100 text-purple-600'}`}>
                                                    {s.source === 'INV' ? 'คลัง' : 'BOM'}
                                                </span>
                                                <span className="text-[10px] text-slate-300">{Math.round(s.score * 100)}%</span>
                                            </button>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div className="w-24">
                                <label className="block text-xs font-bold text-slate-500 mb-1">จำนวน</label>
                                <input
                                    type="number"
                                    value={inputQty}
                                    onChange={e => setInputQty(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Enter') handleAdd(); }}
                                    className="w-full p-3 border rounded-xl text-lg text-center outline-none focus:ring-2 focus:ring-indigo-100"
                                    min="1"
                                />
                            </div>
                            <div className="flex items-end gap-2">
                                <button onClick={() => handleAdd()} className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold text-lg hover:bg-indigo-700 shadow-lg flex items-center gap-2 whitespace-nowrap">
                                    <Icons.Plus/> เพิ่ม
                                </button>
                                <input type="file" ref={ocrFileRef} onChange={handleOcrUpload} className="hidden" accept="image/*,.pdf" />
                                <button onClick={() => ocrFileRef.current.click()} className="bg-amber-500 text-white px-4 py-3 rounded-xl font-bold text-lg hover:bg-amber-600 shadow-lg flex items-center gap-2 whitespace-nowrap" title="OCR - อ่านจากรูป/PDF ใบนับสต๊อก">
                                    <i className="fa-solid fa-camera"></i>
                                </button>
                            </div>
                        </div>

                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <div className="bg-white p-6 rounded-2xl w-full max-w-sm animate-fade-in shadow-xl" onClick={e=>e.stopPropagation()}>
                                <h3 className="font-bold mb-4">{editUser ? 'Edit User' : 'Add New User'}</h3>
                                <form onSubmit={handleSaveUserForm} className="space-y-3">
                                    <input name="username" defaultValue={editUser?.username} className="w-full p-2 border rounded" placeholder="Username" disabled={!!editUser}/>
                                    <input name="name" defaultValue={editUser?.name} className="w-full p-2 border rounded" placeholder="Display Name"/>
                                    <input name="password" type="password" className="w-full p-2 border rounded" placeholder={editUser ? "Password (Leave blank to keep)" : "Password"}/>
                                    <select name="role" defaultValue={editUser?.role || 'STAFF'} className="w-full p-2 border rounded bg-white">
                                        <option value="STAFF">STAFF</option>
                                        <option value="ADMIN">ADMIN</option>
                                    </select>
                                    <div className="flex gap-2 mt-4">
                                        <button type="button" onClick={()=>setUserModal(false)} className="flex-1 py-2 bg-slate-100 rounded-lg">Cancel</button>
                                        <button type="submit" className="flex-1 py-2 bg-green-600 text-white rounded-lg font-bold">Save</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
